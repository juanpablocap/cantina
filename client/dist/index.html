            ))}
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {categorias.filter(cat => !prodCatFilter || cat.id === prodCatFilter).map(cat => {
              const prods = productos.filter(p => p.cat_id === cat.id);
              if (prods.length === 0) return null;
              return (
                <div key={cat.id}>
                  <div style={{ fontSize: 12, fontWeight: 800, color: cat.color, marginBottom: 8, marginTop: 8, display: "flex", alignItems: "center", gap: 6 }}>
                    {cat.emoji} {cat.nombre}

                    <button onClick={() => { setProductoForm(null); setCategoriaForm({ mode: "editar", id: cat.id, nombre: cat.nombre, emoji: cat.emoji || "📦", color: cat.color || "#6B7080", despacho_directo: cat.despacho_directo, orden: cat.orden }); window.scrollTo({ top: 0, behavior: "smooth" }); }} style={{
                      marginLeft: 4, padding: "2px 8px", borderRadius: 6, border: `1px solid ${S.border}`, background: "transparent",
                      color: S.muted, fontSize: 10, fontWeight: 700, cursor: "pointer",
                    }}>✏️ editar</button>
                  </div>
                  {prods.map(p => {
                    const stockBajo = p.stock <= p.stock_min;
                    const sinStock = p.stock <= 0;
                    return (
                      <div key={p.id} className={stockBajo && !sinStock ? "stock-low" : ""} style={{
                        display: "flex", alignItems: "center", gap: 14, padding: "12px 16px", borderRadius: 12,
                        background: S.surface, border: `1px solid ${sinStock ? S.danger + "50" : stockBajo ? S.danger + "50" : S.border}`, marginBottom: 6,
                        position: "relative", overflow: "hidden", opacity: sinStock ? 0.5 : 1,
                      }}>
                        {sinStock && (
                          <div style={{ position: "absolute", top: "50%", left: 0, right: 0, height: 6, background: S.danger, transform: "rotate(-2deg)", opacity: 0.7 }} />

                        <span style={{ fontSize: 22 }}>{cat.emoji}</span>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontWeight: 700, fontSize: 14, color: S.text, textDecoration: sinStock ? "line-through" : "none", textDecorationColor: S.danger }}>{p.nombre}</div>
                          <div style={{ fontSize: 11, color: S.muted }}>
                            Código: {p.codigo || "—"}
                          </div>
                        </div>
                        <div style={{ textAlign: "right", marginRight: 8 }}>
                          {editingProd?.id === p.id && editingProd?.field === 'precio' ? (
                            <input type="number" min="0" autoFocus value={editingProd.value}
                              onChange={e => setEditingProd(prev => ({...prev, value: e.target.value}))}
                              onKeyDown={e => {
                                if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); const np = Math.max(0, Number(editingProd.value) || 0); setProductos(prev => prev.map(x => x.id === p.id ? {...x, precio: np} : x)); apiFetch(`/productos/${p.id}`, { method: 'PUT', body: { nombre: p.nombre, precio: np, stock: p.stock, cat_id: p.cat_id, cocina: p.cocina } }); if (e.key === 'Tab') { setEditingProd({ id: p.id, field: 'stock', value: String(p.stock) }); } else setEditingProd(null); }
                                if (e.key === 'Escape') setEditingProd(null);
                              }}
                              onBlur={() => { if (editingProd?.field === 'precio') { const np = Math.max(0, Number(editingProd.value) || 0); setProductos(prev => prev.map(x => x.id === p.id ? {...x, precio: np} : x)); apiFetch(`/productos/${p.id}`, { method: 'PUT', body: { nombre: p.nombre, precio: np, stock: p.stock, cat_id: p.cat_id, cocina: p.cocina } }); setEditingProd(null); } }}
                              style={{ width: 90, textAlign: "right", background: S.bg, border: `2px solid ${S.accent}`, borderRadius: 8, color: S.accent, fontSize: 15, fontWeight: 900, padding: "4px 8px", outline: "none" }} />
                          ) : (
                            <div title="Clic para editar precio" onClick={() => setEditingProd({ id: p.id, field: 'precio', value: String(p.precio) })} style={{ fontWeight: 900, fontSize: 16, color: S.accent, cursor: "text", borderRadius: 6, padding: "2px 4px" }}>${p.precio.toLocaleString()}</div>
                          )}
                        </div>
                        {/* Stock +/- controls */}
                        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                          <button onClick={async () => { const ns = Math.max(0, p.stock - 1); setProductos(prev => prev.map(x => x.id === p.id ? { ...x, stock: ns } : x)); await apiFetch(`/productos/${p.id}`, { method: 'PUT', body: { nombre: p.nombre, precio: p.precio, stock: ns, cat_id: p.cat_id, cocina: p.cocina } }); }} style={{
                            width: 32, height: 32, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg,
                            color: S.text, fontSize: 16, fontWeight: 800, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                          }}>−</button>
                          {editingProd?.id === p.id && editingProd?.field === 'stock' ? (
                            <input type="number" min="0" autoFocus value={editingProd.value}
                              onChange={e => setEditingProd(prev => ({...prev, value: e.target.value}))}
                              onKeyDown={e => {
                                if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); const ns = Math.max(0, Number(editingProd.value) || 0); setProductos(prev => prev.map(x => x.id === p.id ? {...x, stock: ns} : x)); apiFetch(`/productos/${p.id}`, { method: 'PUT', body: { nombre: p.nombre, precio: p.precio, stock: ns, cat_id: p.cat_id, cocina: p.cocina } }); setEditingProd(null); }
                                if (e.key === 'Escape') setEditingProd(null);
                              }}
                              onBlur={() => { if (editingProd?.field === 'stock') { const ns = Math.max(0, Number(editingProd.value) || 0); setProductos(prev => prev.map(x => x.id === p.id ? {...x, stock: ns} : x)); apiFetch(`/productos/${p.id}`, { method: 'PUT', body: { nombre: p.nombre, precio: p.precio, stock: ns, cat_id: p.cat_id, cocina: p.cocina } }); setEditingProd(null); } }}
                              style={{ width: 52, textAlign: "center", background: S.bg, border: `2px solid ${stockBajo ? S.danger : S.accent}`, borderRadius: 8, color: stockBajo ? S.danger : S.text, fontSize: 15, fontWeight: 800, padding: "4px 2px", outline: "none" }} />
                          ) : (
                            <button onClick={() => setEditingProd({ id: p.id, field: 'stock', value: String(p.stock) })} title="Clic para editar stock" style={{
                              width: 52, padding: "6px 4px", borderRadius: 8, border: `2px solid ${stockBajo ? S.danger : S.border}`,
                              background: S.bg, color: stockBajo ? S.danger : S.text, fontSize: 15, fontWeight: 800, textAlign: "center",
                              cursor: "pointer",
                            }}>{p.stock}</button>
                          )}
                          <button onClick={async () => { const ns = p.stock + 1; setProductos(prev => prev.map(x => x.id === p.id ? { ...x, stock: ns } : x)); await apiFetch(`/productos/${p.id}`, { method: 'PUT', body: { nombre: p.nombre, precio: p.precio, stock: ns, cat_id: p.cat_id, cocina: p.cocina } }); }} style={{
                            width: 32, height: 32, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg,
                            color: S.success, fontSize: 16, fontWeight: 800, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center",
                          }}>+</button>
                          <button onClick={() => setProductoForm({ mode: "editar", id: p.id, nombre: p.nombre, precio: String(p.precio), stock: String(p.stock), cat_id: p.cat_id, cocina: p.cocina })} style={{
                            width: 28, height: 28, borderRadius: 6, border: `1px solid ${S.border}`, background: "transparent",
                            color: S.muted, fontSize: 11, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", marginLeft: 4,
                          }}>✏️</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* ========================================= */}
      {/* TAB: CAJA — 3 solapas: Hoy / Historial / Estadísticas */}
      {/* ========================================= */}
      {tab === "caja" && (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>

          {/* Barra de sub-solapas */}
          <div style={{ display: "flex", gap: 4, padding: "14px 24px 0", borderBottom: `1px solid ${S.border}`, flexShrink: 0, background: S.surface }}>
            {[
              { key: "hoy", label: "Hoy" },
              { key: "historial", label: "Historial" },
              { key: "estadisticas", label: "Estadísticas" },
            ].map(({ key, label }) => (
              <button key={key} onClick={() => setCajaTab(key)} style={{
                padding: "9px 22px", borderRadius: "8px 8px 0 0", border: "none",
                borderBottom: cajaTab === key ? `2px solid ${S.accent}` : "2px solid transparent",
                background: "transparent",
                color: cajaTab === key ? S.accent : S.muted,
                fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}>{label}</button>
            ))}
          </div>

          {/* ---- SOLAPA HOY ---- */}
          {cajaTab === "hoy" && (
            <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
                <div>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em" }}>CAJA DEL DÍA</div>
                  <div style={{ fontSize: 13, color: S.muted, marginTop: 4 }}>{new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div>
                </div>
                <button onClick={hacerCierreCaja} style={{
                  padding: "12px 24px", borderRadius: 12, border: "none", background: S.accent, color: "#fff",
                  fontSize: 14, fontWeight: 800, cursor: "pointer",
                }}>📊 Hacer Cierre de Caja</button>
              </div>

              {/* Tarjetas resumen */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 16, marginBottom: 24 }}>
                {[
                  { label: "EFECTIVO", emoji: "💵", color: S.success, monto: cajaMovimientos.filter(m => m.metodo === "efectivo").reduce((s, m) => s + m.monto, 0) },
                  { label: "TRANSFERENCIAS", emoji: "📱", color: S.info, monto: cajaMovimientos.filter(m => m.metodo === "transferencia").reduce((s, m) => s + m.monto, 0) },
                  { label: "FIADO", emoji: "📋", color: S.warning, monto: cajaMovimientos.filter(m => m.metodo === "cuenta_corriente").reduce((s, m) => s + m.monto, 0) },
                  { label: "TOTAL DEL DÍA", emoji: "💰", color: S.accent, monto: cajaMovimientos.reduce((s, m) => s + m.monto, 0) },
                ].map((c, i) => (
                  <div key={i} style={{ padding: 20, borderRadius: 16, background: S.surface, border: `2px solid ${c.color}30`, textAlign: "center" }}>
                    <div style={{ fontSize: 28, marginBottom: 8 }}>{c.emoji}</div>
                    <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.06em", marginBottom: 6 }}>{c.label}</div>
                    <div style={{ fontSize: 28, fontWeight: 900, color: c.color }}>${c.monto.toLocaleString()}</div>
                  </div>
                ))}
              </div>

              {/* Cobros pendientes */}
              {pedidos.filter(p => !p.cobrado && p.estado !== 'cancelado').length > 0 && (
                <div style={{ marginBottom: 24 }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.danger, letterSpacing: "0.08em", marginBottom: 12 }}>
                    ⚠️ COBROS PENDIENTES ({pedidos.filter(p => !p.cobrado && p.estado !== 'cancelado').length})
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(240px, 1fr))", gap: 12 }}>
                    {pedidos.filter(p => !p.cobrado && p.estado !== 'cancelado').map(p => (
                      <div key={p.id} className="pulse-border" style={{ padding: 14, borderRadius: 12, background: S.surface, border: `2px solid ${S.danger}40` }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div>
                            <span style={{ fontWeight: 800, fontSize: 14 }}>#{String(p.numero).padStart(3, "0")}</span>
                            <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>
                              {p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? `Barra (${p.nombre_cliente || "?"})` : "Llevar"}
                            </span>
                          </div>
                          <span style={{ fontWeight: 900, color: S.accent }}>${p.total.toLocaleString()}</span>
                        </div>
                        <button onClick={() => setCobrandoPedido(p)} style={{
                          marginTop: 8, width: "100%", padding: "8px 0", borderRadius: 8, border: "none",
                          background: S.accent, color: "#fff", fontSize: 12, fontWeight: 800, cursor: "pointer",
                        }}>💰 Cobrar ahora</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Log de movimientos */}
              <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 12 }}>
                MOVIMIENTOS ({cajaMovimientos.length})
              </div>
              {cajaMovimientos.length === 0 ? (
                <div style={{ textAlign: "center", padding: "40px 0", color: S.muted, fontSize: 13 }}>Sin movimientos todavía</div>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                  {[...cajaMovimientos].reverse().map((m, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", padding: "12px 16px", borderRadius: 10, background: S.surface, border: `1px solid ${S.border}` }}>
                      <span style={{ fontSize: 20, marginRight: 12 }}>{m.metodo === "efectivo" ? "💵" : m.metodo === "transferencia" ? "📱" : "📋"}</span>
                      <div style={{ flex: 1 }}>

                    setArqueoEfectivo("");
                  }} style={{ flex: 2, padding: "12px 0", borderRadius: 12, border: "none", background: S.success, color: "#000", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>
                    ✅ Confirmar y guardar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ========================================= */}
      {/* REPORTE DE CIERRE (kiosk full-screen) */}
      {/* ========================================= */}
      {reporteCierre && (() => {
        const r = reporteCierre;
        const fecha = new Date(r.fecha);
        const fechaStr = fecha.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        const horaStr = fecha.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
        const peds = r.pedidosCobrados || [];

        // Aggregate: what was consumed
        const consumoMap = {};
        peds.forEach(p => {
          p.items.forEach(i => {
            const key = itemNombre(i);
            if (!consumoMap[key]) consumoMap[key] = { nombre: key, cantidad: 0, total: 0, precio: i.precio };
            consumoMap[key].cantidad += i.cantidad;
            consumoMap[key].total += i.precio * i.cantidad;
          });
        });
        const consumoList = Object.values(consumoMap).sort((a, b) => b.total - a.total);

        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 200, background: S.bg, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            {/* Header */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 28px", background: S.surface, borderBottom: `2px solid ${S.border}`, flexShrink: 0 }}>
              <div>
                <div style={{ fontSize: 20, fontWeight: 900 }}>📊 Cierre de Caja</div>
                <div style={{ fontSize: 12, color: S.muted }}>{fechaStr} · Cierre: {horaStr}</div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => descargarCierreHtml(r)} style={{
                  padding: "10px 20px", borderRadius: 10, border: `1px solid ${S.border}`, background: S.surface,
                  color: S.text, fontSize: 13, fontWeight: 700, cursor: "pointer",
                }}>💾 Descargar</button>
                <button onClick={() => setReporteCierre(null)} style={{
                  padding: "10px 20px", borderRadius: 10, border: "none", background: S.accent,
                  color: "#fff", fontSize: 13, fontWeight: 800, cursor: "pointer",
                }}>✕ Cerrar</button>
              </div>
            </div>

            <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
              {/* Summary cards */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 24 }}>
                {[
                  { label: "EFECTIVO", emoji: "💵", color: S.success, monto: r.efectivo },
                  { label: "TRANSFERENCIAS", emoji: "📱", color: S.info, monto: r.transferencia },
                  { label: "FIADO", emoji: "📋", color: S.warning, monto: r.fiado },
                  { label: "TOTAL", emoji: "💰", color: S.accent, monto: r.totalVentas },
                ].map((c, i) => (
                  <div key={i} style={{ padding: 18, borderRadius: 14, background: S.surface, border: `2px solid ${c.color}25`, textAlign: "center" }}>
                    <div style={{ fontSize: 24, marginBottom: 6 }}>{c.emoji}</div>
                    <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.06em" }}>{c.label}</div>
                    <div style={{ fontSize: 26, fontWeight: 900, color: c.color, marginTop: 4 }}>${c.monto.toLocaleString()}</div>
                  </div>
                ))}
              </div>

              {/* Arqueo result if available */}
              {r.arqueoEfectivo !== null && r.arqueoEfectivo !== undefined && (
                <div style={{ padding: "12px 16px", borderRadius: 12, background: S.surface, border: `1px solid ${r.diferencia === 0 ? S.success : S.danger}30`, marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <span style={{ fontSize: 11, fontWeight: 800, color: S.muted }}>💰 ARQUEO: </span>
                    <span style={{ fontSize: 14, fontWeight: 800, color: S.text }}>Efectivo real ${r.arqueoEfectivo.toLocaleString()} vs teórico ${r.efectivo.toLocaleString()}</span>
                  </div>
                  <span style={{ fontWeight: 900, fontSize: 16, color: r.diferencia === 0 ? S.success : r.diferencia > 0 ? S.info : S.danger }}>
                    {r.diferencia === 0 ? "✅ Cuadra" : r.diferencia > 0 ? `+$${r.diferencia.toLocaleString()} sobrante` : `-$${Math.abs(r.diferencia).toLocaleString()} faltante`}
                  </span>
                </div>
              )}

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
                {/* LEFT: Products consumed */}
                <div>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 10 }}>
                    🍽️ PRODUCTOS CONSUMIDOS ({consumoList.length})
                  </div>
                  <div style={{ borderRadius: 12, overflow: "hidden", border: `1px solid ${S.border}` }}>
                    {/* Header row */}
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 60px 80px 90px", padding: "10px 14px", background: S.border + "40" }}>
                      {["PRODUCTO", "CANT", "PRECIO", "TOTAL"].map(h => (
                        <span key={h} style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.04em" }}>{h}</span>
                      ))}
                    </div>
                    {consumoList.map((item, idx) => (
                      <div key={idx} style={{ display: "grid", gridTemplateColumns: "1fr 60px 80px 90px", padding: "10px 14px", borderBottom: `1px solid ${S.border}20`, background: S.surface }}>
                        <span style={{ fontWeight: 600, fontSize: 13 }}>{itemNombre(item)}</span>
                        <span style={{ fontWeight: 800, fontSize: 13 }}>{item.cantidad}</span>
                        <span style={{ fontSize: 12, color: S.muted }}>${item.precio.toLocaleString()}</span>
                        <span style={{ fontWeight: 800, fontSize: 13, color: S.accent }}>${item.total.toLocaleString()}</span>
                      </div>
                    ))}
                    {/* Total row */}
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 60px 80px 90px", padding: "12px 14px", background: S.bg, borderTop: `2px solid ${S.border}` }}>
                      <span style={{ fontWeight: 900, fontSize: 14 }}>TOTAL</span>
                      <span style={{ fontWeight: 900, fontSize: 14 }}>{consumoList.reduce((s, i) => s + i.cantidad, 0)}</span>
                      <span></span>
                      <span style={{ fontWeight: 900, fontSize: 16, color: S.accent }}>${r.totalVentas.toLocaleString()}</span>
                    </div>
                  </div>
                </div>

                {/* RIGHT: Orders detail */}
                <div>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 10 }}>
                    📋 DETALLE DE PEDIDOS ({peds.length})
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 500, overflowY: "auto" }}>
                    {peds.map(p => {
                      const metodoIcon = p.metodo_pago === "efectivo" ? "💵" : p.metodo_pago === "transferencia" ? "📱" : "📋";
                      const metodoLabel = p.metodo_pago === "efectivo" ? "Efectivo" : p.metodo_pago === "transferencia" ? "Transfer." : "Fiado";
                      const hora = new Date(p.createdAt).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
                      const tipo = p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? "Barra" : "Llevar";
                      return (
                        <div key={p.id} style={{ padding: "10px 14px", borderRadius: 10, background: S.surface, border: `1px solid ${S.border}` }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ fontWeight: 800, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }}>#{String(p.numero).padStart(3, "0")}</span>
                              <span style={{ fontSize: 11, color: S.muted }}>{hora}</span>
                              <span style={{ fontSize: 11, color: S.muted }}>· {tipo}</span>
                              {p.nombre_cliente && <span style={{ fontSize: 11, color: S.info }}>· 📢 {p.nombre_cliente}</span>}
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: p.metodo_pago === "efectivo" ? S.success + "20" : p.metodo_pago === "transferencia" ? S.info + "20" : S.warning + "20", color: p.metodo_pago === "efectivo" ? S.success : p.metodo_pago === "transferencia" ? S.info : S.warning }}>
                                {metodoIcon} {metodoLabel}
                              </span>
                              <span style={{ fontWeight: 900, fontSize: 14, color: S.accent }}>${p.total.toLocaleString()}</span>
                            </div>
                          </div>
                          <div style={{ fontSize: 11, color: S.muted, lineHeight: 1.5 }}>
                            {p.items.map((it, idx) => (
                              <span key={idx}>
                                <span style={{ fontWeight: 700, color: S.text }}>{it.cantidad}x</span> {itemNombre(it)} <span style={{ color: S.accent }}>${(it.precio * it.cantidad).toLocaleString()}</span>
                                {idx < p.items.length - 1 ? " · " : ""}
                              </span>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Cuentas (fiados) */}
              {peds.filter(p => p.metodo_pago === "cuenta_corriente").length > 0 && (
                <div style={{ marginTop: 24 }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.warning, letterSpacing: "0.08em", marginBottom: 10 }}>
                    📋 CUENTAS CORRIENTES DEL DÍA
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {peds.filter(p => p.metodo_pago === "cuenta_corriente").map(p => {
                      const cli = clientes.find(c => c.id === p.cliente_id);
                      return (
                        <div key={p.id} style={{ display: "flex", alignItems: "center", padding: "10px 14px", borderRadius: 10, background: S.surface, border: `1px solid ${S.warning}30` }}>
                          <span style={{ fontSize: 16, marginRight: 10 }}>📋</span>
                          <div style={{ flex: 1 }}>
                            <span style={{ fontWeight: 700, fontSize: 13 }}>{cli ? `${cli.nombre} ${cli.apellido}` : "Cliente desconocido"}</span>
                            <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>#{String(p.numero).padStart(3, "0")}</span>
                          </div>
                          <span style={{ fontWeight: 900, fontSize: 15, color: S.warning }}>${p.total.toLocaleString()}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* MODAL: PIN CONFIRMACIÓN */}
      {/* ========================================= */}
      {pinModal && (() => {
        const cli = pinModal.clienteId ? clientes.find(c => c.id === pinModal.clienteId) : null;
        if (pinModal.clienteId && !cli && pinModal.action !== "cancelar") return null;
        const PIN_CORRECTO = pinModal.action === "resetProduccion" ? "0000" : "1234";
        const pinCompleto = pinModal.pin.length === 4;
        const pinCorrecto = pinModal.pin === PIN_CORRECTO;
        const pinIncorrecto = pinCompleto && !pinCorrecto;

        const doAction = async () => {
          if (pinModal.action === "eliminar" && cli) {
            await apiFetch(`/clientes/${cli.id}`, { method: 'PUT', body: { activo: false } });
            setClientes(prev => prev.filter(x => x.id !== cli.id));
            showMsg("🗑 Cliente eliminado");
          } else if (pinModal.action === "pagar" && cli) {
            const monto = pinModal.pagoMonto;
            const result = await apiFetch(`/clientes/${cli.id}/pago`, { method: 'POST', body: { monto } });
            setClientes(prev => prev.map(c => c.id === cli.id ? { ...c, saldo: result ? result.saldo : Math.max(0, c.saldo - monto) } : c));
            setClientePagos(prev => [...prev, { id: Date.now(), cliente_id: cli.id, monto, fecha: new Date().toISOString() }]);
            setCajaMovimientos(prev => [...prev, { tipo: "pago_fiado", metodo: "efectivo", monto, pedido_num: null, referencia: `Pago ${cli.nombre} ${cli.apellido}`, ts: new Date().toISOString() }]);
            showMsg(result ? `✅ Pago de $${monto.toLocaleString()} registrado` : "❌ Error al registrar pago");
            setPagoForm(null);
          } else if (pinModal.action === "cancelar") {
            ejecutarCancelar(pinModal.pedidoId);
          } else if (pinModal.action === "eliminarUsuario") {
            await apiFetch(`/usuarios/${pinModal.userId}`, { method: 'DELETE' });
            setUsuarios(prev => prev.filter(u => u.id !== pinModal.userId));
            showMsg("🗑 Usuario eliminado");
          } else if (pinModal.action === "resetProduccion") {
            setPinModal(null);
            setResetProdModal({ status: "loading", message: "⏳ Borrando datos y haciendo backup de seguridad..." });
            const r = await apiFetch('/system/reset-produccion', { method: 'POST' });
            if (r && r.ok) {
              setPedidos([]); setProductos([]); setCategorias([]); setClientes([]);
              setResetProdModal({ status: "ok", message: "✅ Sistema reseteado.\nProductos, clientes, ventas y cierres eliminados." });
            } else {
              setResetProdModal({ status: "error", message: "❌ Error: " + (r?.error || "desconocido") });
            }
            return;
          }
          setPinModal(null);
        };

        const handlePinKey = (key) => {
          if (key === "clear") { setPinModal(prev => ({ ...prev, pin: "" })); return; }
          if (key === "back") { setPinModal(prev => ({ ...prev, pin: prev.pin.slice(0, -1) })); return; }
          if (pinModal.pin.length >= 4) return;
          const newPin = pinModal.pin + key;
          setPinModal(prev => ({ ...prev, pin: newPin }));
          if (newPin.length === 4 && newPin === PIN_CORRECTO) {
            setTimeout(doAction, 300);
          }
        };

        const actionTitle = pinModal.action === "eliminar" ? "Eliminar cliente" : pinModal.action === "cancelar" ? "Cancelar pedido" : pinModal.action === "eliminarUsuario" ? "Eliminar usuario" : pinModal.action === "resetProduccion" ? "Reset a producción" : "Confirmar pago";
        const actionIcon = pinModal.action === "eliminar" ? "🗑" : pinModal.action === "cancelar" ? "❌" : pinModal.action === "eliminarUsuario" ? "🗑" : pinModal.action === "resetProduccion" ? "⚠️" : "💵";
        const actionDesc = pinModal.action === "eliminar" ? `¿Eliminar a ${cli?.nombre} ${cli?.apellido}?`
          : pinModal.action === "cancelar" ? `¿Cancelar pedido #${String(pedidos.find(p => p.id === pinModal.pedidoId)?.numero || 0).padStart(3, "0")}? Se devuelve el stock.`
          : pinModal.action === "eliminarUsuario" ? `¿Eliminar usuario ${usuarios.find(u => u.id === pinModal.userId)?.nombre}?`
          : pinModal.action === "resetProduccion" ? "Borra productos, categorías, clientes, ventas, cierres y backups. Las imágenes del TV se conservan. Se hace backup de seguridad automático."
          : `Registrar pago de $${pinModal.pagoMonto?.toLocaleString()} a ${cli?.nombre} ${cli?.apellido}`;

        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
            onClick={() => setPinModal(null)}>
            <div className="anim-in" style={{ width: "100%", maxWidth: 360, padding: 28, borderRadius: 20, background: S.surface, border: `2px solid ${S.border}` }}
              onClick={e => e.stopPropagation()}>

              <div style={{ textAlign: "center", marginBottom: 20 }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>{actionIcon}</div>
                <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 4 }}>{actionTitle}</div>
                <div style={{ fontSize: 13, color: S.muted }}>{actionDesc}</div>
                <div style={{ fontSize: 12, color: S.warning, fontWeight: 700, marginTop: 8 }}>
                  Ingresá el PIN de administrador
                </div>
              </div>

              {/* PIN dots */}
              <div style={{ display: "flex", justifyContent: "center", gap: 16, marginBottom: 20 }}>
                {[0, 1, 2, 3].map(i => (
                  <div key={i} style={{
                    width: 16, height: 16, borderRadius: "50%", transition: "all 0.15s",
                    background: pinIncorrecto ? S.danger : i < pinModal.pin.length ? S.accent : S.border,
                    transform: i < pinModal.pin.length ? "scale(1.2)" : "scale(1)",
                  }} />
                ))}
              </div>

              {pinIncorrecto && (
                <div style={{ textAlign: "center", fontSize: 12, fontWeight: 800, color: S.danger, marginBottom: 12 }}>
                  ⚠️ PIN incorrecto
                </div>
              )}

              {/* Numpad */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
                {["1", "2", "3", "4", "5", "6", "7", "8", "9", "clear", "0", "back"].map(key => (
                  <button key={key} onClick={() => handlePinKey(key)} style={{
                    height: 52, borderRadius: 10, border: `1px solid ${S.border}`, background: key === "clear" || key === "back" ? S.border : S.bg,
                    color: S.text, fontSize: key === "clear" || key === "back" ? 14 : 20, fontWeight: 800, cursor: "pointer",
                  }}>
                    {key === "clear" ? "✕" : key === "back" ? "←" : key}
                  </button>
                ))}
              </div>

              <button onClick={() => setPinModal(null)} style={{
                marginTop: 14, width: "100%", padding: "10px 0", borderRadius: 10, border: `1px solid ${S.border}`,
                background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}>Cancelar</button>
            </div>
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TICKET MODAL (kiosk) */}
      {/* ========================================= */}
      {ticketVisible && (
        <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
          onClick={() => setTicketVisible(null)}>
          <div className="anim-in" style={{ width: 320, padding: 0, borderRadius: 16, background: "#fff", color: "#000", overflow: "hidden" }}
            onClick={e => e.stopPropagation()}>
            {/* Receipt */}
            <div style={{ padding: "20px 24px", textAlign: "center", borderBottom: "2px dashed #ddd" }}>
              <div style={{ fontSize: 18, fontWeight: 900, letterSpacing: "0.04em" }}>🍽️ CANTINA</div>
              <div style={{ fontSize: 11, color: "#888", marginTop: 4 }}>
                {new Date(ticketVisible.createdAt).toLocaleDateString("es-AR")} · {new Date(ticketVisible.createdAt).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, marginTop: 4 }}>
                Pedido {pedidoPrefix(ticketVisible)}{String(ticketVisible.numero).padStart(3, "0")}
                {ticketVisible.tipo === "mesa" && ` · Mesa ${ticketVisible.mesa_numero}`}
              </div>
            </div>
            <div style={{ padding: "12px 24px" }}>
              {ticketVisible.items.map((it, idx) => (
                <div key={idx} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: 13, borderBottom: "1px solid #f0f0f0" }}>
                  <span>{it.cantidad}x {itemNombre(it)}</span>
                  <span style={{ fontWeight: 700 }}>${(it.precio * it.cantidad).toLocaleString()}</span>
                </div>
              ))}
            </div>
            <div style={{ padding: "12px 24px", borderTop: "2px dashed #ddd", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 16, fontWeight: 900 }}>TOTAL</span>
              <span style={{ fontSize: 22, fontWeight: 900 }}>${ticketVisible.total.toLocaleString()}</span>
            </div>
            <div style={{ padding: "8px 24px 12px", textAlign: "center", fontSize: 11, color: "#888" }}>
              {ticketVisible.metodo_pago === "efectivo" ? "💵 Efectivo" : ticketVisible.metodo_pago === "transferencia" ? "📱 Transferencia" : "📋 Cuenta corriente"}
            </div>
            <div style={{ padding: "0 24px 16px", textAlign: "center", fontSize: 10, color: "#bbb" }}>
              ¡Gracias por su compra!
            </div>
            <button onClick={() => setTicketVisible(null)} style={{
              width: "100%", padding: "14px 0", border: "none", borderTop: "1px solid #eee",
              background: "#f8f8f8", color: "#333", fontSize: 14, fontWeight: 700, cursor: "pointer",
            }}>Cerrar</button>
          </div>
        </div>
      )}

      {/* ========================================= */}
      {/* MODAL: AGREGAR ITEM A PEDIDO */}
      {/* ========================================= */}
      {/* ── Modal editar pedido ─────────────────────────── */}
      {editarPedido && (() => {
        const totalEdit = editarPedido.items.reduce((s, i) => s + i.precio * i.cantidad, 0);
        const cambiarCantidad = (producto_id, delta) => setEditarPedido(prev => {
          const items = prev.items.map(i => i.producto_id === producto_id ? { ...i, cantidad: i.cantidad + delta } : i).filter(i => i.cantidad > 0);
          return { ...prev, items };
        });
        const agregarProducto = (p) => {
          const cat = p.categoria || getCat(p.cat_id);
          setEditarPedido(prev => {
            const existe = prev.items.find(i => i.producto_id === p.id);
            const items = existe
              ? prev.items.map(i => i.producto_id === p.id ? { ...i, cantidad: i.cantidad + 1 } : i)
              : [...prev.items, { producto_id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1, observaciones: "", cat_id: p.cat_id, despacho_directo: p.cocina ? false : cat.despacho_directo, sin_obs: p.sin_obs || false }];
            return { ...prev, items };
          });
        };
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.8)" }}
            onClick={() => setEditarPedido(null)}>
            <div className="anim-in" style={{ width: "100%", maxWidth: 520, maxHeight: "90vh", display: "flex", flexDirection: "column", borderRadius: 20, background: S.surface, border: `2px solid ${S.accent}`, overflow: "hidden" }}
              onClick={e => e.stopPropagation()}>

              {/* Header */}
              <div style={{ padding: "16px 20px", borderBottom: `1px solid ${S.border}`, flexShrink: 0 }}>
                <div style={{ fontSize: 15, fontWeight: 900 }}>✏️ Editar pedido #{String(editarPedido.numero).padStart(3, "0")}</div>
                <div style={{ fontSize: 11, color: S.muted, marginTop: 2 }}>Modificá los ítems antes de la entrega</div>
              </div>

              <div style={{ flex: 1, overflowY: "auto", padding: "12px 20px" }}>
                {/* Ítems actuales */}
                <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 8 }}>ÍTEMS DEL PEDIDO</div>

                  <div style={{ padding: "12px 0", color: S.danger, fontSize: 12, fontWeight: 700 }}>⚠️ Sin ítems — el pedido quedará vacío</div>

                          <div style={{ fontSize: 12, color: cat.color, fontWeight: 800 }}>${(item.precio * item.cantidad).toLocaleString()}</div>
                        </div>
                        <button onClick={() => cambiarCantidad(item.producto_id, -1)} style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontWeight: 900, cursor: "pointer", fontSize: 18, flexShrink: 0 }}>−</button>
                        <span style={{ fontWeight: 900, fontSize: 16, width: 28, textAlign: "center", flexShrink: 0 }}>{item.cantidad}</span>
                        <button onClick={() => cambiarCantidad(item.producto_id, 1)} style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontWeight: 900, cursor: "pointer", fontSize: 18, flexShrink: 0 }}>+</button>
                        <button onClick={() => setEditarPedido(prev => ({ ...prev, items: prev.items.filter(i => i.producto_id !== item.producto_id) }))} style={{ width: 34, height: 34, borderRadius: 8, border: "none", background: S.danger + "18", color: S.danger, cursor: "pointer", fontSize: 15, flexShrink: 0 }}>🗑</button>
                      </div>

                <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", margin: "16px 0 8px" }}>AGREGAR PRODUCTO</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: 6 }}>
                  {productos.map(p => {

                    const enPedido = editarPedido.items.find(i => i.producto_id === p.id);
                    return (
                      <button key={p.id} onClick={() => agregarProducto(p)} style={{
                        padding: 10, borderRadius: 10, border: `2px solid ${enPedido ? cat.color : S.border}`,
                        background: enPedido ? cat.color + "18" : S.bg, textAlign: "left", cursor: "pointer", position: "relative",
                      }}>
                        {enPedido && <span style={{ position: "absolute", top: 4, right: 4, width: 20, height: 20, borderRadius: "50%", background: cat.color, color: "#fff", fontSize: 10, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center" }}>{enPedido.cantidad}</span>}
                        <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 2 }}>{p.nombre}</div>
                        <div style={{ fontSize: 13, fontWeight: 900, color: cat.color }}>${p.precio.toLocaleString()}</div>
                      </button>
                    );

              </div>

              <div style={{ padding: "14px 20px", borderTop: `2px solid ${S.border}`, flexShrink: 0, background: S.surface }}>

                  <span style={{ fontSize: 13, color: S.muted, fontWeight: 600 }}>TOTAL</span>
                  <span style={{ fontSize: 22, fontWeight: 900 }}>${totalEdit.toLocaleString()}</span>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={async () => {
                    if (editarPedido.items.length === 0) return;
                    const result = await apiFetch(`/pedidos/${editarPedido.id}/items`, {
                      method: 'PUT',
                      body: { items: editarPedido.items.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad, precio: i.precio, observaciones: i.observaciones || "" })) }
                    });
                    if (result) {
                      setPedidos(prev => prev.map(p => p.id === editarPedido.id ? result : p));
                      setProductos(prev => prev.map(p => {
                        const item = result.items.find(i => i.producto_id === p.id);
                        return item ? { ...p, stock: p.stock } : p;
                      }));
                      showMsg(`✅ Pedido #${String(editarPedido.numero).padStart(3,"0")} actualizado`);
                      setEditarPedido(null);
                    }
                  }} disabled={editarPedido.items.length === 0} style={{
                    flex: 1, padding: "12px 0", borderRadius: 12, border: "none",
                    background: editarPedido.items.length > 0 ? S.success : S.border,
                    color: editarPedido.items.length > 0 ? "#000" : S.muted,
                    fontSize: 14, fontWeight: 900, cursor: editarPedido.items.length > 0 ? "pointer" : "not-allowed",
                  }}>💾 Guardar cambios</button>
                  <button onClick={() => setEditarPedido(null)} style={{
                    padding: "12px 20px", borderRadius: 12, border: `1px solid ${S.border}`,
                    background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
                  }}>Cancelar</button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {agregarItemPedido && (() => {
        const ped = pedidos.find(p => p.id === agregarItemPedido);
        if (!ped) return null;
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
            onClick={() => setAgregarItemPedido(null)}>
            <div className="anim-in" style={{ width: "100%", maxWidth: 500, maxHeight: "80vh", padding: 24, borderRadius: 20, background: S.surface, border: `2px solid ${S.border}`, overflowY: "auto" }}
              onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 12 }}>
                ➕ Agregar items al pedido #{String(ped.numero).padStart(3, "0")}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))", gap: 8 }}>
                {productos.map(p => {
                  const cat = p.categoria || getCat(p.cat_id);
                  return (
                    <button key={p.id} onClick={() => {
                      const esDirecto = p.cocina ? false : cat.despacho_directo;
                      const newItem = { producto_id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1, observaciones: "", despacho_directo: esDirecto, cat_id: p.cat_id, sin_obs: p.sin_obs || false };
                      setPedidos(prev => prev.map(x => {
                        if (x.id !== ped.id) return x;
                        const existente = x.items.find(i => i.producto_id === p.id);
                        const newItems = existente
                          ? x.items.map(i => i.producto_id === p.id ? { ...i, cantidad: i.cantidad + 1 } : i)
                          : [...x.items, newItem];
                        return { ...x, items: newItems, total: newItems.reduce((s, i) => s + i.precio * i.cantidad, 0) };
                      }));
                      setProductos(prev => prev.map(x => x.id === p.id ? { ...x, stock: x.stock - 1 } : x));
                      showMsg(`✅ ${p.nombre} agregado al #${String(ped.numero).padStart(3, "0")}`);
                    }} style={{
                      padding: 10, borderRadius: 10, border: `1px solid ${S.border}`, background: S.bg,
                      textAlign: "left", cursor: "pointer",
                    }}>
                      <div style={{ fontSize: 12, fontWeight: 700 }}>{p.nombre}</div>
                      <div style={{ fontSize: 14, fontWeight: 900, color: cat.color }}>${p.precio.toLocaleString()}</div>
                    </button>
                  );
                })}
              </div>
              <button onClick={() => setAgregarItemPedido(null)} style={{
                marginTop: 14, width: "100%", padding: "12px 0", borderRadius: 12, border: `1px solid ${S.border}`,
                background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}>Listo</button>
            </div>
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: USUARIOS */}
      {/* ========================================= */}
      {tab === "usuarios" && (
        <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em" }}>
              USUARIOS ({usuarios.length})
            </div>
            <button onClick={() => setUserForm({ mode: "nuevo", nombre: "", rol: "mozo", pin: "" })} style={{
              padding: "10px 20px", borderRadius: 10, border: "none", background: S.accent, color: "#fff",
              fontSize: 13, fontWeight: 800, cursor: "pointer",
            }}>+ Nuevo Usuario</button>
          </div>

          {/* User form */}
          {userForm && (
            <div className="anim-in" style={{ marginBottom: 16, padding: 20, borderRadius: 14, background: S.surface, border: `2px solid ${S.accent}` }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: S.accent, marginBottom: 12 }}>
                {userForm.mode === "nuevo" ? "➕ NUEVO USUARIO" : "✏️ EDITAR USUARIO"}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>Nombre</div>
                  <input type="text" autoFocus value={userForm.nombre}
                    onChange={e => setUserForm(prev => prev ? ({...prev, nombre: e.target.value}) : null)}
                    onKeyDown={e => { if (e.key === 'Escape') setUserForm(null); }}
                    placeholder="Nombre del usuario"
                    style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `2px solid ${userForm.nombre ? S.accent : S.border}`, background: S.bg, color: S.text, fontSize: 13, outline: "none", fontFamily: "'DM Sans', sans-serif" }} />
                </div>
                <div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>Rol</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    {["mozo", "cajero"].map(r => (
                      <button key={r} onClick={() => setUserForm(prev => ({ ...prev, rol: r }))} style={{
                        flex: 1, padding: "10px 0", borderRadius: 8, border: `2px solid ${userForm.rol === r ? S.accent : S.border}`,
                        background: userForm.rol === r ? S.accent : S.bg, color: userForm.rol === r ? "#fff" : S.text,
                        fontSize: 11, fontWeight: 800, cursor: "pointer", textTransform: "capitalize",
                      }}>{r === "mozo" ? "🧑 Mozo" : "🛒 Cajero"}</button>
                    ))}
                  </div>
                </div>
                <div style={{ gridColumn: "span 2" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>PIN (4 dígitos)</div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <div style={{ flex: 1, display: "flex", justifyContent: "center", gap: 10 }}>
                      {[0, 1, 2, 3].map(i => (
                        <div key={i} style={{ width: 14, height: 14, borderRadius: "50%", background: i < userForm.pin.length ? S.accent : S.border, transition: "all 0.15s" }} />
                      ))}
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 4 }}>
                      {["1","2","3","4","5","6","7","8","9","✕","0","←"].map(k => (
                        <button key={k} onClick={() => {
                          if (k === "✕") setUserForm(prev => ({ ...prev, pin: "" }));
                          else if (k === "←") setUserForm(prev => ({ ...prev, pin: prev.pin.slice(0, -1) }));
                          else if (userForm.pin.length < 4) setUserForm(prev => ({ ...prev, pin: prev.pin + k }));
                        }} style={{ width: 36, height: 36, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontSize: k === "✕" || k === "←" ? 12 : 14, fontWeight: 800, cursor: "pointer" }}>{k}</button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                <button onClick={() => {
                  if (!userForm.nombre.trim() || userForm.pin.length !== 4) return;
                  if (userForm.mode === "nuevo") {
                    if (usuarios.find(u => u.pin === userForm.pin)) { showMsg("⚠️ Ese PIN ya está en uso"); return; }
                    setUsuarios(prev => [...prev, { id: nextUserId, nombre: userForm.nombre, rol: userForm.rol, pin: userForm.pin }]);
                    setNextUserId(n => n + 1);
                    showMsg("✅ Usuario creado");
                  } else {
                    if (usuarios.find(u => u.pin === userForm.pin && u.id !== userForm.id)) { showMsg("⚠️ Ese PIN ya está en uso"); return; }
                    setUsuarios(prev => prev.map(u => u.id === userForm.id ? { ...u, nombre: userForm.nombre, rol: userForm.rol, pin: userForm.pin } : u));
                    showMsg("✅ Usuario actualizado");
                  }
                  setUserForm(null);
                }} disabled={!userForm.nombre.trim() || userForm.pin.length !== 4} style={{
                  padding: "10px 24px", borderRadius: 10, border: "none",
                  background: userForm.nombre.trim() && userForm.pin.length === 4 ? S.success : S.border,
                  color: userForm.nombre.trim() && userForm.pin.length === 4 ? "#000" : S.muted,
                  fontSize: 13, fontWeight: 800, cursor: userForm.nombre.trim() && userForm.pin.length === 4 ? "pointer" : "not-allowed",
                }}>💾 Guardar</button>
                <button onClick={() => setUserForm(null)} style={{ padding: "10px 24px", borderRadius: 10, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
              </div>
            </div>
          )}

          {/* User list */}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {usuarios.map(u => (
              <div key={u.id} className="anim-in" style={{ display: "flex", alignItems: "center", padding: "14px 16px", borderRadius: 12, background: S.surface, border: `1px solid ${S.border}`, gap: 14 }}>
                <div style={{ width: 44, height: 44, borderRadius: 12, background: u.rol === "admin" ? S.accent + "20" : u.rol === "cajero" ? S.success + "20" : S.info + "20", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22 }}>
                  {u.rol === "admin" ? "🔑" : u.rol === "cajero" ? "🛒" : "🧑"}
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 15, color: S.text }}>{u.nombre}</div>
                  <div style={{ fontSize: 11, color: S.muted, marginTop: 2 }}>
                    {u.rol === "admin" ? "Administrador" : u.rol === "cajero" ? "Cajero" : "Mozo"} · PIN: {"●".repeat(4)}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6 }}>
                  <button onClick={() => setUserForm({ mode: "editar", id: u.id, nombre: u.nombre, rol: u.rol, pin: u.pin })} style={{ padding: "8px 12px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.muted, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>✏️</button>
                  {usuarios.length > 1 && (
                    <button onClick={() => setPinModal({ action: "eliminarUsuario", userId: u.id, pin: "" })} style={{ padding: "8px 12px", borderRadius: 8, border: "none", background: S.danger + "18", color: S.danger, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>🗑</button>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ========================================= */}
      {/* TAB: DASHBOARD */}
      {/* ========================================= */}
      {tab === "dashboard" && (() => {
        const cpu = sysData?.cpu || 0;
        const ramUsed = sysData?.ram?.used || 0;
        const ramTotal = sysData?.ram?.total || 8;
        const ramPct = ramTotal > 0 ? Math.round(ramUsed / ramTotal * 100) : 0;
        const diskPct = sysData?.disk?.pct || 0;
        const diskUsed = sysData?.disk?.used || "?";
        const diskTotal = sysData?.disk?.total || "?";
        const temp = sysData?.temp || null;
        const uptime = sysData?.uptime || "?";
        const ip = sysData?.ip || "?";
        const connections = sysData?.connections || 0;
        const pgOk = sysData?.services?.postgresql ?? true;
        const printerOk = sysData?.services?.printer ?? false;
        const scannerOk = sysData?.services?.scanner ?? false;
        const lastBackup = sysData?.lastBackup || null;
        const netRx = sysData?.net?.rx_kbps || 0;
        const netTx = sysData?.net?.tx_kbps || 0;
        const netIface = sysData?.net?.iface || 'eth0';
        const fmtNet = v => v >= 1024 ? (v/1024).toFixed(1) + ' MB/s' : v + ' KB/s';
        const barColor = v => v > 85 ? S.danger : v > 60 ? S.warning : S.success;
        const maxNet = Math.max(100, ...sysHistory.map(h => Math.max(h.rx || 0, h.tx || 0))) * 1.2;
        const services = [
          { k: "postgres", nombre: "PostgreSQL", icon: "🗄️", puerto: "5432", online: pgOk },
          { k: "api", nombre: "Node.js API", icon: "⚙️", puerto: "3001", online: true },
          { k: "frontend", nombre: "Frontend", icon: "🌐", puerto: "3001", online: true },
          { k: "printer", nombre: "Impresora", icon: "🖨️", puerto: "USB", online: printerOk },
          { k: "scanner", nombre: "Lector", icon: "📷", puerto: "USB", online: scannerOk },
          { k: "watchdog", nombre: "Watchdog", icon: "🐕", puerto: "—", online: true },
        ];
        const devices = [
          { nombre: "Conexiones", icon: "📱", ip: connections + " activas", on: connections > 0 },
          { nombre: "Servidor", icon: "🖥️", ip: ip, on: true },
        ];

        return (
        <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "12px 16px", gap: 10, overflowY: "auto" }}>
          {/* Row 1: Services + Actions */}
          <div style={{ display: "flex", gap: 10, flex: "0 0 auto" }}>
            {/* Services grid */}
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: S.muted, letterSpacing: "0.06em", marginBottom: 6 }}>SERVICIOS</div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6 }}>
                {services.map(s => (
                  <div key={s.k} style={{ padding: "10px 4px", borderRadius: 10, background: S.surface, border: `1px solid ${s.online ? S.success + "25" : S.danger + "40"}`, textAlign: "center" }}>
                    <div style={{ fontSize: 26, marginBottom: 4 }}>{s.icon}</div>
                    <div style={{ fontSize: 13, fontWeight: 800, color: S.text }}>{s.nombre}</div>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 4, marginTop: 4 }}>
                      <div style={{ width: 7, height: 7, borderRadius: "50%", background: s.online ? S.success : S.danger }} />
                      <span style={{ fontSize: 11, fontWeight: 800, color: s.online ? S.success : S.danger }}>{s.online ? "OK" : "OFF"}</span>
                    </div>
                    {["postgres", "api", "frontend"].includes(s.k) && (
                      <button onClick={async () => { const svc = s.k === "postgres" ? "postgresql" : "cantina-api"; showMsg("🔄 Reiniciando " + s.nombre + "..."); await apiFetch(`/system/restart/${svc}`, { method: 'POST' }); showMsg("✅ " + s.nombre + " reiniciado"); }} style={{
                        marginTop: 5, padding: "4px 0", width: "100%", borderRadius: 5, border: "none",
                        background: S.border, color: S.muted, fontSize: 11, fontWeight: 700, cursor: "pointer",
                      }}>🔄 Reiniciar</button>
                    )}
                    {s.k === "printer" && (
                      <button onClick={async () => {
                        showMsg("🖨️ Enviando prueba...");
                        const r = await apiFetch('/printer/test');
                        if (r && r.success) showMsg("✅ Prueba enviada (" + (r.device || "impresora") + ")");
                        else showMsg("❌ " + (r?.error || "Error al imprimir"));
                      }} style={{
                        marginTop: 5, padding: "4px 0", width: "100%", borderRadius: 5, border: "none",
                        background: S.info + "25", color: S.info, fontSize: 11, fontWeight: 800, cursor: "pointer",
                      }}>🧪 Probar</button>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Row 2: Metric charts */}
          <div style={{ display: "flex", gap: 8, flex: "0 0 auto" }}>
            {[
              {
                label: "CPU", icon: "⚙️",
                value: cpu + "%", pct: cpu,
                color: barColor(cpu),
                chartData: sysHistory.map(h => h.cpu),
                maxY: 100, unit: "%",
              },
              {
                label: "RAM", icon: "🧠",
                value: ramUsed + " / " + ramTotal + " GB", pct: ramPct,
                color: barColor(ramPct),
                chartData: sysHistory.map(h => h.ram),
                maxY: 100, unit: "%",
                extra: ramPct > 70,
              },
              {
                label: "DISCO", icon: "💾",
                value: diskUsed + " / " + diskTotal, pct: diskPct,
                color: barColor(diskPct),
                chartData: sysHistory.map(h => h.disk),
                maxY: 100, unit: "%",
              },
              temp !== null ? {
                label: "TEMP", icon: "🌡️",
                value: temp + "°C", pct: temp,
                color: barColor(temp),
                chartData: sysHistory.map(h => h.temp || 0),
                maxY: 100, unit: "°C",
              } : null,
              {
                label: "RED ↓ " + netIface, icon: "📥",
                value: fmtNet(netRx), pct: null,
                color: S.info,
                chartData: sysHistory.map(h => h.rx || 0),
                maxY: maxNet, unit: "KB/s",
              },
              {
                label: "RED ↑ " + netIface, icon: "📤",
                value: fmtNet(netTx), pct: null,
                color: S.accent,
                chartData: sysHistory.map(h => h.tx || 0),
                maxY: maxNet, unit: "KB/s",
              },
            ].filter(Boolean).map(m => (
              <div key={m.label} style={{ flex: 1, borderRadius: 12, background: S.surface, border: `1px solid ${m.pct !== null && m.pct > 85 ? m.color + "50" : S.border}`, padding: "10px 10px 8px", display: "flex", flexDirection: "column", gap: 4, minWidth: 0 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 800, color: S.muted, letterSpacing: "0.07em" }}>{m.label}</div>
                    <div style={{ fontSize: 19, fontWeight: 900, color: m.pct !== null ? m.color : S.text, lineHeight: 1.2, marginTop: 1 }}>{m.value}</div>
                  </div>
                  <span style={{ fontSize: 20, opacity: 0.5 }}>{m.icon}</span>
                </div>
                <div style={{ flex: 1, minHeight: 52, marginTop: 2 }}>
                  {m.chartData.length >= 2
                    ? React.createElement(SysChart, { data: m.chartData, color: m.color, maxY: m.maxY, unit: m.unit })
                    : <div style={{ height: 52, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: S.muted }}>Esperando datos…</div>
