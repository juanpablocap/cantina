                        <span style={{ fontWeight: 800, fontSize: 14 }}>#{String(p.numero).padStart(3, "0")}</span>
                        <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>
                          {p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? `Barra (${p.nombre_cliente || "?"})` : "Llevar"}
                        </span>
                      </div>
                      <span style={{ fontWeight: 900, color: S.accent }}>${p.total.toLocaleString()}</span>
                    </div>
                    <button onClick={() => setCobrandoPedido(p)} style={{
                      marginTop: 8, width: "100%", padding: "8px 0", borderRadius: 8, border: "none",
                      background: S.accent, color: "#fff", fontSize: 12, fontWeight: 800, cursor: "pointer",
                    }}>💰 Cobrar ahora</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Transaction log */}
          <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 12 }}>
            MOVIMIENTOS ({cajaMovimientos.length})
          </div>
          {cajaMovimientos.length === 0 ? (
            <div style={{ textAlign: "center", padding: "40px 0", color: S.muted, fontSize: 13 }}>Sin movimientos todavía</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {[...cajaMovimientos].reverse().map((m, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", padding: "12px 16px", borderRadius: 10, background: S.surface, border: `1px solid ${S.border}` }}>
                  <span style={{ fontSize: 20, marginRight: 12 }}>{m.metodo === "efectivo" ? "💵" : m.metodo === "transferencia" ? "📱" : "📋"}</span>
                  <div style={{ flex: 1 }}>
                    <span style={{ fontWeight: 700, fontSize: 13 }}>Pedido #{String(m.pedido_num).padStart(3, "0")}</span>
                    <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>{m.metodo === "efectivo" ? "Efectivo" : m.metodo === "transferencia" ? "Transferencia" : "Cuenta corriente"}</span>
                    {m.referencia && <span style={{ fontSize: 10, color: S.info, marginLeft: 6 }}>Ref: {m.referencia}</span>}
                  </div>
                  <span style={{ fontWeight: 900, fontSize: 15, color: S.success }}>+${m.monto.toLocaleString()}</span>
                  <span style={{ fontSize: 10, color: S.muted, marginLeft: 12 }}>{new Date(m.ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}</span>
                </div>
              ))}
            </div>
          )}

          {/* Historical cierres */}
          {cierresHistorial.length > 0 && (
            <div style={{ marginTop: 24 }}>
              <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 12 }}>
                📅 CIERRES ANTERIORES ({cierresHistorial.length})
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {[...cierresHistorial].reverse().map(c => (
                  <div key={c.id} style={{ display: "flex", alignItems: "center", padding: "14px 16px", borderRadius: 12, background: S.surface, border: `1px solid ${S.border}` }}>
                    <span style={{ fontSize: 20, marginRight: 12 }}>📊</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 700, fontSize: 13 }}>
                        {new Date(c.fecha).toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short", year: "numeric" })}
                      </div>
                      <div style={{ fontSize: 11, color: S.muted }}>
                        {c.cantPedidos} pedidos · 💵 ${c.efectivo.toLocaleString()} · 📱 ${c.transferencia.toLocaleString()} · 📋 ${c.fiado.toLocaleString()}
                      </div>
                    </div>
                    <span style={{ fontWeight: 900, fontSize: 18, color: S.accent, marginRight: 12 }}>${c.totalVentas.toLocaleString()}</span>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button onClick={() => setReporteCierre(c)} style={{
                        padding: "8px 14px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg,
                        color: S.text, fontSize: 11, fontWeight: 700, cursor: "pointer",
                      }}>👁 Ver</button>
                      <button onClick={() => descargarCierreHtml(c)} style={{
                        padding: "8px 14px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg,
                        color: S.text, fontSize: 11, fontWeight: 700, cursor: "pointer",
                      }}>💾 Guardar</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Cierre modal */}
          {cierreCaja && (
            <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
              onClick={() => setCierreCaja(null)}>
              <div className="anim-in" style={{ width: "100%", maxWidth: 500, padding: 32, borderRadius: 20, background: S.surface, border: `2px solid ${S.border}` }}
                onClick={e => e.stopPropagation()}>
                <div style={{ textAlign: "center", marginBottom: 24 }}>
                  <div style={{ fontSize: 40 }}>📊</div>
                  <div style={{ fontSize: 20, fontWeight: 900, marginTop: 8 }}>CIERRE DE CAJA</div>
                  <div style={{ fontSize: 13, color: S.muted, marginTop: 4 }}>{new Date().toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" })}</div>
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 20 }}>
                  {[
                    { label: "Efectivo en caja", emoji: "💵", color: S.success, monto: cierreCaja.efectivo },
                    { label: "Transferencias recibidas", emoji: "📱", color: S.info, monto: cierreCaja.transferencia },
                    { label: "Fiado pendiente", emoji: "📋", color: S.warning, monto: cierreCaja.fiado },
                  ].map((r, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", padding: "14px 16px", borderRadius: 12, background: S.bg, border: `1px solid ${S.border}` }}>
                      <span style={{ fontSize: 20, marginRight: 12 }}>{r.emoji}</span>
                      <span style={{ flex: 1, fontWeight: 600, fontSize: 14 }}>{r.label}</span>
                      <span style={{ fontWeight: 900, fontSize: 18, color: r.color }}>${r.monto.toLocaleString()}</span>
                    </div>
                  ))}
                </div>

                <div style={{ padding: "16px 20px", borderRadius: 14, background: S.accent + "15", border: `2px solid ${S.accent}40`, textAlign: "center", marginBottom: 16 }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.06em" }}>TOTAL FACTURADO</div>
                  <div style={{ fontSize: 36, fontWeight: 900, color: S.accent, marginTop: 4 }}>${cierreCaja.totalVentas.toLocaleString()}</div>
                  <div style={{ fontSize: 12, color: S.muted, marginTop: 4 }}>{cierreCaja.cantPedidos} pedidos</div>
                </div>

                {/* Arqueo de caja */}
                <div style={{ padding: "14px 16px", borderRadius: 12, background: S.bg, border: `1px solid ${S.border}`, marginBottom: 16 }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.04em", marginBottom: 8 }}>💰 ARQUEO DE CAJA — ¿Cuánto efectivo hay?</div>
                  <button onClick={() => setTouchNum({ field: "arqueo", title: "EFECTIVO EN CAJA", value: arqueoEfectivo, prefix: "$", maxLen: 8 })}
                    style={{ width: "100%", padding: "10px 14px", borderRadius: 10, border: `2px solid ${S.border}`, background: S.surface, color: arqueoEfectivo ? S.text : S.muted, fontSize: 16, fontWeight: 800, textAlign: "left", cursor: "pointer" }}>
                    {arqueoEfectivo ? "$" + Number(arqueoEfectivo).toLocaleString() : "Tocar para contar efectivo"}
                  </button>
                  {arqueoEfectivo.length > 0 && (() => {
                    const real = Number(arqueoEfectivo);
                    const diff = real - cierreCaja.efectivo;
                    return (
                      <div style={{ marginTop: 8, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontSize: 12, color: S.muted }}>Diferencia:</span>
                        <span style={{ fontWeight: 900, fontSize: 16, color: diff === 0 ? S.success : diff > 0 ? S.info : S.danger }}>
                          {diff === 0 ? "✅ Cuadra perfecto" : diff > 0 ? `+$${diff.toLocaleString()} sobrante` : `-$${Math.abs(diff).toLocaleString()} faltante`}
                        </span>
                      </div>
                    );
                  })()}
                </div>

                <div style={{ display: "flex", gap: 12 }}>
                  <button onClick={() => setCierreCaja(null)} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
                    Cerrar
                  </button>
                  <button onClick={() => {
                    const cierreConArqueo = { ...cierreCaja, arqueoEfectivo: arqueoEfectivo.length > 0 ? Number(arqueoEfectivo) : null, diferencia: arqueoEfectivo.length > 0 ? Number(arqueoEfectivo) - cierreCaja.efectivo : null };
                    descargarCierreHtml(cierreConArqueo);
                    setCierresHistorial(prev => [...prev, { ...cierreConArqueo, id: Date.now() }]);
                    setCierreCaja(null);
                    setReporteCierre(cierreConArqueo);
                    setArqueoEfectivo("");
                  }} style={{ flex: 2, padding: "12px 0", borderRadius: 12, border: "none", background: S.success, color: "#000", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>
                    ✅ Confirmar y guardar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ========================================= */}
      {/* REPORTE DE CIERRE (kiosk full-screen) */}
      {/* ========================================= */}
      {reporteCierre && (() => {
        const r = reporteCierre;
        const fecha = new Date(r.fecha);
        const fechaStr = fecha.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        const horaStr = fecha.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
        const peds = r.pedidosCobrados || [];

        // Aggregate: what was consumed
        const consumoMap = {};
        peds.forEach(p => {
          p.items.forEach(i => {
            const key = itemNombre(i);
            if (!consumoMap[key]) consumoMap[key] = { nombre: key, cantidad: 0, total: 0, precio: i.precio };
            consumoMap[key].cantidad += i.cantidad;
            consumoMap[key].total += i.precio * i.cantidad;
          });
        });
        const consumoList = Object.values(consumoMap).sort((a, b) => b.total - a.total);

        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 200, background: S.bg, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            {/* Header */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 28px", background: S.surface, borderBottom: `2px solid ${S.border}`, flexShrink: 0 }}>
              <div>
                <div style={{ fontSize: 20, fontWeight: 900 }}>📊 Cierre de Caja</div>
                <div style={{ fontSize: 12, color: S.muted }}>{fechaStr} · Cierre: {horaStr}</div>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => descargarCierreHtml(r)} style={{
                  padding: "10px 20px", borderRadius: 10, border: `1px solid ${S.border}`, background: S.surface,
                  color: S.text, fontSize: 13, fontWeight: 700, cursor: "pointer",
                }}>💾 Descargar</button>
                <button onClick={() => setReporteCierre(null)} style={{
                  padding: "10px 20px", borderRadius: 10, border: "none", background: S.accent,
                  color: "#fff", fontSize: 13, fontWeight: 800, cursor: "pointer",
                }}>✕ Cerrar</button>
              </div>
            </div>

            <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
              {/* Summary cards */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 14, marginBottom: 24 }}>
                {[
                  { label: "EFECTIVO", emoji: "💵", color: S.success, monto: r.efectivo },
                  { label: "TRANSFERENCIAS", emoji: "📱", color: S.info, monto: r.transferencia },
                  { label: "FIADO", emoji: "📋", color: S.warning, monto: r.fiado },
                  { label: "TOTAL", emoji: "💰", color: S.accent, monto: r.totalVentas },
                ].map((c, i) => (
                  <div key={i} style={{ padding: 18, borderRadius: 14, background: S.surface, border: `2px solid ${c.color}25`, textAlign: "center" }}>
                    <div style={{ fontSize: 24, marginBottom: 6 }}>{c.emoji}</div>
                    <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.06em" }}>{c.label}</div>
                    <div style={{ fontSize: 26, fontWeight: 900, color: c.color, marginTop: 4 }}>${c.monto.toLocaleString()}</div>
                  </div>
                ))}
              </div>

              {/* Arqueo result if available */}
              {r.arqueoEfectivo !== null && r.arqueoEfectivo !== undefined && (
                <div style={{ padding: "12px 16px", borderRadius: 12, background: S.surface, border: `1px solid ${r.diferencia === 0 ? S.success : S.danger}30`, marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <span style={{ fontSize: 11, fontWeight: 800, color: S.muted }}>💰 ARQUEO: </span>
                    <span style={{ fontSize: 14, fontWeight: 800, color: S.text }}>Efectivo real ${r.arqueoEfectivo.toLocaleString()} vs teórico ${r.efectivo.toLocaleString()}</span>
                  </div>
                  <span style={{ fontWeight: 900, fontSize: 16, color: r.diferencia === 0 ? S.success : r.diferencia > 0 ? S.info : S.danger }}>
                    {r.diferencia === 0 ? "✅ Cuadra" : r.diferencia > 0 ? `+$${r.diferencia.toLocaleString()} sobrante` : `-$${Math.abs(r.diferencia).toLocaleString()} faltante`}
                  </span>
                </div>
              )}

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
                {/* LEFT: Products consumed */}
                <div>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 10 }}>
                    🍽️ PRODUCTOS CONSUMIDOS ({consumoList.length})
                  </div>
                  <div style={{ borderRadius: 12, overflow: "hidden", border: `1px solid ${S.border}` }}>
                    {/* Header row */}
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 60px 80px 90px", padding: "10px 14px", background: S.border + "40" }}>
                      {["PRODUCTO", "CANT", "PRECIO", "TOTAL"].map(h => (
                        <span key={h} style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.04em" }}>{h}</span>
                      ))}
                    </div>
                    {consumoList.map((item, idx) => (
                      <div key={idx} style={{ display: "grid", gridTemplateColumns: "1fr 60px 80px 90px", padding: "10px 14px", borderBottom: `1px solid ${S.border}20`, background: S.surface }}>
                        <span style={{ fontWeight: 600, fontSize: 13 }}>{itemNombre(item)}</span>
                        <span style={{ fontWeight: 800, fontSize: 13 }}>{item.cantidad}</span>
                        <span style={{ fontSize: 12, color: S.muted }}>${item.precio.toLocaleString()}</span>
                        <span style={{ fontWeight: 800, fontSize: 13, color: S.accent }}>${item.total.toLocaleString()}</span>
                      </div>
                    ))}
                    {/* Total row */}
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 60px 80px 90px", padding: "12px 14px", background: S.bg, borderTop: `2px solid ${S.border}` }}>
                      <span style={{ fontWeight: 900, fontSize: 14 }}>TOTAL</span>
                      <span style={{ fontWeight: 900, fontSize: 14 }}>{consumoList.reduce((s, i) => s + i.cantidad, 0)}</span>
                      <span></span>
                      <span style={{ fontWeight: 900, fontSize: 16, color: S.accent }}>${r.totalVentas.toLocaleString()}</span>
                    </div>
                  </div>
                </div>

                {/* RIGHT: Orders detail */}
                <div>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 10 }}>
                    📋 DETALLE DE PEDIDOS ({peds.length})
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 500, overflowY: "auto" }}>
                    {peds.map(p => {
                      const metodoIcon = p.metodo_pago === "efectivo" ? "💵" : p.metodo_pago === "transferencia" ? "📱" : "📋";
                      const metodoLabel = p.metodo_pago === "efectivo" ? "Efectivo" : p.metodo_pago === "transferencia" ? "Transfer." : "Fiado";
                      const hora = new Date(p.createdAt).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
                      const tipo = p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? "Barra" : "Llevar";
                      return (
                        <div key={p.id} style={{ padding: "10px 14px", borderRadius: 10, background: S.surface, border: `1px solid ${S.border}` }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ fontWeight: 800, fontSize: 13, fontFamily: "'JetBrains Mono', monospace" }}>#{String(p.numero).padStart(3, "0")}</span>
                              <span style={{ fontSize: 11, color: S.muted }}>{hora}</span>
                              <span style={{ fontSize: 11, color: S.muted }}>· {tipo}</span>
                              {p.nombre_cliente && <span style={{ fontSize: 11, color: S.info }}>· 📢 {p.nombre_cliente}</span>}
                            </div>
                            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                              <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 4, background: p.metodo_pago === "efectivo" ? S.success + "20" : p.metodo_pago === "transferencia" ? S.info + "20" : S.warning + "20", color: p.metodo_pago === "efectivo" ? S.success : p.metodo_pago === "transferencia" ? S.info : S.warning }}>
                                {metodoIcon} {metodoLabel}
                              </span>
                              <span style={{ fontWeight: 900, fontSize: 14, color: S.accent }}>${p.total.toLocaleString()}</span>
                            </div>
                          </div>
                          <div style={{ fontSize: 11, color: S.muted, lineHeight: 1.5 }}>
                            {p.items.map((it, idx) => (
                              <span key={idx}>
                                <span style={{ fontWeight: 700, color: S.text }}>{it.cantidad}x</span> {itemNombre(it)} <span style={{ color: S.accent }}>${(it.precio * it.cantidad).toLocaleString()}</span>
                                {idx < p.items.length - 1 ? " · " : ""}
                              </span>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Cuentas (fiados) */}
              {peds.filter(p => p.metodo_pago === "cuenta_corriente").length > 0 && (
                <div style={{ marginTop: 24 }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: S.warning, letterSpacing: "0.08em", marginBottom: 10 }}>
                    📋 CUENTAS CORRIENTES DEL DÍA
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {peds.filter(p => p.metodo_pago === "cuenta_corriente").map(p => {
                      const cli = clientes.find(c => c.id === p.cliente_id);
                      return (
                        <div key={p.id} style={{ display: "flex", alignItems: "center", padding: "10px 14px", borderRadius: 10, background: S.surface, border: `1px solid ${S.warning}30` }}>
                          <span style={{ fontSize: 16, marginRight: 10 }}>📋</span>
                          <div style={{ flex: 1 }}>
                            <span style={{ fontWeight: 700, fontSize: 13 }}>{cli ? `${cli.nombre} ${cli.apellido}` : "Cliente desconocido"}</span>
                            <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>#{String(p.numero).padStart(3, "0")}</span>
                          </div>
                          <span style={{ fontWeight: 900, fontSize: 15, color: S.warning }}>${p.total.toLocaleString()}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* MODAL: PIN CONFIRMACIÓN */}
      {/* ========================================= */}
      {pinModal && (() => {
        const cli = pinModal.clienteId ? clientes.find(c => c.id === pinModal.clienteId) : null;
        if (pinModal.clienteId && !cli && pinModal.action !== "cancelar") return null;
        const PIN_CORRECTO = "1234";
        const pinCompleto = pinModal.pin.length === 4;
        const pinCorrecto = pinModal.pin === PIN_CORRECTO;
        const pinIncorrecto = pinCompleto && !pinCorrecto;

        const doAction = () => {
          if (pinModal.action === "eliminar" && cli) {
            setClientes(prev => prev.filter(x => x.id !== cli.id));
            showMsg("🗑 Cliente eliminado");
          } else if (pinModal.action === "pagar" && cli) {
            const monto = pinModal.pagoMonto;
            setClientes(prev => prev.map(c => c.id === cli.id ? { ...c, saldo: c.saldo - monto } : c));
            setClientePagos(prev => [...prev, { id: Date.now(), cliente_id: cli.id, monto, fecha: new Date().toISOString() }]);
            setCajaMovimientos(prev => [...prev, { tipo: "pago_fiado", metodo: "efectivo", monto, pedido_num: null, referencia: `Pago ${cli.nombre} ${cli.apellido}`, ts: new Date().toISOString() }]);
            showMsg(`✅ Pago de $${monto.toLocaleString()} registrado`);
            setPagoForm(null);
          } else if (pinModal.action === "cancelar") {
            ejecutarCancelar(pinModal.pedidoId);
          } else if (pinModal.action === "eliminarUsuario") {
            setUsuarios(prev => prev.filter(u => u.id !== pinModal.userId));
            showMsg("🗑 Usuario eliminado");
          }
          setPinModal(null);
        };

        const handlePinKey = (key) => {
          if (key === "clear") { setPinModal(prev => ({ ...prev, pin: "" })); return; }
          if (key === "back") { setPinModal(prev => ({ ...prev, pin: prev.pin.slice(0, -1) })); return; }
          if (pinModal.pin.length >= 4) return;
          const newPin = pinModal.pin + key;
          setPinModal(prev => ({ ...prev, pin: newPin }));
          if (newPin.length === 4 && newPin === PIN_CORRECTO) {
            setTimeout(doAction, 300);
          }
        };

        const actionTitle = pinModal.action === "eliminar" ? "Eliminar cliente" : pinModal.action === "cancelar" ? "Cancelar pedido" : pinModal.action === "eliminarUsuario" ? "Eliminar usuario" : "Confirmar pago";
        const actionIcon = pinModal.action === "eliminar" ? "🗑" : pinModal.action === "cancelar" ? "❌" : pinModal.action === "eliminarUsuario" ? "🗑" : "💵";
        const actionDesc = pinModal.action === "eliminar" ? `¿Eliminar a ${cli?.nombre} ${cli?.apellido}?`
          : pinModal.action === "cancelar" ? `¿Cancelar pedido #${String(pedidos.find(p => p.id === pinModal.pedidoId)?.numero || 0).padStart(3, "0")}? Se devuelve el stock.`
          : pinModal.action === "eliminarUsuario" ? `¿Eliminar usuario ${usuarios.find(u => u.id === pinModal.userId)?.nombre}?`
          : `Registrar pago de $${pinModal.pagoMonto?.toLocaleString()} a ${cli?.nombre} ${cli?.apellido}`;

        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
            onClick={() => setPinModal(null)}>
            <div className="anim-in" style={{ width: "100%", maxWidth: 360, padding: 28, borderRadius: 20, background: S.surface, border: `2px solid ${S.border}` }}
              onClick={e => e.stopPropagation()}>

              <div style={{ textAlign: "center", marginBottom: 20 }}>
                <div style={{ fontSize: 36, marginBottom: 8 }}>{actionIcon}</div>
                <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 4 }}>{actionTitle}</div>
                <div style={{ fontSize: 13, color: S.muted }}>{actionDesc}</div>
                <div style={{ fontSize: 12, color: S.warning, fontWeight: 700, marginTop: 8 }}>
                  Ingresá el PIN de administrador
                </div>
              </div>

              {/* PIN dots */}
              <div style={{ display: "flex", justifyContent: "center", gap: 16, marginBottom: 20 }}>
                {[0, 1, 2, 3].map(i => (
                  <div key={i} style={{
                    width: 16, height: 16, borderRadius: "50%", transition: "all 0.15s",
                    background: pinIncorrecto ? S.danger : i < pinModal.pin.length ? S.accent : S.border,
                    transform: i < pinModal.pin.length ? "scale(1.2)" : "scale(1)",
                  }} />
                ))}
              </div>

              {pinIncorrecto && (
                <div style={{ textAlign: "center", fontSize: 12, fontWeight: 800, color: S.danger, marginBottom: 12 }}>
                  ⚠️ PIN incorrecto
                </div>
              )}

              {/* Numpad */}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
                {["1", "2", "3", "4", "5", "6", "7", "8", "9", "clear", "0", "back"].map(key => (
                  <button key={key} onClick={() => handlePinKey(key)} style={{
                    height: 52, borderRadius: 10, border: `1px solid ${S.border}`, background: key === "clear" || key === "back" ? S.border : S.bg,
                    color: S.text, fontSize: key === "clear" || key === "back" ? 14 : 20, fontWeight: 800, cursor: "pointer",
                  }}>
                    {key === "clear" ? "✕" : key === "back" ? "←" : key}
                  </button>
                ))}
              </div>

              <button onClick={() => setPinModal(null)} style={{
                marginTop: 14, width: "100%", padding: "10px 0", borderRadius: 10, border: `1px solid ${S.border}`,
                background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}>Cancelar</button>
            </div>
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TICKET MODAL (kiosk) */}
      {/* ========================================= */}
      {ticketVisible && (
        <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
          onClick={() => setTicketVisible(null)}>
          <div className="anim-in" style={{ width: 320, padding: 0, borderRadius: 16, background: "#fff", color: "#000", overflow: "hidden" }}
            onClick={e => e.stopPropagation()}>
            {/* Receipt */}
            <div style={{ padding: "20px 24px", textAlign: "center", borderBottom: "2px dashed #ddd" }}>
              <div style={{ fontSize: 18, fontWeight: 900, letterSpacing: "0.04em" }}>🍽️ CANTINA</div>
              <div style={{ fontSize: 11, color: "#888", marginTop: 4 }}>
                {new Date(ticketVisible.createdAt).toLocaleDateString("es-AR")} · {new Date(ticketVisible.createdAt).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
              </div>
              <div style={{ fontSize: 13, fontWeight: 700, marginTop: 4 }}>
                Pedido #{String(ticketVisible.numero).padStart(3, "0")}
                {ticketVisible.tipo === "mesa" && ` · Mesa ${ticketVisible.mesa_numero}`}
              </div>
            </div>
            <div style={{ padding: "12px 24px" }}>
              {ticketVisible.items.map((it, idx) => (
                <div key={idx} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", fontSize: 13, borderBottom: "1px solid #f0f0f0" }}>
                  <span>{it.cantidad}x {itemNombre(it)}</span>
                  <span style={{ fontWeight: 700 }}>${(it.precio * it.cantidad).toLocaleString()}</span>
                </div>
              ))}
            </div>
            <div style={{ padding: "12px 24px", borderTop: "2px dashed #ddd", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 16, fontWeight: 900 }}>TOTAL</span>
              <span style={{ fontSize: 22, fontWeight: 900 }}>${ticketVisible.total.toLocaleString()}</span>
            </div>
            <div style={{ padding: "8px 24px 12px", textAlign: "center", fontSize: 11, color: "#888" }}>
              {ticketVisible.metodo_pago === "efectivo" ? "💵 Efectivo" : ticketVisible.metodo_pago === "transferencia" ? "📱 Transferencia" : "📋 Cuenta corriente"}
            </div>
            <div style={{ padding: "0 24px 16px", textAlign: "center", fontSize: 10, color: "#bbb" }}>
              ¡Gracias por su compra!
            </div>
            <button onClick={() => setTicketVisible(null)} style={{
              width: "100%", padding: "14px 0", border: "none", borderTop: "1px solid #eee",
              background: "#f8f8f8", color: "#333", fontSize: 14, fontWeight: 700, cursor: "pointer",
            }}>Cerrar</button>
          </div>
        </div>
      )}

      {/* ========================================= */}
      {/* MODAL: AGREGAR ITEM A PEDIDO */}
      {/* ========================================= */}
      {/* ── Modal editar pedido ─────────────────────────── */}
      {editarPedido && (() => {
        const totalEdit = editarPedido.items.reduce((s, i) => s + i.precio * i.cantidad, 0);
        const cambiarCantidad = (producto_id, delta) => setEditarPedido(prev => {
          const items = prev.items.map(i => i.producto_id === producto_id ? { ...i, cantidad: i.cantidad + delta } : i).filter(i => i.cantidad > 0);
          return { ...prev, items };
        });
        const agregarProducto = (p) => {
          const cat = p.categoria || getCat(p.cat_id);
          setEditarPedido(prev => {
            const existe = prev.items.find(i => i.producto_id === p.id);
            const items = existe
              ? prev.items.map(i => i.producto_id === p.id ? { ...i, cantidad: i.cantidad + 1 } : i)
              : [...prev.items, { producto_id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1, observaciones: "", cat_id: p.cat_id, despacho_directo: p.cocina ? false : cat.despacho_directo, sin_obs: p.sin_obs || false }];
            return { ...prev, items };
          });
        };
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.8)" }}
            onClick={() => setEditarPedido(null)}>
            <div className="anim-in" style={{ width: "100%", maxWidth: 520, maxHeight: "90vh", display: "flex", flexDirection: "column", borderRadius: 20, background: S.surface, border: `2px solid ${S.accent}`, overflow: "hidden" }}
              onClick={e => e.stopPropagation()}>

              {/* Header */}
              <div style={{ padding: "16px 20px", borderBottom: `1px solid ${S.border}`, flexShrink: 0 }}>
                <div style={{ fontSize: 15, fontWeight: 900 }}>✏️ Editar pedido #{String(editarPedido.numero).padStart(3, "0")}</div>
                <div style={{ fontSize: 11, color: S.muted, marginTop: 2 }}>Modificá los ítems antes de la entrega</div>
              </div>

              <div style={{ flex: 1, overflowY: "auto", padding: "12px 20px" }}>
                {/* Ítems actuales */}
                <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 8 }}>ÍTEMS DEL PEDIDO</div>
                {editarPedido.items.length === 0 ? (
                  <div style={{ padding: "12px 0", color: S.danger, fontSize: 12, fontWeight: 700 }}>⚠️ Sin ítems — el pedido quedará vacío</div>
                ) : (
                  editarPedido.items.map(item => {
                    const cat = getCat(item.cat_id);
                    return (
                      <div key={item.producto_id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${S.border}` }}>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: 13, fontWeight: 700 }}>{item.nombre}</div>
                          {item.observaciones && <div style={{ fontSize: 10, color: S.warning, fontWeight: 600 }}>{item.observaciones}</div>}
                          <div style={{ fontSize: 12, color: cat.color, fontWeight: 800 }}>${(item.precio * item.cantidad).toLocaleString()}</div>
                        </div>
                        <button onClick={() => cambiarCantidad(item.producto_id, -1)} style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontWeight: 900, cursor: "pointer", fontSize: 18, flexShrink: 0 }}>−</button>
                        <span style={{ fontWeight: 900, fontSize: 16, width: 28, textAlign: "center", flexShrink: 0 }}>{item.cantidad}</span>
                        <button onClick={() => cambiarCantidad(item.producto_id, 1)} style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontWeight: 900, cursor: "pointer", fontSize: 18, flexShrink: 0 }}>+</button>
                        <button onClick={() => setEditarPedido(prev => ({ ...prev, items: prev.items.filter(i => i.producto_id !== item.producto_id) }))} style={{ width: 34, height: 34, borderRadius: 8, border: "none", background: S.danger + "18", color: S.danger, cursor: "pointer", fontSize: 15, flexShrink: 0 }}>🗑</button>
                      </div>
                    );
                  })
                )}

                {/* Agregar productos */}
                <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", margin: "16px 0 8px" }}>AGREGAR PRODUCTO</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: 6 }}>
                  {productos.filter(p => p.stock > 0).map(p => {
                    const cat = p.categoria || getCat(p.cat_id);
                    const enPedido = editarPedido.items.find(i => i.producto_id === p.id);
                    return (
                      <button key={p.id} onClick={() => agregarProducto(p)} style={{
                        padding: 10, borderRadius: 10, border: `2px solid ${enPedido ? cat.color : S.border}`,
                        background: enPedido ? cat.color + "18" : S.bg, textAlign: "left", cursor: "pointer", position: "relative",
                      }}>
                        {enPedido && <span style={{ position: "absolute", top: 4, right: 4, width: 20, height: 20, borderRadius: "50%", background: cat.color, color: "#fff", fontSize: 10, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center" }}>{enPedido.cantidad}</span>}
                        <div style={{ fontSize: 11, fontWeight: 700, marginBottom: 2 }}>{p.nombre}</div>
                        <div style={{ fontSize: 13, fontWeight: 900, color: cat.color }}>${p.precio.toLocaleString()}</div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Footer */}
              <div style={{ padding: "14px 20px", borderTop: `2px solid ${S.border}`, flexShrink: 0, background: S.surface }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <span style={{ fontSize: 13, color: S.muted, fontWeight: 600 }}>TOTAL</span>
                  <span style={{ fontSize: 22, fontWeight: 900 }}>${totalEdit.toLocaleString()}</span>
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={async () => {
                    if (editarPedido.items.length === 0) return;
                    const result = await apiFetch(`/pedidos/${editarPedido.id}/items`, {
                      method: 'PUT',
                      body: { items: editarPedido.items.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad, precio: i.precio, observaciones: i.observaciones || "" })) }
                    });
                    if (result) {
                      setPedidos(prev => prev.map(p => p.id === editarPedido.id ? result : p));
                      setProductos(prev => prev.map(p => {
                        const item = result.items.find(i => i.producto_id === p.id);
                        return item ? { ...p, stock: p.stock } : p;
                      }));
                      showMsg(`✅ Pedido #${String(editarPedido.numero).padStart(3,"0")} actualizado`);
                      setEditarPedido(null);
                    }
                  }} disabled={editarPedido.items.length === 0} style={{
                    flex: 1, padding: "12px 0", borderRadius: 12, border: "none",
                    background: editarPedido.items.length > 0 ? S.success : S.border,
                    color: editarPedido.items.length > 0 ? "#000" : S.muted,
                    fontSize: 14, fontWeight: 900, cursor: editarPedido.items.length > 0 ? "pointer" : "not-allowed",
                  }}>💾 Guardar cambios</button>
                  <button onClick={() => setEditarPedido(null)} style={{
                    padding: "12px 20px", borderRadius: 12, border: `1px solid ${S.border}`,
                    background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
                  }}>Cancelar</button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {agregarItemPedido && (() => {
        const ped = pedidos.find(p => p.id === agregarItemPedido);
        if (!ped) return null;
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
            onClick={() => setAgregarItemPedido(null)}>
            <div className="anim-in" style={{ width: "100%", maxWidth: 500, maxHeight: "80vh", padding: 24, borderRadius: 20, background: S.surface, border: `2px solid ${S.border}`, overflowY: "auto" }}
              onClick={e => e.stopPropagation()}>
              <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 12 }}>
                ➕ Agregar items al pedido #{String(ped.numero).padStart(3, "0")}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(130px, 1fr))", gap: 8 }}>
                {productos.filter(p => p.stock > 0).map(p => {
                  const cat = p.categoria || getCat(p.cat_id);
                  return (
                    <button key={p.id} onClick={() => {
                      const esDirecto = p.cocina ? false : cat.despacho_directo;
                      const newItem = { producto_id: p.id, nombre: p.nombre, precio: p.precio, cantidad: 1, observaciones: "", despacho_directo: esDirecto, cat_id: p.cat_id, sin_obs: p.sin_obs || false };
                      setPedidos(prev => prev.map(x => {
                        if (x.id !== ped.id) return x;
                        const existente = x.items.find(i => i.producto_id === p.id);
                        const newItems = existente
                          ? x.items.map(i => i.producto_id === p.id ? { ...i, cantidad: i.cantidad + 1 } : i)
                          : [...x.items, newItem];
                        return { ...x, items: newItems, total: newItems.reduce((s, i) => s + i.precio * i.cantidad, 0) };
                      }));
                      setProductos(prev => prev.map(x => x.id === p.id ? { ...x, stock: x.stock - 1 } : x));
                      showMsg(`✅ ${p.nombre} agregado al #${String(ped.numero).padStart(3, "0")}`);
                    }} style={{
                      padding: 10, borderRadius: 10, border: `1px solid ${S.border}`, background: S.bg,
                      textAlign: "left", cursor: "pointer",
                    }}>
                      <div style={{ fontSize: 12, fontWeight: 700 }}>{p.nombre}</div>
                      <div style={{ fontSize: 14, fontWeight: 900, color: cat.color }}>${p.precio.toLocaleString()}</div>
                    </button>
                  );
                })}
              </div>
              <button onClick={() => setAgregarItemPedido(null)} style={{
                marginTop: 14, width: "100%", padding: "12px 0", borderRadius: 12, border: `1px solid ${S.border}`,
                background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
              }}>Listo</button>
            </div>
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: USUARIOS */}
      {/* ========================================= */}
      {tab === "usuarios" && (
        <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em" }}>
              USUARIOS ({usuarios.length})
            </div>
            <button onClick={() => setUserForm({ mode: "nuevo", nombre: "", rol: "cajero", pin: "" })} style={{
              padding: "10px 20px", borderRadius: 10, border: "none", background: S.accent, color: "#fff",
              fontSize: 13, fontWeight: 800, cursor: "pointer",
            }}>+ Nuevo Usuario</button>
          </div>

          {/* User form */}
          {userForm && (
            <div className="anim-in" style={{ marginBottom: 16, padding: 20, borderRadius: 14, background: S.surface, border: `2px solid ${S.accent}` }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: S.accent, marginBottom: 12 }}>
                {userForm.mode === "nuevo" ? "➕ NUEVO USUARIO" : "✏️ EDITAR USUARIO"}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                <div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>Nombre</div>
                  <button onClick={() => setTouchKb({ field: "userForm_nombre", title: "NOMBRE DEL USUARIO", value: userForm.nombre })}
                    style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: `2px solid ${userForm.nombre ? S.accent : S.border}`, background: S.bg, color: userForm.nombre ? S.text : S.muted, fontSize: 13, textAlign: "left", cursor: "pointer" }}>
                    {userForm.nombre || "Tocar para escribir"}
                  </button>
                </div>
                <div>
                  <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>Rol</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    {["admin", "cajero", "cocina"].map(r => (
                      <button key={r} onClick={() => setUserForm(prev => ({ ...prev, rol: r }))} style={{
                        flex: 1, padding: "10px 0", borderRadius: 8, border: `2px solid ${userForm.rol === r ? S.accent : S.border}`,
                        background: userForm.rol === r ? S.accent : S.bg, color: userForm.rol === r ? "#fff" : S.text,
                        fontSize: 11, fontWeight: 800, cursor: "pointer", textTransform: "capitalize",
                      }}>{r === "admin" ? "🔑 Admin" : r === "cajero" ? "🛒 Cajero" : "👨‍🍳 Cocina"}</button>
                    ))}
                  </div>
                </div>
                <div style={{ gridColumn: "span 2" }}>
                  <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>PIN (4 dígitos)</div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                    <div style={{ flex: 1, display: "flex", justifyContent: "center", gap: 10 }}>
                      {[0, 1, 2, 3].map(i => (
                        <div key={i} style={{ width: 14, height: 14, borderRadius: "50%", background: i < userForm.pin.length ? S.accent : S.border, transition: "all 0.15s" }} />
                      ))}
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 4 }}>
                      {["1","2","3","4","5","6","7","8","9","✕","0","←"].map(k => (
                        <button key={k} onClick={() => {
                          if (k === "✕") setUserForm(prev => ({ ...prev, pin: "" }));
                          else if (k === "←") setUserForm(prev => ({ ...prev, pin: prev.pin.slice(0, -1) }));
                          else if (userForm.pin.length < 4) setUserForm(prev => ({ ...prev, pin: prev.pin + k }));
                        }} style={{ width: 36, height: 36, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontSize: k === "✕" || k === "←" ? 12 : 14, fontWeight: 800, cursor: "pointer" }}>{k}</button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                <button onClick={() => {
                  if (!userForm.nombre.trim() || userForm.pin.length !== 4) return;
                  if (userForm.mode === "nuevo") {
                    if (usuarios.find(u => u.pin === userForm.pin)) { showMsg("⚠️ Ese PIN ya está en uso"); return; }
                    setUsuarios(prev => [...prev, { id: nextUserId, nombre: userForm.nombre, rol: userForm.rol, pin: userForm.pin }]);
                    setNextUserId(n => n + 1);
                    showMsg("✅ Usuario creado");
                  } else {
                    if (usuarios.find(u => u.pin === userForm.pin && u.id !== userForm.id)) { showMsg("⚠️ Ese PIN ya está en uso"); return; }
                    setUsuarios(prev => prev.map(u => u.id === userForm.id ? { ...u, nombre: userForm.nombre, rol: userForm.rol, pin: userForm.pin } : u));
                    showMsg("✅ Usuario actualizado");
                  }
                  setUserForm(null);
                }} disabled={!userForm.nombre.trim() || userForm.pin.length !== 4} style={{
                  padding: "10px 24px", borderRadius: 10, border: "none",
                  background: userForm.nombre.trim() && userForm.pin.length === 4 ? S.success : S.border,
                  color: userForm.nombre.trim() && userForm.pin.length === 4 ? "#000" : S.muted,
                  fontSize: 13, fontWeight: 800, cursor: userForm.nombre.trim() && userForm.pin.length === 4 ? "pointer" : "not-allowed",
                }}>💾 Guardar</button>
                <button onClick={() => setUserForm(null)} style={{ padding: "10px 24px", borderRadius: 10, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
              </div>
            </div>
          )}

          {/* User list */}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {usuarios.map(u => (
              <div key={u.id} className="anim-in" style={{ display: "flex", alignItems: "center", padding: "14px 16px", borderRadius: 12, background: S.surface, border: `1px solid ${S.border}`, gap: 14 }}>
                <div style={{ width: 44, height: 44, borderRadius: 12, background: u.rol === "admin" ? S.accent + "20" : u.rol === "cajero" ? S.success + "20" : S.warning + "20", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22 }}>
                  {u.rol === "admin" ? "🔑" : u.rol === "cajero" ? "🛒" : "👨‍🍳"}
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 15, color: S.text }}>{u.nombre}</div>
                  <div style={{ fontSize: 11, color: S.muted, marginTop: 2 }}>

                { key: "cocina", icon: "👨‍🍳", label: "Cocina", badge: pedidos.filter(p => ["pendiente","en_preparacion"].includes(p.estado) && !p.solo_despacho).length || null, bc: S.warning },
                { key: "clientes", icon: "👥", label: "Clientes" },
                { key: "productos", icon: "📦", label: "Productos" },
                { key: "usuarios", icon: "🔑", label: "Usuarios" },
                { key: "dashboard", icon: "📊", label: "Sistema" },
              ].map(({ key, icon, label, badge, bc }) => (
                <button key={key} onClick={() => { setTab(key); setMasSheet(false); }} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, padding: "16px 8px", borderRadius: 14, border: `1px solid ${tab === key ? S.accent : S.border}`, background: tab === key ? S.accent + "20" : S.surfaceHover, cursor: "pointer", position: "relative" }}>
                  <span style={{ fontSize: 26 }}>{icon}</span>
                  <span style={{ fontSize: 11, fontWeight: 700, color: tab === key ? S.accent : S.text }}>{label}</span>
                  {badge > 0 && <div style={{ position: "absolute", top: 8, right: 8, width: 18, height: 18, borderRadius: "50%", background: bc || S.danger, color: "#000", fontSize: 10, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center" }}>{badge}</div>}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ========================================= */}
      {/* FLOATING: Autoservicio notifications */}
      {/* ========================================= */}
      {pedidosAutoservicio.length > 0 && (
        <div style={{ position: "fixed", bottom: theme === 'modern' ? 76 : 60, left: 16, zIndex: 80, display: "flex", flexDirection: "column", gap: 6, maxWidth: 300 }}>
          {pedidosAutoservicio.map((pa, idx) => (
            <div key={pa.id} style={{
              borderRadius: 14, overflow: "hidden",
              background: S.surface, border: `2px solid ${S.warning}`,
              boxShadow: `0 4px 20px rgba(0,0,0,0.4), 0 0 20px ${S.warning}15`,
              animation: "pulseNotif 2s infinite",
            }}>
              {/* Collapsed: just tap to expand */}
              <button onClick={() => setAutoNotifExpanded(autoNotifExpanded === pa.id ? null : pa.id)} style={{
                width: "100%", padding: "10px 14px", border: "none", background: "transparent", cursor: "pointer",
                display: "flex", alignItems: "center", gap: 10, textAlign: "left",
              }}>
                <div style={{ width: 36, height: 36, borderRadius: 10, background: S.warning + "25", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, flexShrink: 0 }}>📱</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12, fontWeight: 800, color: S.text }}>Pedido Autoservicio</div>
                  <div style={{ fontSize: 11, color: S.warning, fontWeight: 700 }}>📢 {pa.nombre} · ${pa.total.toLocaleString()}</div>
                </div>
                <div style={{ fontSize: 10, color: S.muted }}>{new Date(pa.timestamp).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}</div>
              </button>

              {/* Expanded: show items + accept/reject */}
              {autoNotifExpanded === pa.id && (
                <div style={{ padding: "0 14px 12px" }}>
                  <div style={{ padding: "8px 10px", borderRadius: 8, background: S.bg, marginBottom: 8, fontSize: 11, color: S.text, lineHeight: 1.6 }}>
                    {pa.items.map((it, i) => (
                      <div key={i} style={{ display: "flex", justifyContent: "space-between" }}>
                        <span><span style={{ fontWeight: 800 }}>{it.cantidad}x</span> {itemNombre(it)}</span>
                        <span style={{ fontWeight: 700, color: S.accent }}>${(it.precio * it.cantidad).toLocaleString()}</span>
                      </div>
                    ))}
                    <div style={{ borderTop: `1px solid ${S.border}`, marginTop: 4, paddingTop: 4, display: "flex", justifyContent: "space-between", fontWeight: 900 }}>
                      <span>Total</span>
                      <span style={{ color: S.accent }}>${pa.total.toLocaleString()}</span>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => rechazarPedidoAutoservicio(pa.id)} style={{
                      flex: 1, padding: "10px 0", borderRadius: 8, border: "none",
                      background: S.danger + "20", color: S.danger, fontSize: 12, fontWeight: 800, cursor: "pointer",
                    }}>❌ Rechazar</button>
                    <button onClick={() => aceptarPedidoAutoservicio(pa.id)} style={{
                      flex: 2, padding: "10px 0", borderRadius: 8, border: "none",
                      background: S.success, color: "#000", fontSize: 12, fontWeight: 800, cursor: "pointer",
                    }}>✅ Aceptar y enviar a cocina</button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {/* Simulate autoservicio button (demo only) */}
      <button onClick={simularPedidoAutoservicio} style={{
        position: "fixed", bottom: 12, left: 12, zIndex: 70,
        padding: "8px 14px", borderRadius: 10, border: `2px solid ${S.border}`,
        background: S.surface, color: S.muted, fontSize: 10, fontWeight: 700, cursor: "pointer",
      }}>📱 Simular pedido autoservicio</button>

      {/* ========================================= */}
      {/* BACKUP MODAL */}
      {/* ========================================= */}
      {backupModal && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.7)" }}>
          <div style={{ width: 380, padding: 28, borderRadius: 18, background: S.surface, border: `2px solid ${backupModal.status === "error" ? S.danger : backupModal.status === "ok" ? S.success : S.info}`, textAlign: "center" }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>{backupModal.status === "loading" ? "⏳" : backupModal.status === "ok" ? "✅" : "❌"}</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: S.text, lineHeight: 1.5, marginBottom: 16 }}>{backupModal.message}</div>
            {backupModal.status !== "loading" && (
              <button onClick={() => setBackupModal(null)} style={{ padding: "12px 32px", borderRadius: 10, border: "none", background: backupModal.status === "ok" ? S.success : S.danger, color: "#fff", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>OK</button>
            )}
          </div>
        </div>
      )}

      {/* ========================================= */}
      {/* TOUCH KEYBOARD MODAL */}
      {/* ========================================= */}
      {touchKb && (
        <TouchKeyboard
          title={touchKb.title}
          value={touchKb.value}
          onChange={v => setTouchKb(prev => ({ ...prev, value: v }))}
          onDone={v => {
            if (touchKb.field === "nombreBarra") setNombreBarra(v);
            else if (touchKb.field === "nombreLlevar") setNombreLlevar(v);
            else if (touchKb.field.startsWith("mesaNota_")) setMesaNotas(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("clienteForm_")) setClienteForm(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("userForm_")) setUserForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field.startsWith("productoForm_")) setProductoForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field === "categoriaForm_nombre") setCategoriaForm(prev => prev ? ({ ...prev, nombre: v }) : null);
            setTouchKb(null);
          }}
          onCancel={() => {
            const v = touchKb.value;
            if (touchKb.field === "nombreBarra") setNombreBarra(v);
            else if (touchKb.field === "nombreLlevar") setNombreLlevar(v);
            else if (touchKb.field.startsWith("mesaNota_")) setMesaNotas(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("clienteForm_")) setClienteForm(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("userForm_")) setUserForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field.startsWith("productoForm_")) setProductoForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field === "categoriaForm_nombre") setCategoriaForm(prev => prev ? ({ ...prev, nombre: v }) : null);
            setTouchKb(null);
          }}
          S={S}
        />
      )}

      {/* TOUCH NUMPAD MODAL */}
      {touchNum && (
        <TouchNumpad
          title={touchNum.title}
          value={touchNum.value}
          onChange={v => setTouchNum(prev => ({ ...prev, value: v }))}
          onDone={v => {
            if (touchNum.field === "pagoMonto") setPagoForm(prev => ({ ...prev, monto: v }));
            else if (touchNum.field === "arqueo") setArqueoEfectivo(v);
            else if (touchNum.field.startsWith("clienteForm_")) setClienteForm(prev => ({ ...prev, [touchNum.field.split("_")[1]]: v }));
            else if (touchNum.field.startsWith("stock_")) {
              const prodId = Number(touchNum.field.split("_")[1]);
              setProductos(prev => prev.map(p => p.id === prodId ? { ...p, stock: Math.max(0, Number(v) || 0) } : p));
            }
            else if (touchNum.field.startsWith("productoForm_")) setProductoForm(prev => prev ? ({ ...prev, [touchNum.field.split("_")[1]]: v }) : null);
            setTouchNum(null);
          }}
          onCancel={() => setTouchNum(null)}
          prefix={touchNum.prefix}
          maxLen={touchNum.maxLen}
          S={S}
        />
      )}

      {/* ========================================= */}
      {/* MODAL: COBRAR */}
      {/* ========================================= */}
      {cobrandoPedido && (
        <CobrarModal
          pedido={cobrandoPedido}
          onCobrar={cobrarPedido}
          onClose={() => setCobrandoPedido(null)}
          clientes={clientes}
          S={S}
        />
      )}
    </div>
  );
}

// ========================================
// COBRAR MODAL
// ========================================
function CobrarModal({ pedido, onCobrar, onClose, clientes, S }) {
  const itemNombre = (i) => i.nombre || (i.producto && i.producto.nombre) || "?";
  const [metodo, setMetodo] = useState("efectivo");
  const [montoRecibido, setMontoRecibido] = useState("");
  const [referencia, setReferencia] = useState("");
  const [clienteBusq, setClienteBusq] = useState("");
  const [clienteSelec, setClienteSelec] = useState(null);
  const [showClienteList, setShowClienteList] = useState(false);
  const [descPct, setDescPct] = useState("");

  const descMonto = descPct ? Math.round(pedido.total * Number(descPct) / 100) : 0;
  const totalFinal = pedido.total - descMonto;

  const vuelto = metodo === "efectivo" && montoRecibido ? Number(montoRecibido) - totalFinal : null;
  const puedeConfirmar = () => {
    if (metodo === "efectivo") return Number(montoRecibido) >= totalFinal;
    if (metodo === "cuenta_corriente") return clienteSelec !== null;
    return true;
  };

  const clientesFiltrados = clienteBusq.length > 0
    ? clientes.filter(c => {
        const q = clienteBusq.toLowerCase();
        return c.nombre.toLowerCase().includes(q) || c.apellido.toLowerCase().includes(q) || (c.apodo && c.apodo.toLowerCase().includes(q));
      })
    : clientes;

  const montosSugeridos = [
    totalFinal,
    Math.ceil(totalFinal / 1000) * 1000,
    Math.ceil(totalFinal / 5000) * 5000,
    Math.ceil(totalFinal / 10000) * 10000,
  ].filter((v, i, a) => a.indexOf(v) === i && v >= totalFinal).slice(0, 4);

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
      onClick={onClose}>
      <div className="anim-in" style={{ width: "100%", maxWidth: 400, padding: 20, borderRadius: 18, background: S.surface, border: `2px solid ${S.border}`, maxHeight: "90vh", overflowY: "auto" }}
        onClick={e => e.stopPropagation()}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
          <div>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.06em" }}>COBRAR PEDIDO</div>
            <div style={{ fontSize: 20, fontWeight: 900 }}>#{String(pedido.numero).padStart(3, "0")}</div>
            {pedido.nombre_cliente && (
              <div style={{ fontSize: 14, fontWeight: 700, color: S.info, marginTop: 2 }}>📢 {pedido.nombre_cliente}</div>
            )}
          </div>
          <div>
            <div style={{ fontSize: 26, fontWeight: 900, color: descMonto > 0 ? S.muted : S.accent, textDecoration: descMonto > 0 ? "line-through" : "none" }}>${pedido.total.toLocaleString()}</div>
            {descMonto > 0 && (
              <div style={{ fontSize: 22, fontWeight: 900, color: S.success }}>${totalFinal.toLocaleString()}</div>
            )}
          </div>
        </div>

        {/* Items resumen */}
        <div style={{ padding: "10px 12px", borderRadius: 10, background: S.bg, marginBottom: 12, fontSize: 12, color: S.muted, lineHeight: 1.6 }}>
          {pedido.items.map((it, idx) => (
            <span key={idx}>{it.cantidad}x {itemNombre(it)}{idx < pedido.items.length - 1 ? " · " : ""}</span>
          ))}
        </div>

        {/* Discount */}
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 16 }}>
          <span style={{ fontSize: 11, fontWeight: 800, color: S.muted, whiteSpace: "nowrap" }}>🏷️ DESCUENTO</span>
          {[0, 5, 10, 15, 20].map(pct => (
            <button key={pct} onClick={() => setDescPct(pct === 0 ? "" : String(pct))} style={{
              padding: "6px 12px", borderRadius: 8, border: `1px solid ${S.border}`,
              background: (pct === 0 && !descPct) || descPct === String(pct) ? S.accent : S.bg,
              color: (pct === 0 && !descPct) || descPct === String(pct) ? "#fff" : S.text,
              fontSize: 12, fontWeight: 700, cursor: "pointer",
            }}>{pct === 0 ? "Sin" : `${pct}%`}</button>
          ))}
          {descMonto > 0 && (
            <span style={{ fontSize: 12, fontWeight: 800, color: S.success, marginLeft: 4 }}>-${descMonto.toLocaleString()}</span>
          )}
        </div>

        {/* Client search */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, marginBottom: 6, letterSpacing: "0.04em" }}>
            CLIENTE {metodo === "cuenta_corriente" ? "(obligatorio)" : "(opcional)"}
          </div>
          {clienteSelec ? (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", borderRadius: 10, background: S.bg, border: `2px solid ${S.info}40` }}>
              <div>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{clienteSelec.nombre} {clienteSelec.apellido}</span>
                {clienteSelec.apodo && <span style={{ fontSize: 12, color: S.info, marginLeft: 8 }}>"{clienteSelec.apodo}"</span>}
                {clienteSelec.division && <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>· {clienteSelec.division}</span>}
              </div>
              <button onClick={() => { setClienteSelec(null); setClienteBusq(""); }} style={{
                padding: "4px 10px", borderRadius: 6, border: "none", background: S.danger + "18", color: S.danger,
                fontSize: 11, fontWeight: 700, cursor: "pointer",
              }}>✕</button>
            </div>
          ) : (
            <div>
              {/* Search input */}
              <div style={{ position: "relative" }}>
                <input type="text" value={clienteBusq} onChange={e => { setClienteBusq(e.target.value); setShowClienteList(true); }}
                  onFocus={() => setShowClienteList(true)}
                  placeholder="🔍 Buscá por nombre, apodo o división..."
                  style={{ width: "100%", padding: "10px 14px", borderRadius: 10, border: `2px solid ${clienteBusq ? S.accent : S.border}`, background: S.bg, color: S.text, fontSize: 13, fontWeight: 600 }} />
                {clienteBusq && (
                  <button onClick={() => { setClienteBusq(""); setShowClienteList(false); }} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", border: "none", background: "transparent", color: S.muted, fontSize: 14, cursor: "pointer" }}>✕</button>
                )}
              </div>
              {showClienteList && (
                <div style={{ marginTop: 4, maxHeight: 200, overflowY: "auto", borderRadius: 10, border: `2px solid ${S.border}`, background: S.bg, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>
                  {clientesFiltrados.length === 0 ? (
                    <div style={{ padding: "14px 16px", textAlign: "center", fontSize: 12, color: S.muted }}>Sin resultados</div>
                  ) : (
                    clientesFiltrados.slice(0, 10).map(c => (
                      <button key={c.id} onClick={() => { setClienteSelec(c); setShowClienteList(false); setClienteBusq(""); }}
                        style={{
                          width: "100%", padding: "10px 14px", border: "none", borderBottom: `1px solid ${S.border}`,
                          background: "transparent", color: S.text, textAlign: "left", cursor: "pointer",
                          display: "flex", alignItems: "center", justifyContent: "space-between",
                        }}>
                        <div>
                          <span style={{ fontWeight: 700, fontSize: 13 }}>{c.nombre} {c.apellido}</span>
                          {c.apodo && <span style={{ fontSize: 11, color: S.info, marginLeft: 6 }}>"{c.apodo}"</span>}
                          {c.division && <span style={{ fontSize: 10, color: S.muted, marginLeft: 6 }}>· {c.division}</span>}
                        </div>
                        {c.saldo > 0 && (
                          <span style={{ fontSize: 11, fontWeight: 800, color: S.warning }}>${c.saldo.toLocaleString()}</span>
                        )}
                      </button>
                    ))
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Method */}
        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {[["efectivo", "💵", "Efectivo"], ["transferencia", "📱", "Transfer."], ["cuenta_corriente", "📋", "Fiado"]].map(([v, icon, label]) => (
            <button key={v} onClick={() => setMetodo(v)} style={{
              flex: 1, padding: "14px 0", borderRadius: 12, border: `2px solid ${metodo === v ? S.accent : S.border}`,
              background: metodo === v ? S.accent : S.bg, color: metodo === v ? "#fff" : S.text,
              fontSize: 12, fontWeight: 800, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 4,
            }}>
              <span style={{ fontSize: 22 }}>{icon}</span>{label}
            </button>
          ))}
        </div>

        {metodo === "efectivo" && (
          <div style={{ marginBottom: 12 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "flex-end" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, marginBottom: 4 }}>RECIBIDO</div>
                <div style={{ padding: "8px 10px", borderRadius: 10, border: `2px solid ${S.border}`, background: S.bg, textAlign: "center" }}>
                  <span style={{ fontSize: 24, fontWeight: 900, color: montoRecibido ? S.text : S.muted }}>${montoRecibido ? Number(montoRecibido).toLocaleString() : "0"}</span>
                </div>
              </div>
              {vuelto !== null && vuelto >= 0 && (
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 10, fontWeight: 800, color: S.success, marginBottom: 4 }}>VUELTO</div>
                  <div style={{ padding: "8px 10px", borderRadius: 10, border: `2px solid ${S.success}40`, background: S.success + "10", textAlign: "center" }}>
                    <span style={{ fontSize: 24, fontWeight: 900, color: S.success }}>${vuelto.toLocaleString()}</span>
                  </div>
                </div>
              )}
            </div>
            {/* Inline numpad */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 5, marginBottom: 6 }}>
              {["1","2","3","C","4","5","6","0","7","8","9","00"].map(k => (
                <button key={k} onClick={() => {
                  if (k === "C") setMontoRecibido("");
                  else setMontoRecibido(prev => prev + k);
                }} style={{ height: 40, borderRadius: 8, border: `1px solid ${S.border}`, background: k === "C" ? S.border : S.bg, color: S.text, fontSize: k === "C" ? 13 : 16, fontWeight: 800, cursor: "pointer" }}>{k === "C" ? "✕" : k}</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              {montosSugeridos.map(m => (
                <button key={m} onClick={() => setMontoRecibido(String(m))} style={{
                  flex: 1, padding: "6px 0", borderRadius: 7, border: `1px solid ${S.border}`,
                  background: Number(montoRecibido) === m ? S.accent : S.bg, color: Number(montoRecibido) === m ? "#fff" : S.text,
                  fontSize: 11, fontWeight: 700, cursor: "pointer",
                }}>${m.toLocaleString()}</button>
              ))}
            </div>
          </div>
        )}

        {metodo === "transferencia" && (
          <div style={{ marginBottom: 16 }}>
            <div style={{ padding: 16, borderRadius: 12, background: S.bg, border: `1px solid ${S.border}`, textAlign: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 10, fontWeight: 800, color: S.muted }}>ALIAS PARA TRANSFERENCIA</div>
              <div style={{ fontSize: 22, fontWeight: 900, color: S.info, marginTop: 6, fontFamily: "'JetBrains Mono', monospace" }}>cantina.alias</div>
              <div style={{ fontSize: 11, color: S.muted, marginTop: 4 }}>Indicale este alias al cliente</div>
            </div>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, marginBottom: 6 }}>Últimos 4 dígitos (opcional)</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <div style={{ flex: 1, padding: "10px 14px", borderRadius: 10, border: `2px solid ${S.border}`, background: S.bg, fontSize: 22, fontWeight: 800, color: S.text, textAlign: "center", fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.2em" }}>
                {referencia || "_ _ _ _"}
              </div>
              {referencia && <button onClick={() => setReferencia("")} style={{ padding: "8px 12px", borderRadius: 8, border: "none", background: S.border, color: S.text, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>✕</button>}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 5 }}>
              {["1","2","3","4","5","6","7","8","9","0"].map(d => (
                <button key={d} onClick={() => referencia.length < 4 && setReferencia(prev => prev + d)} style={{ height: 40, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontSize: 16, fontWeight: 800, cursor: "pointer" }}>{d}</button>
              ))}
            </div>
          </div>
        )}

        {metodo === "cuenta_corriente" && (
          <div style={{ marginBottom: 16, padding: 16, borderRadius: 12, background: S.bg, border: `1px solid ${clienteSelec ? S.warning : S.danger}40`, textAlign: "center" }}>
            {clienteSelec ? (
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: S.warning }}>
                  ⚠️ Se carga ${pedido.total.toLocaleString()} a la cuenta de {clienteSelec.nombre} {clienteSelec.apellido}
                </div>
                {clienteSelec.saldo > 0 && (
                  <div style={{ fontSize: 12, color: S.danger, marginTop: 6, fontWeight: 700 }}>
                    Deuda actual: ${clienteSelec.saldo.toLocaleString()} → Nueva deuda: ${(clienteSelec.saldo + pedido.total).toLocaleString()}
                  </div>
                )}
              </div>
            ) : (
              <div style={{ fontSize: 13, fontWeight: 700, color: S.danger }}>
                ⚠️ Seleccioná un cliente arriba para cargar a cuenta corriente
              </div>
            )}
          </div>
        )}

        <div style={{ display: "flex", gap: 12 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
          <button onClick={async () => { if (puedeConfirmar()) { try { await onCobrar(pedido.id, metodo, Number(montoRecibido), referencia, clienteSelec?.id || null); } catch(e) { console.error('Cobro error:', e); } } }} disabled={!puedeConfirmar()}
            style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: "none", background: puedeConfirmar() ? S.success : S.border, color: puedeConfirmar() ? "#000" : S.muted, fontSize: 13, fontWeight: 800, cursor: puedeConfirmar() ? "pointer" : "not-allowed" }}>
            ✅ Confirmar Cobro
          </button>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.__App));
</script>
</body>
</html>
