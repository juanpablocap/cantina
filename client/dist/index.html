const apiFetch = async (path, opts = {}) => {
  try {
    const res = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!res.ok) throw new Error(res.statusText);
    return await res.json();
  } catch (e) {
    console.error('API Error:', path, e);
    return null;
  }
};

// SYSCHART — sparkline con Chart.js
// ========================================
function SysChart({ data, color, maxY, label, unit, current }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartRef.current) {
      chartRef.current.data.labels = data.map(() => '');
      chartRef.current.data.datasets[0].data = data;
      chartRef.current.update('none');
      return;
    }
    chartRef.current = new Chart(canvasRef.current, {
      type: 'line',
      data: {
        labels: data.map(() => ''),
        datasets: [{
          data,
          borderColor: color,
          backgroundColor: color + '28',
          fill: true,
          tension: 0.4,
          pointRadius: 0,
          borderWidth: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 0 },
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: { display: false },
          y: { display: false, min: 0, max: maxY || 100, suggestedMax: maxY || 100 },
        },
      },
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, []);

  useEffect(() => {
    if (!chartRef.current) return;
    chartRef.current.data.labels = data.map(() => '');
    chartRef.current.data.datasets[0].data = data;
    chartRef.current.options.scales.y.max = maxY || Math.max(100, ...data) * 1.2 || 100;
    chartRef.current.update('none');
  }, [data, maxY]);

  return (
    React.createElement('div', { style: { position: 'relative', width: '100%', height: '100%' } },
      React.createElement('canvas', { ref: canvasRef })
    )
  );
}

// PIE CHART — donut chart usando Chart.js para estadísticas
// ========================================
const PIE_COLORS = ['#6366F1','#EC4899','#F59E0B','#10B981','#3B82F6','#8B5CF6','#EF4444','#06B6D4'];

function PieChart({ labels, data, colors }) {
  const canvasRef = useRef(null);
  const chartRef  = useRef(null);

  useEffect(() => {
    if (!canvasRef.current || typeof Chart === 'undefined') return;
    if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
    chartRef.current = new Chart(canvasRef.current, {
      type: 'doughnut',
      data: {
        labels,
        datasets: [{ data, backgroundColor: colors, borderWidth: 2, borderColor: '#07080F', hoverOffset: 6 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                const pct = total > 0 ? Math.round(ctx.parsed / total * 100) : 0;
                return ` ${ctx.label}: ${ctx.parsed} uds. (${pct}%)`;
              }
            }
          }
        },
        cutout: '55%',
      },
    });
    return () => { if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; } };
  }, []);

  useEffect(() => {
    if (!chartRef.current) return;
    chartRef.current.data.labels = labels;
    chartRef.current.data.datasets[0].data = data;
    chartRef.current.data.datasets[0].backgroundColor = colors;
    chartRef.current.update();
  }, [labels, data, colors]);

  return (
    React.createElement('div', { style: { position: 'relative', width: '100%', height: '100%' } },
      React.createElement('canvas', { ref: canvasRef })
    )
  );
}

// TOUCH KEYBOARD MODAL
// ========================================
const KB_ROWS_UPPER = [["1","2","3","4","5","6","7","8","9","0"],["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L","Ñ"],["⇧","Z","X","C","V","B","N","M","⌫"]];
const KB_ROWS_LOWER = [["1","2","3","4","5","6","7","8","9","0"],["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l","ñ"],["⇧","z","x","c","v","b","n","m","⌫"]];

function TouchKeyboard({ title, value, onChange, onDone, onCancel, S }) {
  const inputRef = React.useRef(null);
  const [caps, setCaps] = React.useState(true);
  const rows = caps ? KB_ROWS_UPPER : KB_ROWS_LOWER;
  const handleKey = (k) => {
    if (k === "⌫") onChange(value.slice(0, -1));
    else if (k === "⇧") setCaps(c => !c);
    else if (k === " ") onChange(value + " ");
    else onChange(value.length < 50 ? value + k : value);
  };
  React.useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", flexDirection: "column", justifyContent: "flex-end", background: "rgba(0,0,0,0.7)" }} onClick={onCancel}>
      <div style={{ background: S.surface, borderRadius: "20px 20px 0 0", padding: "14px 10px 10px" }} onClick={e => e.stopPropagation()}>
        <input ref={inputRef} type="text" value={value} onChange={e => onChange(e.target.value.slice(0, 50))}
          onKeyDown={e => { if (e.key === "Enter" && value.trim()) onDone(value); if (e.key === "Escape") onCancel(); if (e.key === "Tab") { e.preventDefault(); onDone(value); } }}
          style={{ position: "absolute", opacity: 0, pointerEvents: "none", height: 0 }} autoFocus />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, padding: "0 6px" }}>
          <span style={{ fontSize: 12, fontWeight: 800, color: S.muted }}>{title}</span>
          <div style={{ flex: 1, textAlign: "center", fontSize: 18, fontWeight: 800, color: S.text, minHeight: 28 }}>{value || <span style={{ color: S.muted }}>...</span>}</div>
          <button onClick={onCancel} style={{ padding: "5px 10px", borderRadius: 6, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>✕</button>
        </div>
        {rows.map((row, ri) => (
          <div key={ri} style={{ display: "flex", justifyContent: "center", gap: 4, marginBottom: 4 }}>
            {row.map(k => {
              const isSp = k === "⌫" || k === "⇧";
              return (
                <button key={k + ri} onClick={() => handleKey(k)} style={{
                  flex: isSp ? 1.3 : 1, maxWidth: isSp ? 56 : 38, height: 42, borderRadius: 8, border: "none", cursor: "pointer",
                  background: k === "⇧" ? (caps ? S.accent : S.border) : k === "⌫" ? S.border : S.bg,
                  color: k === "⇧" ? (caps ? "#fff" : S.text) : S.text,
                  fontSize: ri === 0 ? 14 : (isSp ? 14 : 16), fontWeight: 700,
                }}>{k}</button>
              );
            })}
          </div>
        ))}
        <div style={{ display: "flex", gap: 4 }}>
          <button onClick={() => { if (value.trim()) onDone(value); }} style={{ flex: 1, height: 40, borderRadius: 8, border: "none", background: value.trim() ? S.success : S.border, color: value.trim() ? "#000" : S.muted, fontSize: 13, fontWeight: 800, cursor: "pointer" }}>✓ Listo</button>
          <button onClick={() => handleKey(" ")} style={{ flex: 2, height: 40, borderRadius: 8, border: "none", background: S.bg, color: S.muted, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>espacio</button>
        </div>
      </div>
    </div>
  );
}

// ========================================
// TOUCH NUMPAD MODAL
// ========================================
function TouchNumpad({ title, value, onChange, onDone, onCancel, prefix, maxLen, S }) {
  const handleKey = (k) => {
    if (k === "C") onChange("");
    else if (k === "⌫") onChange(value.slice(0, -1));
    else if (k === "✓") onDone(value);
    else if ((!maxLen || value.length < maxLen)) onChange(value + k);
  };
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", flexDirection: "column", justifyContent: "flex-end", background: "rgba(0,0,0,0.65)", backdropFilter: "blur(4px)" }} onClick={onCancel}>
      <div style={{ background: S.surface, borderRadius: "24px 24px 0 0", padding: "24px 20px 28px", boxShadow: "0 -8px 40px rgba(0,0,0,0.5)", border: `1px solid ${S.border}` }} onClick={e => e.stopPropagation()}>
        {/* Handle bar */}
        <div style={{ width: 40, height: 4, borderRadius: 2, background: S.border, margin: "0 auto 20px" }} />
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 11, fontWeight: 900, color: S.muted, letterSpacing: "0.1em", marginBottom: 8 }}>{title}</div>
          <div style={{ fontSize: 42, fontWeight: 900, color: S.text, letterSpacing: "-0.02em", minHeight: 50, lineHeight: 1 }}>
            {prefix || ""}{value || <span style={{ color: S.border }}>0</span>}
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, maxWidth: 380, margin: "0 auto" }}>
          {["1","2","3","4","5","6","7","8","9","C","0","✓"].map(k => (
            <button key={k} onClick={() => handleKey(k)} style={{
              height: 68, borderRadius: 16,
              border: k === "✓" ? "none" : `1px solid ${S.border}`,
              background: k === "✓" ? S.success : k === "C" ? S.danger + "18" : S.surfaceHover,
              color: k === "✓" ? "#000" : k === "C" ? S.danger : S.text,
              fontSize: k === "C" ? 15 : k === "✓" ? 24 : 26,
              fontWeight: 800, cursor: "pointer",
              boxShadow: k === "✓" ? `0 4px 16px ${S.success}40` : "none",
            }}>{k}</button>
          ))}
        </div>
        <button onClick={onCancel} style={{ marginTop: 14, width: "100%", maxWidth: 380, display: "block", margin: "14px auto 0", padding: "14px 0", borderRadius: 14, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
      </div>
    </div>
  );
}

    setCajaMovimientos(prev => [...prev, { tipo: "venta", metodo, monto: totalCobrado, pedido_num: pedOriginal?.numero || 0, referencia: referencia || null, cliente_id: clienteId || null, ts: new Date().toISOString() }]);
    if (metodo === "cuenta_corriente" && clienteId) setClientes(prev => prev.map(c => c.id === clienteId ? { ...c, saldo: c.saldo + totalCobrado } : c));
    setCobrandoPedido(null);
    setTicketVisible({ ...pedOriginal, metodo_pago: metodo });
    playCajaCobroSound();
    setTimeout(() => setTicketVisible(null), 1500);
    showMsg("💰 Cobrado $" + totalCobrado.toLocaleString() + " con " + (metodo === "efectivo" ? "efectivo" : metodo === "transferencia" ? "transferencia" : "fiado"));
  };

  const marcarEntregado = async (id) => {
    const result = await apiFetch(`/pedidos/${id}`, { method: 'PUT', body: { estado: "entregado" } });
    if (!result) { showMsg("❌ Error al marcar entregado"); return; }
    setPedidos(prev => prev.map(p => p.id === id ? { ...p, estado: "entregado" } : p));
  };
  const marcarListo = async (id) => {
    const result = await apiFetch(`/pedidos/${id}`, { method: 'PUT', body: { estado: "listo" } });
    if (!result) { showMsg("❌ Error al marcar listo"); return; }
    setPedidos(prev => prev.map(p => p.id === id ? { ...p, estado: "listo" } : p));
    playCajaListoSound();
  };

  // Cancel pedido (returns stock)
  const ejecutarCancelar = async (pedidoId) => {
    const ped = pedidos.find(p => p.id === pedidoId);
    if (!ped) return;
    const result = await apiFetch(`/pedidos/${pedidoId}/cancelar`, { method: 'POST' });
    if (!result) { showMsg("❌ Error al cancelar pedido"); return; }
    setPedidos(prev => prev.map(p => p.id === pedidoId ? { ...p, estado: "cancelado" } : p));
    setProductos(prev => prev.map(p => {
      const item = ped.items.find(i => i.producto_id === p.id);
      return item ? { ...p, stock: p.stock + item.cantidad } : p;
    }));
    showMsg("❌ Pedido #" + String(ped.numero).padStart(3, "0") + " cancelado — stock devuelto");
  };

  // Returns "#" or the mozo's initial for mesa pedidos
  const pedidoPrefix = (p) => {
    if (p.tipo !== "mesa" || !mesasMozos[p.mesa_numero]) return "#";
    const u = usuarios.find(u => u.id === mesasMozos[p.mesa_numero]);
    return u ? u.nombre[0].toUpperCase() : "#";
  };
  const asignarMozo = async (mesa, userId) => {
    const next = { ...mesasMozos };
    if (userId === null) delete next[mesa]; else next[mesa] = userId;

    await apiFetch('/mesas/mozos', { method: 'PUT', body: { mesa, userId: userId ?? null } });
  };

  const liberarMesa = async (num) => {
    if (!window.confirm(`¿Liberar mesa ${num}? La mesa quedará libre para nuevos clientes.`)) return;
    let result = null;
    try {
      const res = await fetch(API + `/mesas/${num}/liberar`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
      const body = await res.json();
      if (!res.ok) { showMsg(`❌ ${body.error || 'Error al liberar mesa'}`); return; }
      result = body;
    } catch(e) { showMsg("❌ Error al liberar mesa"); return; }
    if (!result) { showMsg("❌ Error al liberar mesa"); return; }
    setPedidos(prev => prev.map(p => p.tipo === 'mesa' && Number(p.mesa_numero) === num ? { ...p, mesa_liberada: true } : p));
    setMesasMozos(prev => { const next = { ...prev }; delete next[num]; return next; });
    setMesaSeleccionada(null);
    showMsg(`✅ Mesa ${num} liberada`);

  const pedidosMesa = (num) => pedidos.filter(p => p.tipo === "mesa" && Number(p.mesa_numero) === Number(num) && !p.mesa_liberada && p.estado !== 'cancelado');
  const mesaActiva = (num) => pedidosMesa(num).length > 0;
  const totalMesa = (num) => pedidosMesa(num).filter(p => !p.cobrado).reduce((s, p) => s + p.total, 0);

  // Cierre de caja
  const hacerCierreCaja = () => {
    const pendientes = pedidos.filter(p => !p.cobrado && p.estado !== 'cancelado');
    if (pendientes.length > 0) {
      setCierreBlockado(pendientes);
      return;

    const efectivo = cajaMovimientos.filter(m => m.metodo === "efectivo").reduce((s, m) => s + m.monto, 0);
    const transferencia = cajaMovimientos.filter(m => m.metodo === "transferencia").reduce((s, m) => s + m.monto, 0);
    const fiado = cajaMovimientos.filter(m => m.metodo === "cuenta_corriente").reduce((s, m) => s + m.monto, 0);
    const totalVentas = efectivo + transferencia + fiado;
    const pedidosCobrados = pedidos.filter(p => p.cobrado);
    const cantPedidos = pedidosCobrados.length;
    setCierreCaja({ efectivo, transferencia, fiado, totalVentas, cantPedidos, pedidosCobrados, movimientos: [...cajaMovimientos], fecha: new Date().toISOString(), arqueoEfectivo: null, diferencia: null });
  };

    }).join("");

    const css = '*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;color:#1a1a1a;padding:30px;max-width:800px;margin:0 auto}h1{font-size:22px;margin-bottom:4px}.sub{color:#666;font-size:12px;margin-bottom:20px}.cards{display:flex;gap:12px;margin-bottom:20px}.card{flex:1;padding:14px;border:1px solid #ddd;border-radius:8px;text-align:center}.card .l{font-size:10px;font-weight:700;color:#888;letter-spacing:0.04em}.card .v{font-size:22px;font-weight:900;margin-top:4px}.tot{background:#FEF0EC;border-color:#D4532A40}.tot .v{color:#D4532A}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}th{text-align:left;padding:8px;background:#f5f5f0;font-size:10px;font-weight:700;color:#666;border-bottom:2px solid #ddd}td{padding:7px 8px;border-bottom:1px solid #eee}tfoot td{border-top:2px solid #1a1a1a;font-weight:900;padding:10px 8px}.ft{margin-top:24px;text-align:center;font-size:10px;color:#aaa;border-top:1px solid #ddd;padding-top:12px}';

    const html = ['<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Cierre ',fechaFile,'</title><st','yle>',css,'</st','yle></head><body>',
    '<h1>🍽️ Cierre de Caja</h1><div class="sub">',fechaStr,' · Cierre: ',horaStr,'</div>',

    '<div class="card"><div class="l">TRANSFERENCIAS</div><div class="v" style="color:#4A90D9">$',cierre.transferencia.toLocaleString(),'</div></div>',
    '<div class="card"><div class="l">FIADO</div><div class="v" style="color:#E5A100">$',cierre.fiado.toLocaleString(),'</div></div>',
    '<div class="card tot"><div class="l">TOTAL</div><div class="v">$',cierre.totalVentas.toLocaleString(),'</div><div style="font-size:11px;color:#888">',cierre.cantPedidos,' pedidos</div></div></div>',
    '<table><thead><tr><th>N°</th><th>HORA</th><th>TIPO</th><th>DETALLE</th><th>COBRO</th><th style="text-align:right">TOTAL</th></tr></thead><tbody>',rows,'</tbody>',

    '<div class="ft">CANTINA POS · ',fechaStr,' · ',horaStr,'</div></body></html>'].join('');

    // Silent save (in production this downloads a file)
    try {
      const blob = new Blob([html], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `cierre-caja-${fechaFile}.html`;
      document.body.appendChild(a);
      a.click();

    }

        ` : ''}

      `}</style>

      {/* ===== TOP BAR ===== */}
      {theme === 'modern' ? (
        /* MODERN: Minimal header, NO tabs here (tabs moved to bottom nav) */
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "0 20px", height: 52, background: S.surface, borderBottom: `1px solid ${S.border}`, flexShrink: 0, boxShadow: `0 2px 12px rgba(0,0,0,0.3)` }}>
          {/* Brand */}
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 36, height: 36, borderRadius: 11, background: `linear-gradient(135deg, ${S.accent}, ${S.accent}BB)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, boxShadow: `0 3px 10px ${S.accent}50` }}>🍽️</div>
            <div>

          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

            <div style={{ display: "flex", alignItems: "center", gap: 5, padding: "4px 10px", borderRadius: 8, background: S.success + "15", border: `1px solid ${S.success}30` }}>

            </div>
            {loginUser && <div style={{ padding: "4px 10px", borderRadius: 8, background: S.accent + "20", border: `1px solid ${S.accent}40`, fontSize: 10, fontWeight: 800, color: S.accent }}>{loginUser.nombre}</div>}
            <button onClick={toggleTheme} title="Cambiar a Clásico" style={{ width: 34, height: 34, borderRadius: 9, border: `1px solid ${S.border}`, background: S.surfaceHover, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, color: S.muted }}>☀️</button>

      ) : theme === 'tablet' ? (() => {
        const pedidosSinEntregar = pedidos.filter(p => p.estado === "listo" && !p.solo_despacho).length;
        const pedidosSinCobrar = pedidos.filter(p => !p.cobrado && p.estado !== 'cancelado').length;
        const pedidosCocina = pedidos.filter(p => ["pendiente", "en_preparacion"].includes(p.estado) && !p.solo_despacho).length;

        return (

                if (key === "caja" && pedidosSinCobrar > 0) { badge = pedidosSinCobrar; }

                {tabletMenuOpen && (

              </div>

                  background: !catActiva ? S.accent : theme === 'modern' ? S.surfaceHover : "transparent",
                  color: !catActiva ? "#fff" : S.text, fontSize: theme === 'modern' ? 13 : 12, fontWeight: 800, cursor: "pointer", whiteSpace: "nowrap",
                  boxShadow: !catActiva && theme === 'modern' ? `0 2px 10px ${S.accent}40` : "none",
                }}>✦ Todos</button>
                {categorias.map(c => (
                  <button key={c.id} onClick={() => setCatActiva(c.id)} style={{
                    padding: theme === 'modern' ? "10px 18px" : "8px 16px", borderRadius: 12,
                    border: `2px solid ${catActiva === c.id ? c.color : S.border}`,
                    background: catActiva === c.id ? c.color : theme === 'modern' ? S.surfaceHover : "transparent",
                    color: catActiva === c.id ? "#fff" : S.text, fontSize: theme === 'modern' ? 13 : 12, fontWeight: 800, cursor: "pointer", whiteSpace: "nowrap",
                    boxShadow: catActiva === c.id && theme === 'modern' ? `0 2px 10px ${c.color}50` : "none",
                  }}>{c.emoji} {c.nombre}{c.despacho_directo ? " ⚡" : ""}</button>
                ))}
              </div>
              {/* Products grid */}
              <div style={{ flex: 1, overflow: "auto", padding: theme === 'modern' ? 18 : 16, display: "grid", gridTemplateColumns: `repeat(auto-fill, minmax(${theme === 'modern' ? 175 : 140}px, 1fr))`, gap: theme === 'modern' ? 14 : 12, alignContent: "start" }}>
                {productosFiltrados.map(p => renderProductoCard(p))}
              </div>
            </div>
            {cartPanel}
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: COCINA */}
      {/* ========================================= */}
      {tab === "cocina" && (() => {
        const pedidosCocina = pedidos.filter(p => ["pendiente", "en_preparacion", "listo"].includes(p.estado) && !p.solo_despacho)
          .sort((a, b) => {
            const order = { pendiente: 0, en_preparacion: 1, listo: 2 };
            const diff = (order[a.estado] ?? 3) - (order[b.estado] ?? 3);
            if (diff !== 0) return diff;
            return new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
          });
        return (
        <div style={{ flex: 1, overflow: "auto", padding: theme === 'tablet' ? 14 : 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em" }}>
              PEDIDOS EN COCINA ({pedidosCocina.length})
            </div>
            <div style={{ display: "flex", gap: 12 }}>
              {[
                { label: "Pendientes", count: pedidosCocina.filter(p => p.estado === "pendiente").length, color: S.danger },
                { label: "Preparando", count: pedidosCocina.filter(p => p.estado === "en_preparacion").length, color: S.warning },
                { label: "Listos", count: pedidosCocina.filter(p => p.estado === "listo").length, color: S.success },
              ].filter(x => x.count > 0).map(x => (
                <span key={x.label} style={{ fontSize: 12, fontWeight: 800, color: x.color }}>
                  {x.count} {x.label}
                </span>
              ))}
            </div>
          </div>

          {pedidosCocina.length === 0 ? (
            <div style={{ textAlign: "center", padding: "80px 0", color: S.muted }}>
              <div style={{ fontSize: 64 }}>👨‍🍳</div>
              <div style={{ fontSize: 18, fontWeight: 700, marginTop: 16 }}>Sin pedidos en cocina</div>
              <div style={{ fontSize: 13, marginTop: 6 }}>Los nuevos pedidos aparecerán acá</div>
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: `repeat(auto-fill, minmax(${theme === 'tablet' ? 240 : 320}px, 1fr))`, gap: 16 }}>
              {pedidosCocina.map(p => {
                const isPendiente = p.estado === "pendiente";
                const isPreparando = p.estado === "en_preparacion";
                const isListo = p.estado === "listo";
                const borderColor = isPendiente ? S.danger : isPreparando ? S.warning : S.success;
                const itemsCocina = p.items.filter(i => !i.despacho_directo);
                const itemsDirecto = p.items.filter(i => i.despacho_directo);
                const elapsed = Math.floor((Date.now() - new Date(p.createdAt).getTime()) / 1000);
                const hrs = Math.floor(elapsed / 3600);
                const mins = Math.floor(elapsed / 60); const minsDisp = Math.floor((elapsed % 3600) / 60);
                const secs = elapsed % 60;

                return (
                  <div key={p.id} className={isPendiente ? "pulse-border anim-in" : "anim-in"} style={{
                    borderRadius: 16, overflow: "hidden", background: S.surface,
                    border: `3px solid ${borderColor}`,
                  }}>
                    {/* Header */}
                    <div style={{ padding: theme === 'tablet' ? "10px 14px" : "14px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", background: borderColor + "20", borderBottom: `2px solid ${borderColor}40` }}>
                      <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
                        <span style={{ fontSize: 32, fontWeight: 900, fontFamily: "'JetBrains Mono', monospace" }}>{pedidoPrefix(p)}{String(p.numero).padStart(3, "0")}</span>
                        <span style={{ fontSize: 14, fontWeight: 800, color: borderColor }}>
                          {p.tipo === "mesa" ? `MESA ${p.mesa_numero}` : p.tipo === "barra" ? "BARRA" : "🛍️ LLEVAR"}
                        </span>
                        {p.nombre_cliente && (
                          <span style={{ fontSize: 14, fontWeight: 700, color: S.info }}>📢 {p.nombre_cliente}</span>
                        )}
                      </div>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 22, fontWeight: 900, color: mins >= 10 ? S.danger : mins >= 5 ? S.warning : S.success }}>
                        {hrs > 0 ? `${hrs}:${String(minsDisp).padStart(2,"0")}:${String(secs).padStart(2,"0")}` : `${mins}:${String(secs).padStart(2,"0")}`}
                      </span>
                    </div>

                    {/* Items */}
                    <div style={{ padding: theme === 'tablet' ? "8px 14px" : "12px 20px" }}>
                      {itemsCocina.map((item, idx) => (
                        <div key={idx} style={{ padding: theme === 'tablet' ? "5px 0" : "8px 0", borderBottom: idx < itemsCocina.length - 1 ? `1px solid ${S.border}` : "none", display: "flex", alignItems: "flex-start", gap: 12 }}>
                          <div style={{ minWidth: 36, height: 36, borderRadius: 10, background: borderColor, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'JetBrains Mono', monospace", fontSize: 18, fontWeight: 900, color: "#000", flexShrink: 0 }}>
                            {item.cantidad}
                          </div>
                          <div>
                            <div style={{ fontSize: 16, fontWeight: 800 }}>{itemNombre(item)}</div>
                            {item.observaciones && (
                              <div style={{ fontSize: 13, fontWeight: 700, color: S.danger, marginTop: 2 }}>⚠️ {item.observaciones}</div>
                            )}
                          </div>
                        </div>
                      ))}
                      {itemsDirecto.length > 0 && (
                        <div style={{ marginTop: 8, padding: "6px 10px", borderRadius: 8, background: S.success + "10", border: `1px solid ${S.success}30`, fontSize: 12, fontWeight: 700, color: S.success }}>
                          🍺 +{itemsDirecto.reduce((s, i) => s + i.cantidad, 0)} bebida(s) en mostrador
                        </div>
                      )}
                    </div>

                    {/* Actions */}
                    <div style={{ padding: theme === 'tablet' ? "6px 14px 10px" : "10px 20px 16px" }}>
                      {isPendiente && (
                        <button onClick={async () => {
                          const result = await apiFetch(`/pedidos/${p.id}`, { method: 'PUT', body: { estado: 'en_preparacion' } });
                          if (result) setPedidos(prev => prev.map(x => x.id === p.id ? { ...x, estado: 'en_preparacion' } : x));
                        }} style={{
                          width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                          background: `linear-gradient(135deg, ${S.warning}, #FF9500)`, color: "#000",
                          fontSize: 16, fontWeight: 900, cursor: "pointer", letterSpacing: "0.02em",
                        }}>🔥 EMPEZAR A PREPARAR</button>
                      )}
                      {isPreparando && (
                        <button onClick={() => marcarListo(p.id)} style={{
                          width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                          background: `linear-gradient(135deg, ${S.success}, #2DD47A)`, color: "#000",
                          fontSize: 16, fontWeight: 900, cursor: "pointer", letterSpacing: "0.02em",
                        }}>✅ LISTO PARA ENTREGAR</button>
                      )}
                      {isListo && (
                        <div style={{ display: "flex", gap: 10 }}>
                          <div style={{ flex: 1, padding: "14px 0", borderRadius: 12, background: S.success + "20", color: S.success, fontSize: 15, fontWeight: 900, textAlign: "center" }}>
                            ✅ ESPERANDO RETIRO
                          </div>
                          <button onClick={() => marcarEntregado(p.id)} style={{
                            padding: "14px 20px", borderRadius: 12, border: "none",
                            background: S.info, color: "#fff",
                            fontSize: 14, fontWeight: 900, cursor: "pointer", whiteSpace: "nowrap",
                          }}>📦 ENTREGADO</button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: MESAS */}
      {/* ========================================= */}
      {tab === "mesas" && (() => {
        const activas = Array.from({ length: MESAS_TOTAL }, (_, i) => i + 1).filter(n => mesaActiva(n)).length;
        const sel = mesaSeleccionada;
        const selPeds = sel ? pedidosMesa(sel) : [];
        const selActiva = selPeds.length > 0;
        const selTotal = selActiva ? selPeds.filter(p => !p.cobrado).reduce((s, p) => s + p.total, 0) : 0;

        // Tablet: status derivado por mesa
        const getMesaStatus = (num) => {
          const peds = pedidosMesa(num);
          if (peds.length === 0) return 'libre';
          const allCobrado = peds.every(p => p.cobrado);
          if (allCobrado) return 'lista_liberar';
          const firstMs = Math.min(...peds.map(p => new Date(p.createdAt).getTime()));
          if ((Date.now() - firstMs) / 60000 >= 45) return 'urgente';
          if (peds.some(p => p.estado === 'entregado' && !p.cobrado)) return 'por_cobrar';
          if (peds.some(p => p.estado === 'listo')) return 'lista';
          return 'preparando';
        };
        const tblStatusOrder = { lista_liberar: 0, urgente: 1, por_cobrar: 2, lista: 3, preparando: 4, libre: 5 };
        const mesasConInfo = Array.from({ length: MESAS_TOTAL }, (_, i) => i + 1)
          .map(num => ({ num, status: getMesaStatus(num), peds: pedidosMesa(num) }))
          .sort((a, b) => tblStatusOrder[a.status] - tblStatusOrder[b.status]);
        const tblCounts = { lista_liberar: 0, urgente: 0, por_cobrar: 0, lista: 0, preparando: 0, libre: 0 };
        mesasConInfo.forEach(m => tblCounts[m.status]++);
        const tblOcupadas = tblCounts.lista_liberar + tblCounts.urgente + tblCounts.por_cobrar + tblCounts.lista + tblCounts.preparando;
        const mesasFiltradas = mesasTabFilter === 'todas' ? mesasConInfo
          : mesasTabFilter === 'ocupadas' ? mesasConInfo.filter(m => m.status !== 'libre')
          : mesasConInfo.filter(m => m.status === mesasTabFilter);
        const tblCfg = {
          lista_liberar: { label: 'Liberar',    border: S.info,    bg: S.info     + '25', col: S.info     },
          urgente:       { label: '+45 min',    border: S.danger,  bg: S.danger   + '20', col: S.danger   },
          por_cobrar:    { label: 'Por cobrar', border: S.accent,  bg: S.accent   + '20', col: S.accent   },
          lista:         { label: 'Listo',      border: S.success, bg: S.success  + '20', col: S.success  },
          preparando:    { label: 'Preparando', border: S.warning, bg: S.warning  + '20', col: S.warning  },
          libre:         { label: 'Libre',      border: 'transparent', bg: 'transparent', col: S.muted    },
        };

        return (
        <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
          {/* Left: mesa grid */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
            {theme !== 'tablet' ? (
              <>
                <div style={{ padding: "12px 16px 4px", fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.06em", flexShrink: 0, display: "flex", alignItems: "center", gap: 12 }}>
                  <span>MESAS — {activas} ocupadas de {MESAS_TOTAL}</span>
                  {mesaKeyInput && (
                    <span style={{ padding: "4px 12px", borderRadius: 8, background: S.accent, color: "#fff", fontSize: 13, fontWeight: 900, letterSpacing: "0.04em" }}>
                      → Mesa {mesaKeyInput} <span style={{ fontSize: 10, opacity: 0.8 }}>Enter para seleccionar</span>
                    </span>
                  )}
                </div>
                <div style={{ flex: 1, display: "flex", flexWrap: "wrap", gap: 6, alignContent: "flex-start", overflow: "auto", padding: "8px 16px 12px" }}>
                  {Array.from({ length: MESAS_TOTAL }, (_, i) => i + 1).map(num => {
                    const peds = pedidosMesa(num);
                    const activa = peds.length > 0;
                    const allEntregado = activa && peds.every(p => p.estado === 'entregado');
                    const allCobrado = activa && peds.every(p => p.cobrado);
                    const puedeLiberarse = allEntregado && allCobrado;
                    const tieneListos = peds.some(p => p.estado === 'listo');
                    const enCocina = peds.some(p => ['pendiente', 'en_preparacion'].includes(p.estado));
                    const porCobrar = !allCobrado && (allEntregado || tieneListos);
                    const isSelected = sel === num;
                    const bg = !activa ? S.border + "40" : puedeLiberarse ? S.info + "25" : porCobrar ? S.danger + "30" : tieneListos ? S.success + "30" : enCocina ? S.warning + "30" : S.accent + "20";
                    const brd = isSelected ? S.accent : !activa ? "transparent" : puedeLiberarse ? S.info : porCobrar ? S.danger : tieneListos ? S.success : enCocina ? S.warning : S.accent + "50";
                    const sz = activas <= 6 ? 76 : activas <= 12 ? 64 : activas <= 20 ? 56 : 48;
                    const fs = activas <= 6 ? 22 : activas <= 12 ? 18 : 16;
                    return (
                      <button key={num} onClick={() => setMesaSeleccionada(isSelected ? null : num)}
                        className={porCobrar && !isSelected ? "pago-pend" : ""}
                        style={{
                          width: sz, height: sz, borderRadius: 12, border: `3px solid ${brd}`,
                          background: bg, cursor: "pointer", display: "flex", flexDirection: "column",
                          alignItems: "center", justifyContent: "center", position: "relative",
                          transition: "all 0.15s", transform: isSelected ? "scale(1.1)" : "scale(1)",
                          boxShadow: isSelected ? `0 0 12px ${S.accent}40` : "none",
                        }}>
                        <span style={{ fontSize: fs, fontWeight: 900, color: activa ? S.text : S.muted, fontFamily: "'JetBrains Mono', monospace" }}>{num}</span>
                        {activa && (
                          <div style={{ display: "flex", gap: 3, marginTop: 2, alignItems: "center" }}>
                            <span title="Cocina" style={{ fontSize: 7, color: allEntregado ? S.success : tieneListos ? S.success : enCocina ? S.warning : S.muted }}>●</span>
                            <span title="Pago" style={{ fontSize: 7, color: allCobrado ? S.success : S.danger }}>●</span>
                          </div>
                        )}
                      </button>
                    );
                  })}
                </div>
              </>
            ) : (
              <>
                {/* Tablet: stats + filtros */}
                <div style={{ padding: "10px 14px", borderBottom: `1px solid ${S.border}`, flexShrink: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 8 }}>
                    <span style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.06em" }}>
                      MESAS — {tblOcupadas} ocupadas de {MESAS_TOTAL}
                    </span>
                    {tblCounts.urgente > 0 && <span style={{ fontSize: 10, fontWeight: 700, color: S.danger }}>● {tblCounts.urgente} urgentes</span>}
                    {tblCounts.preparando > 0 && <span style={{ fontSize: 10, fontWeight: 700, color: S.warning }}>● {tblCounts.preparando} preparando</span>}
                    {tblCounts.lista > 0 && <span style={{ fontSize: 10, fontWeight: 700, color: S.success }}>● {tblCounts.lista} listas</span>}
                    {tblCounts.por_cobrar > 0 && <span style={{ fontSize: 10, fontWeight: 700, color: S.accent }}>● {tblCounts.por_cobrar} por cobrar</span>}
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {[
                      { key: "todas", label: `Todas ${MESAS_TOTAL}` },
                      { key: "ocupadas", label: `Ocupadas ${tblOcupadas}`, color: S.warning },
                      { key: "lista", label: `Listas ${tblCounts.lista}`, color: S.success },
                      { key: "por_cobrar", label: `Cobrar ${tblCounts.por_cobrar}`, color: S.accent },
                      tblCounts.urgente > 0 ? { key: "urgente", label: `Urgentes ${tblCounts.urgente}`, color: S.danger } : null,
                    ].filter(Boolean).map(({ key, label, color }) => (
                      <button key={key} onClick={() => setMesasTabFilter(key)}
                        style={{ padding: "5px 10px", borderRadius: 8,
                          border: `1px solid ${mesasTabFilter === key ? (color || S.accent) : S.border}`,
                          background: mesasTabFilter === key ? (color || S.accent) + "20" : "transparent",
                          color: mesasTabFilter === key ? (color || S.accent) : S.muted,
                          fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                        {label}
                      </button>
                    ))}
                  </div>
                </div>
                {/* Tablet: card grid */}
                <div style={{ flex: 1, overflow: "auto", padding: "10px 14px" }}>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(148px, 1fr))", gap: 8 }}>
                    {mesasFiltradas.map(({ num, status, peds: mPeds }) => {
                      const cfg = tblCfg[status];
                      const isLibre = status === 'libre';
                      const allItems = mPeds.flatMap(p => p.items);
                      const mTotal = mPeds.reduce((s, p) => s + p.total, 0);
                      const firstMs = mPeds.length ? Math.min(...mPeds.map(p => new Date(p.createdAt).getTime())) : null;
                      const elapsedSec = firstMs ? Math.floor((Date.now() - firstMs) / 1000) : 0;
                      const eHrs = Math.floor(elapsedSec / 3600);
                      const eMin = Math.floor(elapsedSec / 60);
                      const eMinDisp = Math.floor((elapsedSec % 3600) / 60);
                      const eSec = elapsedSec % 60;
                      const timerCol = eMin >= 45 ? S.danger : eMin >= 30 ? S.warning : S.muted;
                      const merged = [];
                      allItems.forEach(item => {
                        const ex = merged.find(m => m.producto_id === item.producto_id);
                        if (ex) ex.cantidad += item.cantidad; else merged.push({ ...item });
                      });
                      const shown = merged.slice(0, 3);
                      const extra = merged.length - 3;
                      return (
                        <button key={num}
                          onClick={() => setMesaSeleccionada(mesaSeleccionada === num ? null : num)}
                          className={status === 'urgente' ? "pago-pend" : ""}
                          style={{
                            textAlign: "left", padding: "10px", borderRadius: 12, cursor: "pointer",
                            border: `1px solid ${S.border}`,
                            borderLeft: isLibre ? `1px solid ${S.border}` : `3px solid ${cfg.border}`,
                            background: S.surface, opacity: isLibre ? 0.35 : 1,
                            display: "flex", flexDirection: "column", gap: 4,
                            minHeight: isLibre ? 44 : "auto",
                            outline: mesaSeleccionada === num ? `2px solid ${S.accent}` : "none",
                            outlineOffset: 2,
                          }}>
                          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 4 }}>
                            <span style={{ fontSize: 20, fontWeight: 900, fontFamily: "'JetBrains Mono', monospace", color: status === 'lista' ? S.success : S.text, lineHeight: 1 }}>{num}</span>
                            {!isLibre && (
                              <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 5, background: cfg.bg, color: cfg.col, whiteSpace: "nowrap" }}>
                                {cfg.label}
                              </span>
                            )}
                          </div>
                          {!isLibre && (
                            <>
                              <div style={{ fontSize: 11, color: "#E2E6F0", lineHeight: 1.5 }}>
                                {shown.map((item, idx) => (
                                  <div key={idx} style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                                    {item.cantidad}× {itemNombre(item)}
                                  </div>
                                ))}
                                {extra > 0 && <div style={{ color: S.muted, fontSize: 10 }}>+{extra} {extra === 1 ? "item" : "items"}</div>}
                              </div>
                              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 2, paddingTop: 6, borderTop: `1px solid ${S.border}` }}>
                                <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11, fontWeight: 700, color: timerCol }}>⏱ {eHrs > 0 ? `${eHrs}:${String(eMinDisp).padStart(2,"0")}:${String(eSec).padStart(2,"0")}` : `${eMin}:${String(eSec).padStart(2,"0")}`}</span>
                                <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                                  <span title="Cocina" style={{ fontSize: 8, color: mPeds.every(p => p.estado === 'entregado') ? S.success : mPeds.some(p => p.estado === 'listo') ? S.success : S.warning }}>●</span>
                                  <span title="Pago" style={{ fontSize: 8, color: mPeds.every(p => p.cobrado) ? S.success : S.danger }}>●</span>
                                  <span style={{ fontSize: 12, fontWeight: 800, color: S.accent }}>${mTotal.toLocaleString()}</span>
                                </div>
                              </div>
                            </>
                          )}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </>
            )}
          </div>

          {/* Right: detail panel */}
          <div style={{ width: sel ? 340 : 0, transition: "width 0.2s", overflow: "hidden", borderLeft: sel ? `2px solid ${S.border}` : "none", background: S.surface, display: "flex", flexDirection: "column" }}>
            {sel && (
              <>
                {/* Header */}
                <div style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${S.border}`, flexShrink: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 12, fontWeight: 900, color: S.muted }}>MESA</span>
                    <span style={{ fontSize: 28, fontWeight: 900, fontFamily: "'JetBrains Mono', monospace", color: S.text }}>{String(sel).padStart(2, "0")}</span>
                  </div>
                  <button onClick={() => setMesaSeleccionada(null)} style={{ padding: "6px 12px", borderRadius: 8, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>✕</button>
                </div>
                {/* Mozo assignment */}
                <div style={{ padding: "6px 14px", borderBottom: `1px solid ${S.border}`, display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap", flexShrink: 0 }}>
                  <span style={{ fontSize: 10, fontWeight: 800, color: S.muted }}>👤</span>
                  <span onClick={() => asignarMozo(sel, null)} title="Sin mozo"
                    style={{ padding: "4px 8px", borderRadius: 8, border: `1px solid ${!mesasMozos[sel] ? S.accent : S.border}`, background: !mesasMozos[sel] ? S.accent : "transparent", color: !mesasMozos[sel] ? "#fff" : S.muted, fontSize: 10, fontWeight: 800, cursor: "pointer" }}>—</span>
                  {usuarios.filter(u => (u.rol === 'mozo' || u.rol === 'cajero') && u.nombre !== 'Mozo C').map(u => {
                    const isAssigned = mesasMozos[sel] === u.id;
                    return (
                      <span key={u.id} onClick={() => asignarMozo(sel, u.id)}
                        style={{ padding: "4px 9px", borderRadius: 8, border: `1px solid ${isAssigned ? S.accent : S.border}`, background: isAssigned ? S.accent : S.bg, color: isAssigned ? "#fff" : S.text, fontSize: 10, fontWeight: 800, cursor: "pointer", whiteSpace: "nowrap" }}>
                        {u.nombre}
                      </span>
                    );
                  })}
                </div>

                {selActiva ? (
                  <div style={{ flex: 1, overflow: "auto", padding: "10px 14px" }}>
                    {/* Timer + status */}
                    {(() => {
                      const firstTime = Math.min(...selPeds.map(p => new Date(p.createdAt).getTime()));
                      const elapsed = Math.floor((Date.now() - firstTime) / 1000);
                      const eHrs = Math.floor(elapsed / 3600);
                      const eMin = Math.floor(elapsed / 60); const eMinDisp = Math.floor((elapsed % 3600) / 60); const eSec = elapsed % 60;
                      const statusOrder = { pendiente: 0, en_preparacion: 1, listo: 2, entregado: 3 };
                      const latestStatus = selPeds.reduce((w, p) => statusOrder[p.estado] < statusOrder[w] ? p.estado : w, "entregado");
                      return (
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, fontWeight: 800, color: eMin >= 45 ? S.danger : eMin >= 30 ? S.warning : S.muted }}>
                            ⏱ {eHrs > 0 ? `${eHrs}:${String(eMinDisp).padStart(2,"0")}:${String(eSec).padStart(2,"0")}` : `${eMin}:${String(eSec).padStart(2,"0")}`}
                          </span>
                          <span style={{ fontSize: 10, fontWeight: 800, padding: "3px 8px", borderRadius: 5, color: "#fff",
                            background: latestStatus === "pendiente" ? S.danger : latestStatus === "en_preparacion" ? S.warning : latestStatus === "listo" ? S.success : S.muted }}>
                            {latestStatus === "pendiente" ? "🔥 COCINA" : latestStatus === "en_preparacion" ? "🔥 PREPARANDO" : latestStatus === "listo" ? "✅ LISTO" : "ENTREGADO"}
                          </span>
                        </div>
                      );
                    })()}

                    {/* Pedidos */}
                    {selPeds.map(p => (
                      <div key={p.id} style={{ marginBottom: 8, padding: "8px 10px", borderRadius: 8, background: S.bg, border: `1px solid ${S.border}` }}>
                        <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, marginBottom: 3 }}>{pedidoPrefix(p)}{String(p.numero).padStart(3, "0")}</div>
                        <div style={{ fontSize: 12, color: S.text, lineHeight: 1.5 }}>
                          {p.items.map(i => `${i.cantidad}x ${itemNombre(i)}`).join(" · ")}
                        </div>
                      </div>
                    ))}

                    {/* Nota */}
                    <input type="text" value={mesaNotas[sel] || ""}
                      onChange={e => setMesaNotas(prev => ({...prev, [sel]: e.target.value}))}
                      placeholder="📝 Agregar nota..."
                      style={{ width: "100%", padding: "6px 10px", borderRadius: 6, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontSize: 11, outline: "none", marginBottom: 10, fontFamily: "'DM Sans', sans-serif" }} />

                    {/* Total + actions */}
                    <div style={{ borderTop: `1px solid ${S.border}`, paddingTop: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                        <span style={{ fontSize: 12, fontWeight: 600, color: S.muted }}>TOTAL PENDIENTE</span>
                        <span style={{ fontSize: 22, fontWeight: 900, color: S.accent }}>${selTotal.toLocaleString()}</span>
                      </div>
                      {/* Indicadores de estado */}
                      <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                        <span style={{ fontSize: 10, fontWeight: 700, color: selPeds.every(p => p.estado === 'entregado') ? S.success : S.muted }}>
                          {selPeds.every(p => p.estado === 'entregado') ? "✅" : "⏳"} Entregado
                        </span>
                        <span style={{ fontSize: 10, fontWeight: 700, color: selPeds.every(p => p.cobrado) ? S.success : S.muted }}>
                          {selPeds.every(p => p.cobrado) ? "✅" : "⏳"} Pagado
                        </span>
                      </div>
                      <div style={{ display: "flex", gap: 6, flexDirection: "column" }}>
                        <div style={{ display: "flex", gap: 6 }}>
                          {selPeds.some(p => p.estado === "listo") && (
                            <button onClick={() => { selPeds.filter(p => p.estado === "listo").forEach(p => marcarEntregado(p.id)); }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: S.success, color: "#000", fontSize: 12, fontWeight: 800, cursor: "pointer" }}>
                              ✅ Entregado
                            </button>
                          )}
                          {selPeds.some(p => !p.cobrado) && (
                            <button onClick={() => {
                              const sinCobrar = selPeds.filter(p => !p.cobrado);
                              const allItems = sinCobrar.flatMap(p => p.items.map(i => ({ ...i, pedNum: p.numero })));
                              const totalSinCobrar = sinCobrar.reduce((s, p) => s + p.total, 0);
                              const merged = { ...sinCobrar[0], total: totalSinCobrar, items: allItems, numero: sinCobrar.map(p => p.numero).join("+") };
                              setCobrandoPedido(merged);
                            }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: S.accent, color: "#fff", fontSize: 12, fontWeight: 800, cursor: "pointer" }}>
                              💰 Cobrar mesa
                            </button>
                          )}
                        </div>
                        {selPeds.length > 0 && selPeds.every(p => p.cobrado) && (
                          <button onClick={() => liberarMesa(sel)} style={{ width: "100%", padding: "10px 0", borderRadius: 8, border: "none", background: S.info, color: "#fff", fontSize: 12, fontWeight: 800, cursor: "pointer" }}>
                            🚪 Liberar mesa
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 8, color: S.muted }}>
                    <span style={{ fontSize: 32, opacity: 0.3 }}>🪑</span>
                    <span style={{ fontSize: 13, fontWeight: 600 }}>Mesa {sel} — Libre</span>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: PEDIDOS */}
      {/* ========================================= */}
      {tab === "pedidos" && (() => {
        const estadoLabel = { pendiente: "COCINA", en_preparacion: "PREPARANDO", listo: "LISTO ✓", entregado: "ENTREGADO", cancelado: "CANCELADO" };
        const estadoColor = e => e === "pendiente" ? S.danger : e === "en_preparacion" ? S.warning : e === "listo" ? S.success : e === "cancelado" ? S.danger : S.muted;

        if (theme !== 'classic') {
          // Group pedidos by urgency for modern/tablet view
          const grupos = [
            { id: "listo", label: "✅ LISTOS PARA COBRAR", color: S.success, items: pedidos.filter(p => p.estado === "listo" && !p.cobrado) },
            { id: "activos", label: "🔥 EN COCINA", color: S.warning, items: pedidos.filter(p => ["pendiente", "en_preparacion"].includes(p.estado)) },
            { id: "entregado", label: "📦 ENTREGADOS — POR COBRAR", color: S.info, items: pedidos.filter(p => p.estado === "entregado" && !p.cobrado) },
            { id: "cobrados", label: "💰 COBRADOS", color: S.muted, items: pedidos.filter(p => p.cobrado) },
            { id: "cancelados", label: "❌ CANCELADOS", color: S.danger + "80", items: pedidos.filter(p => p.estado === "cancelado") },
          ].filter(g => g.items.length > 0);

          return (
            <div style={{ flex: 1, overflow: "auto", padding: "0" }}>
              {pedidos.length === 0 ? (
                <div style={{ textAlign: "center", padding: "80px 0", color: S.muted }}>
                  <div style={{ fontSize: 56 }}>📋</div>
                  <div style={{ fontSize: 18, fontWeight: 700, marginTop: 16 }}>Sin pedidos todavía</div>
                  <div style={{ fontSize: 13, marginTop: 8, opacity: 0.6 }}>Los pedidos aparecerán aquí</div>
                </div>
              ) : grupos.map(grupo => (
                <div key={grupo.id}>
                  {/* Group header */}
                  <div style={{ padding: "14px 20px 10px", fontSize: 11, fontWeight: 900, color: grupo.color, letterSpacing: "0.1em", borderBottom: `1px solid ${S.border}`, background: grupo.color + "08", display: "flex", alignItems: "center", gap: 10 }}>
                    {grupo.label}
                    <span style={{ background: grupo.color, color: grupo.color === S.muted ? S.bg : "#000", borderRadius: 20, padding: "1px 8px", fontSize: 11, fontWeight: 900 }}>{grupo.items.length}</span>
                  </div>
                  {/* Order rows */}
                  {grupo.items.map(p => {
                    const ec = estadoColor(p.estado);
                    return (
                      <div key={p.id} className="anim-in"
                        onClick={() => pedidosActualizados.has(p.id) && setPedidosActualizados(prev => { const n = new Set(prev); n.delete(p.id); return n; })}
                        style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: `1px solid ${S.border}`, background: pedidosActualizados.has(p.id) ? S.info + "08" : "transparent", gap: 14 }}>
                        {/* Status band */}
                        <div style={{ width: 5, alignSelf: "stretch", borderRadius: 3, background: ec, flexShrink: 0 }} />
                        {/* Order number */}
                        <div style={{ minWidth: 52, textAlign: "center", flexShrink: 0 }}>
                          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: theme === 'tablet' ? 24 : 22, fontWeight: 900, color: S.text, lineHeight: 1 }}>{pedidoPrefix(p)}{String(p.numero).padStart(3, "0")}</div>
                          <div style={{ fontSize: theme === 'tablet' ? 12 : 10, color: S.muted, fontWeight: 600, marginTop: 2 }}>
                            {p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? "Barra" : "Llevar"}
                          </div>
                        </div>
                        {/* Items + client */}
                        <div style={{ flex: 1, minWidth: 0 }}>
                          {p.nombre_cliente && <div style={{ fontSize: 12, fontWeight: 700, color: S.info, marginBottom: 4 }}>📢 {p.nombre_cliente}</div>}
                          <div style={{ fontSize: theme === 'tablet' ? 14 : 13, color: theme === 'tablet' ? "#E2E6F0" : S.text, lineHeight: 1.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                            {p.items.map((it, idx) => (
                              <span key={idx}><span style={{ fontWeight: 800 }}>{it.cantidad}×</span> {itemNombre(it)}{idx < p.items.length - 1 ? " · " : ""}</span>
                            ))}
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
                            <span style={{ fontSize: 10, fontWeight: 800, padding: "3px 9px", borderRadius: 7, background: ec + "25", color: ec, letterSpacing: "0.04em" }}>{estadoLabel[p.estado] || p.estado}</span>
                            {p.cobrado && <span style={{ fontSize: 10, color: S.muted, fontWeight: 600 }}>✅ {p.metodo_pago === "efectivo" ? "Efectivo" : p.metodo_pago === "transferencia" ? "Transfer" : "Fiado"}</span>}
                            {pedidosActualizados.has(p.id) && <span className="pulse-blue" style={{ fontSize: 10, fontWeight: 800, color: S.info }}>● modificado</span>}
                          </div>
                        </div>
                        {/* Total */}
                        <div style={{ textAlign: "right", flexShrink: 0 }}>
                          <div style={{ fontSize: 20, fontWeight: 900, color: p.estado === "cancelado" ? S.danger : S.text, textDecoration: p.estado === "cancelado" ? "line-through" : "none", letterSpacing: "-0.02em" }}>${p.total.toLocaleString()}</div>
                        </div>
                        {/* Actions */}
                        <div style={{ display: "flex", flexDirection: "column", gap: 6, flexShrink: 0, minWidth: 130 }}>
                          {p.estado === "listo" && (
                            <button onClick={() => marcarEntregado(p.id)} style={{ padding: "9px 14px", borderRadius: 10, border: "none", background: S.success, color: "#000", fontSize: 12, fontWeight: 800, cursor: "pointer" }}>✅ Entregado</button>
                          )}
                          {!p.cobrado && ["listo", "entregado"].includes(p.estado) && (
                            <button onClick={() => setCobrandoPedido(p)} style={{ padding: "9px 14px", borderRadius: 10, border: "none", background: S.accent, color: "#fff", fontSize: 13, fontWeight: 900, cursor: "pointer", boxShadow: `0 2px 10px ${S.accent}40` }}>💰 Cobrar</button>
                          )}
                          <div style={{ display: "flex", gap: 6 }}>
                            {!p.cobrado && p.estado !== "cancelado" && (
                              <button onClick={() => setPinModal({ action: "cancelar", pedidoId: p.id, pin: "" })} style={{ flex: 1, padding: "7px 0", borderRadius: 9, border: "none", background: S.danger + "18", color: S.danger, fontSize: 11, fontWeight: 800, cursor: "pointer" }}>✕</button>
                            )}
                            {!p.cobrado && ["pendiente", "en_preparacion", "listo"].includes(p.estado) && (
                              <button onClick={() => setEditarPedido({ id: p.id, numero: p.numero, items: p.items.map(i => ({ ...i })) })} style={{ flex: 1, padding: "7px 0", borderRadius: 9, border: `1px solid ${S.border}`, background: S.surfaceHover, color: S.text, fontSize: 11, fontWeight: 800, cursor: "pointer" }}>✏️</button>
                            )}
                            {p.cobrado && p.estado !== "cancelado" && (
                              <button onClick={() => setTicketVisible(p)} style={{ flex: 1, padding: "7px 0", borderRadius: 9, border: `1px solid ${S.border}`, background: S.surfaceHover, color: S.muted, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>🧾 Ver ticket</button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          );
        }

        // CLASSIC layout
        return (
          <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 16 }}>
              PEDIDOS DE HOY ({pedidos.length})
            </div>
            {pedidos.length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 0", color: S.muted }}>
                <div style={{ fontSize: 48 }}>📋</div>
                <div style={{ fontSize: 16, fontWeight: 700, marginTop: 12 }}>Sin pedidos todavía</div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 14 }}>
                {pedidos.map(p => {
                  const ec = estadoColor(p.estado);
                  return (
                    <div key={p.id} className="anim-in"
                      onClick={() => pedidosActualizados.has(p.id) && setPedidosActualizados(prev => { const n = new Set(prev); n.delete(p.id); return n; })}
                      style={{ padding: 16, borderRadius: 14, background: S.surface, border: `2px solid ${pedidosActualizados.has(p.id) ? S.info : S.border}`, transition: "border-color 0.3s", cursor: "default" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                          <span style={{ fontWeight: 900, fontSize: 16 }}>{pedidoPrefix(p)}{String(p.numero).padStart(3, "0")}</span>
                          {p.nombre_cliente && <span style={{ fontSize: 13, fontWeight: 700, color: S.info }}>📢 {p.nombre_cliente}</span>}
                          {p.solo_despacho && <span style={{ fontSize: 10, fontWeight: 900, padding: "2px 8px", borderRadius: 6, background: S.success + "25", color: S.success }}>Directa</span>}
                          {pedidosActualizados.has(p.id) && <span className="pulse-blue" style={{ fontSize: 10, fontWeight: 900, padding: "2px 8px", borderRadius: 6, background: S.info, color: "#fff" }}>● actualizado</span>}
                        </div>
                        <span style={{ fontSize: 10, fontWeight: 800, padding: "4px 10px", borderRadius: 8, color: "#fff", background: ec }}>{p.estado.replace("_", " ").toUpperCase()}</span>
                      </div>
                      <div style={{ fontSize: 11, color: S.muted, marginBottom: 6 }}>
                        {p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? "Barra" : "Llevar"}
                        {p.nombre_cliente && ` · 📢 ${p.nombre_cliente}`}
                        {p.cobrado && ` · ✅ Cobrado (${p.metodo_pago === "efectivo" ? "💵" : p.metodo_pago === "transferencia" ? "📱" : "📋"})`}
                      </div>
                      <div style={{ padding: "8px 10px", borderRadius: 8, background: S.bg, marginBottom: 8, fontSize: 12, color: S.text, lineHeight: 1.6 }}>
                        {p.items.map((it, idx) => (
                          <span key={idx}>
                            <span style={{ fontWeight: 800, color: getCat(it.cat_id)?.color || S.text }}>{it.cantidad}x</span>{" "}
                            <span style={{ fontWeight: 600 }}>{itemNombre(it)}</span>
                            {it.observaciones && <span style={{ color: S.danger, fontSize: 10, fontWeight: 700 }}> ({it.observaciones})</span>}
                            {idx < p.items.length - 1 && <span style={{ color: S.border }}> · </span>}
                          </span>
                        ))}
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontSize: 18, fontWeight: 900, color: p.estado === "cancelado" ? S.danger : S.accent, textDecoration: p.estado === "cancelado" ? "line-through" : "none" }}>${p.total.toLocaleString()}</span>
                        <div style={{ display: "flex", gap: 6 }}>
                          {!p.cobrado && p.estado !== "cancelado" && (
                            <button onClick={() => setPinModal({ action: "cancelar", pedidoId: p.id, pin: "" })} style={{ padding: "6px 10px", borderRadius: 8, border: "none", background: S.danger + "18", color: S.danger, fontSize: 10, fontWeight: 800, cursor: "pointer" }}>❌</button>
                          )}
                          {!p.cobrado && ["pendiente", "en_preparacion", "listo"].includes(p.estado) && (
                            <button onClick={() => setEditarPedido({ id: p.id, numero: p.numero, items: p.items.map(i => ({ ...i })) })} style={{ padding: "6px 10px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontSize: 10, fontWeight: 800, cursor: "pointer" }}>✏️</button>
                          )}
                          {p.estado === "listo" && (
                            <button onClick={() => marcarEntregado(p.id)} style={{ padding: "6px 14px", borderRadius: 8, border: "none", background: S.success, color: "#000", fontSize: 11, fontWeight: 800, cursor: "pointer" }}>✅ Entregado</button>
                          )}
                          {!p.cobrado && ["listo", "entregado"].includes(p.estado) && (
                            <button onClick={() => setCobrandoPedido(p)} style={{ padding: "6px 14px", borderRadius: 8, border: "none", background: S.accent, color: "#fff", fontSize: 11, fontWeight: 800, cursor: "pointer" }}>💰 Cobrar</button>
                          )}
                          {p.cobrado && p.estado !== "cancelado" && (
                            <button onClick={() => setTicketVisible(p)} style={{ padding: "6px 10px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.muted, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>🧾 Ver ticket</button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: CLIENTES */}
      {/* ========================================= */}
      {tab === "clientes" && (
        <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em" }}>
              CLIENTES ({clientes.length})
            </div>
            <button onClick={() => setClienteForm({ mode: "nuevo", nombre: "", apellido: "", apodo: "", division: "", whatsapp: "" })} style={{
              padding: "10px 20px", borderRadius: 10, border: "none", background: S.accent, color: "#fff",
              fontSize: 13, fontWeight: 800, cursor: "pointer",
            }}>+ Nuevo Cliente</button>
          </div>

          {/* ---- PANEL DEUDAS FIADO ---- */}
          {(() => {
            const deudores = clientes.filter(c => c.saldo > 0).sort((a, b) => b.saldo - a.saldo);
            const totalDeuda = deudores.reduce((s, c) => s + c.saldo, 0);
            if (deudores.length === 0) return null;
            return (
              <div className="anim-in" style={{ marginBottom: 20, borderRadius: 16, background: S.surface, border: `2px solid ${S.warning}40`, overflow: "hidden" }}>
                <div style={{ padding: "14px 18px", display: "flex", alignItems: "center", justifyContent: "space-between", borderBottom: `1px solid ${S.border}` }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 20 }}>📋</span>
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 800, color: S.warning }}>FIADO PENDIENTE</div>
                      <div style={{ fontSize: 11, color: S.muted }}>{deudores.length} cliente{deudores.length !== 1 ? "s" : ""} con deuda</div>
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 10, fontWeight: 800, color: S.muted }}>TOTAL ADEUDADO</div>
                    <div style={{ fontSize: 26, fontWeight: 900, color: S.warning }}>${totalDeuda.toLocaleString()}</div>
                  </div>
                </div>
                <div style={{ padding: "10px 18px", display: "flex", flexDirection: "column", gap: 6 }}>
                  {deudores.slice(0, 5).map((c, i) => (
                    <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ fontSize: 12, fontWeight: 900, color: S.muted, width: 18, textAlign: "right" }}>#{i + 1}</div>
                      <div style={{ flex: 1, fontSize: 13, fontWeight: 700, color: S.text }}>
                        {c.nombre} {c.apellido}
                        {c.division && <span style={{ fontSize: 11, color: S.muted, marginLeft: 6 }}>{c.division}</span>}
                      </div>
                      <div style={{ fontWeight: 900, fontSize: 14, color: S.warning }}>${c.saldo.toLocaleString()}</div>

                  }
                  setCategoriaForm(null);
                }} disabled={!categoriaForm.nombre.trim()} style={{
                  padding: "8px 20px", borderRadius: 8, border: "none",
                  background: categoriaForm.nombre.trim() ? S.success : S.border,
                  color: categoriaForm.nombre.trim() ? "#000" : S.muted,
                  fontSize: 12, fontWeight: 800, cursor: categoriaForm.nombre.trim() ? "pointer" : "not-allowed",

                <button onClick={() => setCategoriaForm(null)} style={{ padding: "8px 20px", borderRadius: 8, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
              </div>
            </div>
            );
          })()}

          {/* Product form */}
          {productoForm && (
            <div style={{ marginBottom: 16, padding: 16, borderRadius: 14, background: S.surface, border: `2px solid ${S.accent}` }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: S.accent, marginBottom: 10 }}>
                {productoForm.mode === "nuevo" ? "➕ NUEVO PRODUCTO" : "✏️ EDITAR PRODUCTO"}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
                <div style={{ gridColumn: "span 2" }}>
                  <div style={{ fontSize: 9, fontWeight: 700, color: S.muted, marginBottom: 3 }}>Nombre</div>
                  <input type="text" autoFocus value={productoForm.nombre}
                    onChange={e => setProductoForm(prev => prev ? ({...prev, nombre: e.target.value}) : null)}
                    onKeyDown={e => { if (e.key === 'Escape') setProductoForm(null); }}
                    placeholder="Nombre del producto"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `2px solid ${productoForm.nombre ? S.accent : S.border}`, background: S.bg, color: S.text, fontSize: 13, outline: "none", fontFamily: "'DM Sans', sans-serif" }} />
                </div>
                <div>
                  <div style={{ fontSize: 9, fontWeight: 700, color: S.muted, marginBottom: 3 }}>Precio</div>
                  <input type="number" min="0" value={productoForm.precio}
                    onChange={e => setProductoForm(prev => prev ? ({...prev, precio: e.target.value}) : null)}
                    onKeyDown={e => { if (e.key === 'Escape') setProductoForm(null); }}
                    placeholder="0"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `2px solid ${productoForm.precio ? S.accent : S.border}`, background: S.bg, color: S.text, fontSize: 13, outline: "none", fontFamily: "'DM Sans', sans-serif" }} />
                </div>
                <div>
                  <div style={{ fontSize: 9, fontWeight: 700, color: S.muted, marginBottom: 3 }}>Stock inicial</div>
                  <input type="number" min="0" value={productoForm.stock}
                    onChange={e => setProductoForm(prev => prev ? ({...prev, stock: e.target.value}) : null)}
                    onKeyDown={e => { if (e.key === 'Escape') setProductoForm(null); }}
                    placeholder="0"
                    style={{ width: "100%", padding: "8px 10px", borderRadius: 8, border: `2px solid ${S.border}`, background: S.bg, color: S.text, fontSize: 13, outline: "none", fontFamily: "'DM Sans', sans-serif" }} />
                </div>
                <div>
                  <div style={{ fontSize: 9, fontWeight: 700, color: S.muted, marginBottom: 3 }}>Categoría</div>
                  <div style={{ display: "flex", gap: 3, flexWrap: "wrap" }}>
                    {categorias.map(c => (
                      <button key={c.id} onClick={() => setProductoForm(prev => ({ ...prev, cat_id: c.id }))} style={{
                        padding: "6px 10px", borderRadius: 6, border: `2px solid ${productoForm.cat_id === c.id ? c.color : S.border}`,
                        background: productoForm.cat_id === c.id ? c.color : "transparent", color: productoForm.cat_id === c.id ? "#fff" : S.text,
                        fontSize: 10, fontWeight: 700, cursor: "pointer",
                      }}>{c.emoji}</button>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={{ fontSize: 9, fontWeight: 700, color: S.muted, marginBottom: 3 }}>Va a cocina</div>
                  <div style={{ display: "flex", gap: 4 }}>
                    <button onClick={() => setProductoForm(prev => ({ ...prev, cocina: true }))} style={{
                      flex: 1, padding: "6px 0", borderRadius: 6, border: `2px solid ${productoForm.cocina ? S.warning : S.border}`,
                      background: productoForm.cocina ? S.warning : "transparent", color: productoForm.cocina ? "#000" : S.text,
                      fontSize: 10, fontWeight: 800, cursor: "pointer",
                    }}>🔥 Sí</button>
                    <button onClick={() => setProductoForm(prev => ({ ...prev, cocina: false }))} style={{
                      flex: 1, padding: "6px 0", borderRadius: 6, border: `2px solid ${!productoForm.cocina ? S.success : S.border}`,
                      background: !productoForm.cocina ? S.success : "transparent", color: !productoForm.cocina ? "#000" : S.text,
                      fontSize: 10, fontWeight: 800, cursor: "pointer",
                    }}>No</button>
                  </div>
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button onClick={async () => {
                  if (!productoForm.nombre.trim() || !productoForm.precio) return;
                  if (productoForm.mode === "nuevo") {
                    const result = await apiFetch('/productos', { method: 'POST', body: { nombre: productoForm.nombre, precio: Number(productoForm.precio), stock: Number(productoForm.stock) || 0, cat_id: productoForm.cat_id, cocina: productoForm.cocina } });
                    if (result) { setProductos(prev => [...prev, result]); showMsg("✅ Producto creado"); }
                  } else if (productoForm.mode === "editar") {
                    const result = await apiFetch(`/productos/${productoForm.id}`, { method: 'PUT', body: { nombre: productoForm.nombre, precio: Number(productoForm.precio), stock: Number(productoForm.stock) || 0, cat_id: productoForm.cat_id, cocina: productoForm.cocina } });
                    if (result) { setProductos(prev => prev.map(p => p.id === productoForm.id ? result : p)); showMsg("✅ Producto actualizado"); }
                  }
                  setProductoForm(null);
                }} disabled={!productoForm.nombre.trim() || !productoForm.precio} style={{
                  padding: "8px 20px", borderRadius: 8, border: "none",
                  background: productoForm.nombre.trim() && productoForm.precio ? S.success : S.border,
                  color: productoForm.nombre.trim() && productoForm.precio ? "#000" : S.muted,

                <button onClick={() => setProductoForm(null)} style={{ padding: "8px 20px", borderRadius: 8, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
              </div>
            </div>
          )}

          {/* Category filter buttons */}
          <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
            <button onClick={() => setProdCatFilter(null)} style={{
              padding: "10px 18px", borderRadius: 10, border: `2px solid ${!prodCatFilter ? S.accent : S.border}`,
              background: !prodCatFilter ? S.accent : "transparent", color: !prodCatFilter ? "#fff" : S.text,
              fontSize: 13, fontWeight: 800, cursor: "pointer",
            }}>📦 Todos</button>
            {categorias.map(cat => (
              <button key={cat.id} onClick={() => setProdCatFilter(cat.id)} style={{
                padding: "10px 18px", borderRadius: 10, border: `2px solid ${prodCatFilter === cat.id ? cat.color : S.border}`,
                background: prodCatFilter === cat.id ? cat.color : "transparent",
                color: prodCatFilter === cat.id ? "#fff" : S.text,
                fontSize: 13, fontWeight: 800, cursor: "pointer",
