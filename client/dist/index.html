const API = window.location.origin + '/api';

const apiFetch = async (path, opts = {}) => {
  try {
    const res = await fetch(API + path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (!res.ok) throw new Error(res.statusText);
    return await res.json();
  } catch (e) {
    console.error('API Error:', path, e);
    return null;
  }
};

// ========================================
// TOUCH KEYBOARD MODAL
// ========================================
const KB_ROWS_UPPER = [["1","2","3","4","5","6","7","8","9","0"],["Q","W","E","R","T","Y","U","I","O","P"],["A","S","D","F","G","H","J","K","L","Ñ"],["⇧","Z","X","C","V","B","N","M","⌫"]];
const KB_ROWS_LOWER = [["1","2","3","4","5","6","7","8","9","0"],["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l","ñ"],["⇧","z","x","c","v","b","n","m","⌫"]];

function TouchKeyboard({ title, value, onChange, onDone, onCancel, S }) {
  const inputRef = React.useRef(null);
  const [caps, setCaps] = React.useState(true);
  const rows = caps ? KB_ROWS_UPPER : KB_ROWS_LOWER;
  const handleKey = (k) => {
    if (k === "⌫") onChange(value.slice(0, -1));
    else if (k === "⇧") setCaps(c => !c);
    else if (k === " ") onChange(value + " ");
    else onChange(value.length < 50 ? value + k : value);
  };
  React.useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", flexDirection: "column", justifyContent: "flex-end", background: "rgba(0,0,0,0.7)" }} onClick={onCancel}>
      <div style={{ background: S.surface, borderRadius: "20px 20px 0 0", padding: "14px 10px 10px" }} onClick={e => e.stopPropagation()}>
        <input ref={inputRef} type="text" value={value} onChange={e => onChange(e.target.value.slice(0, 50))}
          onKeyDown={e => { if (e.key === "Enter" && value.trim()) onDone(value); if (e.key === "Escape") onCancel(); if (e.key === "Tab") { e.preventDefault(); onDone(value); } }}
          style={{ position: "absolute", opacity: 0, pointerEvents: "none", height: 0 }} autoFocus />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, padding: "0 6px" }}>
          <span style={{ fontSize: 12, fontWeight: 800, color: S.muted }}>{title}</span>
          <div style={{ flex: 1, textAlign: "center", fontSize: 18, fontWeight: 800, color: S.text, minHeight: 28 }}>{value || <span style={{ color: S.muted }}>...</span>}</div>
          <button onClick={onCancel} style={{ padding: "5px 10px", borderRadius: 6, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>✕</button>
        </div>
        {rows.map((row, ri) => (
          <div key={ri} style={{ display: "flex", justifyContent: "center", gap: 4, marginBottom: 4 }}>
            {row.map(k => {
              const isSp = k === "⌫" || k === "⇧";
              return (
                <button key={k + ri} onClick={() => handleKey(k)} style={{
                  flex: isSp ? 1.3 : 1, maxWidth: isSp ? 56 : 38, height: 42, borderRadius: 8, border: "none", cursor: "pointer",
                  background: k === "⇧" ? (caps ? S.accent : S.border) : k === "⌫" ? S.border : S.bg,
                  color: k === "⇧" ? (caps ? "#fff" : S.text) : S.text,
                  fontSize: ri === 0 ? 14 : (isSp ? 14 : 16), fontWeight: 700,
                }}>{k}</button>
              );
            })}
          </div>
        ))}
        <div style={{ display: "flex", gap: 4 }}>
          <button onClick={() => { if (value.trim()) onDone(value); }} style={{ flex: 1, height: 40, borderRadius: 8, border: "none", background: value.trim() ? S.success : S.border, color: value.trim() ? "#000" : S.muted, fontSize: 13, fontWeight: 800, cursor: "pointer" }}>✓ Listo</button>
          <button onClick={() => handleKey(" ")} style={{ flex: 2, height: 40, borderRadius: 8, border: "none", background: S.bg, color: S.muted, fontSize: 11, fontWeight: 600, cursor: "pointer" }}>espacio</button>
        </div>
      </div>
    </div>
  );
}

// ========================================
// TOUCH NUMPAD MODAL
// ========================================
function TouchNumpad({ title, value, onChange, onDone, onCancel, prefix, maxLen, S }) {
  const handleKey = (k) => {
    if (k === "C") onChange("");
    else if (k === "⌫") onChange(value.slice(0, -1));
    else if (k === "✓") onDone(value);
    else if ((!maxLen || value.length < maxLen)) onChange(value + k);
  };
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", flexDirection: "column", justifyContent: "flex-end", background: "rgba(0,0,0,0.65)", backdropFilter: "blur(4px)" }} onClick={onCancel}>
      <div style={{ background: S.surface, borderRadius: "24px 24px 0 0", padding: "24px 20px 28px", boxShadow: "0 -8px 40px rgba(0,0,0,0.5)", border: `1px solid ${S.border}` }} onClick={e => e.stopPropagation()}>
        {/* Handle bar */}
        <div style={{ width: 40, height: 4, borderRadius: 2, background: S.border, margin: "0 auto 20px" }} />
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 11, fontWeight: 900, color: S.muted, letterSpacing: "0.1em", marginBottom: 8 }}>{title}</div>
          <div style={{ fontSize: 42, fontWeight: 900, color: S.text, letterSpacing: "-0.02em", minHeight: 50, lineHeight: 1 }}>
            {prefix || ""}{value || <span style={{ color: S.border }}>0</span>}
          </div>
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 10, maxWidth: 380, margin: "0 auto" }}>
          {["1","2","3","4","5","6","7","8","9","C","0","✓"].map(k => (
            <button key={k} onClick={() => handleKey(k)} style={{
              height: 68, borderRadius: 16,
              border: k === "✓" ? "none" : `1px solid ${S.border}`,
              background: k === "✓" ? S.success : k === "C" ? S.danger + "18" : S.surfaceHover,
              color: k === "✓" ? "#000" : k === "C" ? S.danger : S.text,
              fontSize: k === "C" ? 15 : k === "✓" ? 24 : 26,
              fontWeight: 800, cursor: "pointer",
              boxShadow: k === "✓" ? `0 4px 16px ${S.success}40` : "none",
            }}>{k}</button>
          ))}
        </div>
        <button onClick={onCancel} style={{ marginTop: 14, width: "100%", maxWidth: 380, display: "block", margin: "14px auto 0", padding: "14px 0", borderRadius: 14, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
      </div>
    </div>
  );
}

// ========================================
// MAIN APP

window.__App = function CantinaFull() {
  const [theme, setTheme] = useState(() => localStorage.getItem('posTheme') || 'modern');
  const toggleTheme = () => {
    const next = theme === 'modern' ? 'classic' : 'modern';
    setTheme(next);
    localStorage.setItem('posTheme', next);
  };

  const [loggedIn, setLoggedIn] = useState(false);
  const [loginPin, setLoginPin] = useState("");
  const [loginError, setLoginError] = useState(false);
  const [loginUser, setLoginUser] = useState(null);
  const [usuarios, setUsuarios] = useState([
    { id: 1, nombre: "Admin", rol: "admin", pin: "0000" },
    { id: 2, nombre: "Cajero", rol: "cajero", pin: "1234" },
    { id: 3, nombre: "Cocina", rol: "cocina", pin: "5678" },
  ]);
  const [nextUserId, setNextUserId] = useState(4);

  const USERS_PIN = {};
  usuarios.forEach(u => { USERS_PIN[u.pin] = { nombre: u.nombre, rol: u.rol }; });

  const handleLoginKey = async (k) => {
    if (k === "clear") { setLoginPin(""); setLoginError(false); return; }
    if (k === "back") { setLoginPin(p => p.slice(0, -1)); setLoginError(false); return; }
    if (loginPin.length >= 4) return;
    const newPin = loginPin + k;
    setLoginPin(newPin);
    setLoginError(false);
    if (newPin.length === 4) {
      const loginResult = await apiFetch('/login', { method: 'POST', body: { pin: newPin } });
      if (loginResult && !loginResult.error) {
        setLoginUser({ nombre: loginResult.nombre, rol: loginResult.rol });
        setTimeout(() => setLoggedIn(true), 400);
      } else if (USERS_PIN[newPin]) {
        // Fallback to local
        setLoginUser(USERS_PIN[newPin]);
        setTimeout(() => setLoggedIn(true), 400);
      } else {
        setLoginError(true);
        setTimeout(() => { setLoginPin(""); setLoginError(false); }, 1200);
      }
    }
  };

  const S_login = THEMES[theme];

  // ===== MAIN APP (after login) =====
  const [tab, setTab] = useState("venta");
  const [categorias, setCategorias] = useState(CATEGORIAS_FALLBACK);
  const [productos, setProductos] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [nextNum, setNextNum] = useState(1);
  const [cajaMovimientos, setCajaMovimientos] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [nextClienteId, setNextClienteId] = useState(1);
  const [clientePagos, setClientePagos] = useState([]);
  const [clienteForm, setClienteForm] = useState(null);
  const [pagoForm, setPagoForm] = useState(null);
  const [clienteExpandido, setClienteExpandido] = useState(null);
  const [pinModal, setPinModal] = useState(null);
  const [prodCatFilter, setProdCatFilter] = useState(null);
  const [catActiva, setCatActiva] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [carrito, setCarrito] = useState([]);
  const [tipoPedido, setTipoPedido] = useState("mesa");
  const [mesaNum, setMesaNum] = useState("");
  const [nombreBarra, setNombreBarra] = useState("");
  const [nombreLlevar, setNombreLlevar] = useState("");
  const [msgExito, setMsgExito] = useState("");
  const [cobrandoPedido, setCobrandoPedido] = useState(null);
  const [cierreCaja, setCierreCaja] = useState(null);
  const [cierresHistorial, setCierresHistorial] = useState([]);
  const [reporteCierre, setReporteCierre] = useState(null);
  const [tick, setTick] = useState(0);
  const [mesaFlash, setMesaFlash] = useState(false);
  const [cancelarPedido, setCancelarPedido] = useState(null);
  const [agregarItemPedido, setAgregarItemPedido] = useState(null);
  const [editarPedido, setEditarPedido] = useState(null); // { id, numero, items: [...] }
  const [pedidosActualizados, setPedidosActualizados] = useState(new Set());
  const prevPedidosRef = useRef([]);
  const [descuento, setDescuento] = useState({ tipo: "none", valor: "" });
  const [mesaNotas, setMesaNotas] = useState({});
  const [mesaSeleccionada, setMesaSeleccionada] = useState(null);
  const [arqueoEfectivo, setArqueoEfectivo] = useState("");
  const [ticketVisible, setTicketVisible] = useState(null);
  const [touchKb, setTouchKb] = useState(null);
  const [touchNum, setTouchNum] = useState(null);
  const [userForm, setUserForm] = useState(null);
  const [productoForm, setProductoForm] = useState(null); // { mode, id?, nombre, precio, stock, cat_id, cocina }
  const [categoriaForm, setCategoriaForm] = useState(null); // { mode, id?, nombre, emoji, color, despacho_directo }
  const [pedidosAutoservicio, setPedidosAutoservicio] = useState([]);
  const [autoNotifExpanded, setAutoNotifExpanded] = useState(null);
  const [carouselImages, setCarouselImages] = useState([]);
  const [usbImages, setUsbImages] = useState([]); // { id, file, name, size }
  const [carouselUploading, setCarouselUploading] = useState(false);
  const fileInputRef = useRef(null);
  const [dataLoaded, setDataLoaded] = useState(false);
  const [sysData, setSysData] = useState(null);
  const [conectado, setConectado] = useState(true);
  const [sysHistory, setSysHistory] = useState([]);
  const [backupModal, setBackupModal] = useState(null); // null | { status, message }
  const [masSheet, setMasSheet] = useState(false); // Modern POS v2 "Más" drawer
  const mesaInputRef = useRef(null);

  // Load data from API on login
  useEffect(() => {
    if (!loggedIn) return;
    const loadData = async () => {
      const [prods, peds, clients, users, cierres, carousel] = await Promise.all([
        apiFetch('/productos'),
        apiFetch('/pedidos'),
        apiFetch('/clientes'),
        apiFetch('/usuarios'),
        apiFetch('/cierres'),
        apiFetch('/carousel'),
      ]);
      if (prods && prods.length > 0) {
        setProductos(prods);
        // Extract unique categories from productos
        const catsMap = {};
        prods.forEach(p => { if (p.categoria) catsMap[p.categoria.id] = p.categoria; });
        const cats = Object.values(catsMap).sort((a, b) => (a.orden || 0) - (b.orden || 0));
        if (cats.length > 0) setCategorias(cats);
      }
      if (peds) { setPedidos(peds); const maxNum = Math.max(0, ...peds.map(p => p.numero)); setNextNum(maxNum + 1); }
      if (clients) { setClientes(clients); setNextClienteId(Math.max(0, ...clients.map(c => c.id)) + 1); }
      if (users) setUsuarios(users);
      if (cierres) setCierresHistorial(cierres);
      if (carousel) setCarouselImages(carousel);
      setDataLoaded(true);
    };
    loadData();
  }, [loggedIn]);

  useEffect(() => {
    const iv = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(iv);
  }, []);

  // Poll data every 5s to sync with cocina and other terminals
  useEffect(() => {
    if (!loggedIn || !dataLoaded) return;
    const poll = setInterval(async () => {
      const [peds, clients, prods] = await Promise.all([
        apiFetch('/pedidos'),
        apiFetch('/clientes'),
        apiFetch('/productos'),
      ]);
      if (peds && Array.isArray(peds)) {
        const prev = prevPedidosRef.current;
        if (prev.length > 0) {
          const changed = new Set();
          peds.forEach(newP => {
            const oldP = prev.find(p => p.id === newP.id);
            if (oldP && (
              oldP.estado !== newP.estado ||
              oldP.total !== newP.total ||
              (oldP.items?.length ?? 0) !== (newP.items?.length ?? 0)
            )) changed.add(newP.id);
          });
          if (changed.size > 0) {
            setPedidosActualizados(prev => new Set([...prev, ...changed]));
            setTimeout(() => setPedidosActualizados(prev => {
              const next = new Set(prev); changed.forEach(id => next.delete(id)); return next;
            }), 10000);
          }
        }
        prevPedidosRef.current = peds;
        setPedidos(peds);
      }
      if (clients && Array.isArray(clients) && clients.length > 0) setClientes(clients);
      if (prods && Array.isArray(prods) && prods.length > 0) setProductos(prods);
    }, 5000);
    return () => clearInterval(poll);
  }, [loggedIn, dataLoaded]);

  // Poll system data every 5s for dashboard + history for charts
  useEffect(() => {
    if (!loggedIn || !dataLoaded) return;
    const fetchSys = async () => {
      const data = await apiFetch('/system');
      setConectado(!!data);
      if (data) {
        setSysData(data);
        setSysHistory(prev => {
          const entry = { t: Date.now(), cpu: data.cpu, ram: data.ram?.total > 0 ? Math.round(data.ram.used / data.ram.total * 100) : 0, disk: data.disk?.pct || 0 };
          const hist = [...prev, entry];
          return hist.slice(-240); // Keep ~20min at 5s intervals
        });
      }
    };
    fetchSys();
    const iv = setInterval(fetchSys, 5000);
    return () => clearInterval(iv);
  }, [loggedIn, dataLoaded]);

  // === SOUNDS (must be before conditional return) ===
  const playCajaSendSound = useCallback(() => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const play = (f, t, d) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.15, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + t + d); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + d); };
      play(1100, 0, 0.12);
      play(880, 0.14, 0.45);
      setTimeout(() => ctx.close(), 700);
    } catch(e) {}
  }, []);

  const playCajaCobroSound = useCallback(() => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const play = (f, t) => { const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.12, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + t + 0.15); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.15); };
      play(880, 0); play(1100, 0.12);
      setTimeout(() => ctx.close(), 400);
    } catch(e) {}
  }, []);

  const playCajaListoSound = useCallback(() => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 1318; osc.type = "sine";
      gain.gain.setValueAtTime(0.12, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
      setTimeout(() => ctx.close(), 500);
    } catch(e) {}
  }, []);

  const agregarItem = useCallback((prod) => {
    setCarrito(prev => {
      const ex = prev.find(i => i.producto_id === prod.id);
      if (ex) {
        if (ex.cantidad >= prod.stock) return prev;
        return prev.map(i => i.producto_id === prod.id ? { ...i, cantidad: i.cantidad + 1 } : i);
      }
      const cat = prod.categoria || { despacho_directo: false };
      const esDirecto = !prod.cocina && cat.despacho_directo;
      return [...prev, {

                width: "100%", padding: theme === 'modern' ? "16px 0" : "14px 0", borderRadius: 13, border: "none",
                background: carrito.length === 0 ? S.border : soloDirecto ? S.success : S.accent,
                color: carrito.length === 0 ? S.muted : soloDirecto ? "#000" : "#fff",
                fontSize: theme === 'modern' ? 16 : 15, fontWeight: 900, cursor: carrito.length > 0 ? "pointer" : "not-allowed",
                boxShadow: carrito.length > 0 && theme === 'modern' ? `0 4px 20px ${soloDirecto ? S.success : S.accent}50` : "none",
                letterSpacing: "0.02em",
              }}>
                {soloDirecto ? "⚡ DESPACHAR Y COBRAR" : "📤 ENVIAR A COCINA"}
              </button>
            </div>
          </div>
        );

        return (
          <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
            {/* LEFT: Catalog */}
            <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
              {/* Categories */}
              <div style={{ display: "flex", gap: theme === 'modern' ? 8 : 8, padding: theme === 'modern' ? "14px 18px" : "12px 16px", overflowX: "auto", flexShrink: 0, borderBottom: `1px solid ${S.border}`, background: theme === 'modern' ? S.surface : "transparent" }}>
                <button onClick={() => setCatActiva(null)} style={{
                  padding: theme === 'modern' ? "10px 18px" : "8px 16px", borderRadius: 12,
                  border: `2px solid ${!catActiva ? S.accent : S.border}`,
                  background: !catActiva ? S.accent : theme === 'modern' ? S.surfaceHover : "transparent",
                  color: !catActiva ? "#fff" : S.text, fontSize: theme === 'modern' ? 13 : 12, fontWeight: 800, cursor: "pointer", whiteSpace: "nowrap",
                  boxShadow: !catActiva && theme === 'modern' ? `0 2px 10px ${S.accent}40` : "none",
                }}>✦ Todos</button>
                {categorias.map(c => (
                  <button key={c.id} onClick={() => setCatActiva(c.id)} style={{
                    padding: theme === 'modern' ? "10px 18px" : "8px 16px", borderRadius: 12,
                    border: `2px solid ${catActiva === c.id ? c.color : S.border}`,
                    background: catActiva === c.id ? c.color : theme === 'modern' ? S.surfaceHover : "transparent",
                    color: catActiva === c.id ? "#fff" : S.text, fontSize: theme === 'modern' ? 13 : 12, fontWeight: 800, cursor: "pointer", whiteSpace: "nowrap",
                    boxShadow: catActiva === c.id && theme === 'modern' ? `0 2px 10px ${c.color}50` : "none",
                  }}>{c.emoji} {c.nombre}{c.despacho_directo ? " ⚡" : ""}</button>
                ))}
              </div>
              {/* Products grid */}
              <div style={{ flex: 1, overflow: "auto", padding: theme === 'modern' ? 18 : 16, display: "grid", gridTemplateColumns: `repeat(auto-fill, minmax(${theme === 'modern' ? 175 : 140}px, 1fr))`, gap: theme === 'modern' ? 14 : 12, alignContent: "start" }}>
                {productosFiltrados.map(p => renderProductoCard(p))}
              </div>
            </div>
            {cartPanel}
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: COCINA */}
      {/* ========================================= */}
      {tab === "cocina" && (() => {
        const pedidosCocina = pedidos.filter(p => ["pendiente", "en_preparacion", "listo"].includes(p.estado) && !p.solo_despacho)
          .sort((a, b) => {
            const order = { pendiente: 0, en_preparacion: 1, listo: 2 };
            const diff = (order[a.estado] ?? 3) - (order[b.estado] ?? 3);
            if (diff !== 0) return diff;
            return new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
          });
        return (
        <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em" }}>
              PEDIDOS EN COCINA ({pedidosCocina.length})
            </div>
            <div style={{ display: "flex", gap: 12 }}>
              {[
                { label: "Pendientes", count: pedidosCocina.filter(p => p.estado === "pendiente").length, color: S.danger },
                { label: "Preparando", count: pedidosCocina.filter(p => p.estado === "en_preparacion").length, color: S.warning },
                { label: "Listos", count: pedidosCocina.filter(p => p.estado === "listo").length, color: S.success },
              ].filter(x => x.count > 0).map(x => (
                <span key={x.label} style={{ fontSize: 12, fontWeight: 800, color: x.color }}>
                  {x.count} {x.label}
                </span>
              ))}
            </div>
          </div>

          {pedidosCocina.length === 0 ? (
            <div style={{ textAlign: "center", padding: "80px 0", color: S.muted }}>
              <div style={{ fontSize: 64 }}>👨‍🍳</div>
              <div style={{ fontSize: 18, fontWeight: 700, marginTop: 16 }}>Sin pedidos en cocina</div>
              <div style={{ fontSize: 13, marginTop: 6 }}>Los nuevos pedidos aparecerán acá</div>
            </div>
          ) : (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))", gap: 16 }}>
              {pedidosCocina.map(p => {
                const isPendiente = p.estado === "pendiente";
                const isPreparando = p.estado === "en_preparacion";
                const isListo = p.estado === "listo";
                const borderColor = isPendiente ? S.danger : isPreparando ? S.warning : S.success;
                const itemsCocina = p.items.filter(i => !i.despacho_directo);
                const itemsDirecto = p.items.filter(i => i.despacho_directo);
                const elapsed = Math.floor((Date.now() - new Date(p.createdAt).getTime()) / 1000);
                const mins = Math.floor(elapsed / 60);
                const secs = elapsed % 60;

                return (
                  <div key={p.id} className={isPendiente ? "pulse-border anim-in" : "anim-in"} style={{
                    borderRadius: 16, overflow: "hidden", background: S.surface,
                    border: `3px solid ${borderColor}`,
                  }}>
                    {/* Header */}
                    <div style={{ padding: "14px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", background: borderColor + "20", borderBottom: `2px solid ${borderColor}40` }}>
                      <div style={{ display: "flex", alignItems: "baseline", gap: 12 }}>
                        <span style={{ fontSize: 32, fontWeight: 900, fontFamily: "'JetBrains Mono', monospace" }}>#{String(p.numero).padStart(3, "0")}</span>
                        <span style={{ fontSize: 14, fontWeight: 800, color: borderColor }}>
                          {p.tipo === "mesa" ? `MESA ${p.mesa_numero}` : p.tipo === "barra" ? "BARRA" : "🛍️ LLEVAR"}
                        </span>
                        {p.nombre_cliente && (
                          <span style={{ fontSize: 14, fontWeight: 700, color: S.info }}>📢 {p.nombre_cliente}</span>
                        )}
                      </div>
                      <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 22, fontWeight: 900, color: mins >= 10 ? S.danger : mins >= 5 ? S.warning : S.success }}>
                        {mins}:{String(secs).padStart(2, "0")}
                      </span>
                    </div>

                    {/* Items */}
                    <div style={{ padding: "12px 20px" }}>
                      {itemsCocina.map((item, idx) => (
                        <div key={idx} style={{ padding: "8px 0", borderBottom: idx < itemsCocina.length - 1 ? `1px solid ${S.border}` : "none", display: "flex", alignItems: "flex-start", gap: 12 }}>
                          <div style={{ minWidth: 36, height: 36, borderRadius: 10, background: borderColor, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'JetBrains Mono', monospace", fontSize: 18, fontWeight: 900, color: "#000", flexShrink: 0 }}>
                            {item.cantidad}
                          </div>
                          <div>
                            <div style={{ fontSize: 16, fontWeight: 800 }}>{itemNombre(item)}</div>
                            {item.observaciones && (
                              <div style={{ fontSize: 13, fontWeight: 700, color: S.danger, marginTop: 2 }}>⚠️ {item.observaciones}</div>
                            )}
                          </div>
                        </div>
                      ))}
                      {itemsDirecto.length > 0 && (
                        <div style={{ marginTop: 8, padding: "6px 10px", borderRadius: 8, background: S.success + "10", border: `1px solid ${S.success}30`, fontSize: 12, fontWeight: 700, color: S.success }}>
                          🍺 +{itemsDirecto.reduce((s, i) => s + i.cantidad, 0)} bebida(s) en mostrador
                        </div>
                      )}
                    </div>

                    {/* Actions */}
                    <div style={{ padding: "10px 20px 16px" }}>
                      {isPendiente && (
                        <button onClick={async () => {
                          const result = await apiFetch(`/pedidos/${p.id}`, { method: 'PUT', body: { estado: 'en_preparacion' } });
                          if (result) setPedidos(prev => prev.map(x => x.id === p.id ? { ...x, estado: 'en_preparacion' } : x));
                        }} style={{
                          width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                          background: `linear-gradient(135deg, ${S.warning}, #FF9500)`, color: "#000",
                          fontSize: 16, fontWeight: 900, cursor: "pointer", letterSpacing: "0.02em",
                        }}>🔥 EMPEZAR A PREPARAR</button>
                      )}
                      {isPreparando && (
                        <button onClick={() => marcarListo(p.id)} style={{
                          width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                          background: `linear-gradient(135deg, ${S.success}, #2DD47A)`, color: "#000",
                          fontSize: 16, fontWeight: 900, cursor: "pointer", letterSpacing: "0.02em",
                        }}>✅ LISTO PARA ENTREGAR</button>
                      )}
                      {isListo && (
                        <div style={{ display: "flex", gap: 10 }}>
                          <div style={{ flex: 1, padding: "14px 0", borderRadius: 12, background: S.success + "20", color: S.success, fontSize: 15, fontWeight: 900, textAlign: "center" }}>
                            ✅ ESPERANDO RETIRO
                          </div>
                          <button onClick={() => marcarEntregado(p.id)} style={{
                            padding: "14px 20px", borderRadius: 12, border: "none",
                            background: S.info, color: "#fff",
                            fontSize: 14, fontWeight: 900, cursor: "pointer", whiteSpace: "nowrap",
                          }}>📦 ENTREGADO</button>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: MESAS */}
      {/* ========================================= */}
      {tab === "mesas" && (() => {
        const activas = Array.from({ length: MESAS_TOTAL }, (_, i) => i + 1).filter(n => mesaActiva(n)).length;
        const sel = mesaSeleccionada;
        const selPeds = sel ? pedidosMesa(sel) : [];
        const selActiva = selPeds.length > 0;
        const selTotal = selActiva ? selPeds.filter(p => !p.cobrado).reduce((s, p) => s + p.total, 0) : 0;

        return (
        <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
          {/* Left: mesa grid */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "12px 16px", overflow: "hidden" }}>
            <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.06em", marginBottom: 8 }}>
              MESAS — {activas} ocupadas de {MESAS_TOTAL}
            </div>
            <div style={{ flex: 1, display: "flex", flexWrap: "wrap", gap: 6, alignContent: "flex-start", overflow: "auto" }}>
              {Array.from({ length: MESAS_TOTAL }, (_, i) => i + 1).map(num => {
                const peds = pedidosMesa(num);
                const activa = peds.length > 0;
                const pagoPend = peds.some(p => p.estado === "entregado" && !p.cobrado);
                const enCocina = peds.some(p => ["pendiente", "en_preparacion"].includes(p.estado));
                const tieneListos = peds.some(p => p.estado === "listo");
                const isSelected = sel === num;
                const bg = !activa ? S.border + "40" : pagoPend ? S.danger + "30" : tieneListos ? S.success + "30" : enCocina ? S.warning + "30" : S.accent + "20";
                const brd = isSelected ? S.accent : !activa ? "transparent" : pagoPend ? S.danger : tieneListos ? S.success : enCocina ? S.warning : S.accent + "50";
                const sz = activas <= 6 ? 76 : activas <= 12 ? 64 : activas <= 20 ? 56 : 48;
                const fs = activas <= 6 ? 22 : activas <= 12 ? 18 : 16;

                return (
                  <button key={num} onClick={() => setMesaSeleccionada(isSelected ? null : num)}
                    className={pagoPend && !isSelected ? "pago-pend" : ""}
                    style={{
                      width: sz, height: sz, borderRadius: 12, border: `3px solid ${brd}`,
                      background: bg, cursor: "pointer", display: "flex", flexDirection: "column",
                      alignItems: "center", justifyContent: "center", position: "relative",
                      transition: "all 0.15s", transform: isSelected ? "scale(1.1)" : "scale(1)",
                      boxShadow: isSelected ? `0 0 12px ${S.accent}40` : "none",
                    }}>
                    <span style={{ fontSize: fs, fontWeight: 900, color: activa ? S.text : S.muted, fontFamily: "'JetBrains Mono', monospace" }}>{num}</span>
                    {activa && (
                      <span style={{ fontSize: 7, fontWeight: 800, color: pagoPend ? S.danger : tieneListos ? S.success : enCocina ? S.warning : S.muted, marginTop: 1 }}>
                        {pagoPend ? "💳" : tieneListos ? "✅" : enCocina ? "🔥" : "●"}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          {/* Right: detail panel */}
          <div style={{ width: sel ? 340 : 0, transition: "width 0.2s", overflow: "hidden", borderLeft: sel ? `2px solid ${S.border}` : "none", background: S.surface, display: "flex", flexDirection: "column" }}>
            {sel && (
              <>
                {/* Header */}
                <div style={{ padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: `1px solid ${S.border}`, flexShrink: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontSize: 12, fontWeight: 900, color: S.muted }}>MESA</span>
                    <span style={{ fontSize: 28, fontWeight: 900, fontFamily: "'JetBrains Mono', monospace", color: S.text }}>{String(sel).padStart(2, "0")}</span>
                  </div>
                  <button onClick={() => setMesaSeleccionada(null)} style={{ padding: "6px 12px", borderRadius: 8, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>✕</button>
                </div>

                {selActiva ? (
                  <div style={{ flex: 1, overflow: "auto", padding: "10px 14px" }}>
                    {/* Timer + status */}
                    {(() => {
                      const firstTime = Math.min(...selPeds.map(p => new Date(p.createdAt).getTime()));
                      const elapsed = Math.floor((Date.now() - firstTime) / 1000);
                      const eMin = Math.floor(elapsed / 60); const eSec = elapsed % 60;
                      const statusOrder = { pendiente: 0, en_preparacion: 1, listo: 2, entregado: 3 };
                      const latestStatus = selPeds.reduce((w, p) => statusOrder[p.estado] < statusOrder[w] ? p.estado : w, "entregado");
                      return (
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 14, fontWeight: 800, color: eMin >= 15 ? S.danger : eMin >= 8 ? S.warning : S.muted }}>
                            ⏱ {eMin}:{String(eSec).padStart(2, "0")}
                          </span>
                          <span style={{ fontSize: 10, fontWeight: 800, padding: "3px 8px", borderRadius: 5, color: "#fff",
                            background: latestStatus === "pendiente" ? S.danger : latestStatus === "en_preparacion" ? S.warning : latestStatus === "listo" ? S.success : S.muted }}>
                            {latestStatus === "pendiente" ? "🔥 COCINA" : latestStatus === "en_preparacion" ? "🔥 PREPARANDO" : latestStatus === "listo" ? "✅ LISTO" : "ENTREGADO"}
                          </span>
                        </div>
                      );
                    })()}

                    {/* Pedidos */}
                    {selPeds.map(p => (
                      <div key={p.id} style={{ marginBottom: 8, padding: "8px 10px", borderRadius: 8, background: S.bg, border: `1px solid ${S.border}` }}>
                        <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, marginBottom: 3 }}>#{String(p.numero).padStart(3, "0")}</div>
                        <div style={{ fontSize: 12, color: S.text, lineHeight: 1.5 }}>
                          {p.items.map(i => `${i.cantidad}x ${itemNombre(i)}`).join(" · ")}
                        </div>
                      </div>
                    ))}

                    {/* Nota */}
                    <button onClick={() => setTouchKb({ field: "mesaNota_" + sel, title: "NOTA MESA " + sel, value: mesaNotas[sel] || "" })}
                      style={{ width: "100%", padding: "6px 10px", borderRadius: 6, border: `1px solid ${S.border}`, background: S.bg, color: mesaNotas[sel] ? S.text : S.muted, fontSize: 11, textAlign: "left", cursor: "pointer", marginBottom: 10 }}>
                      {mesaNotas[sel] || "📝 Agregar nota..."}
                    </button>

                    {/* Total + actions */}
                    <div style={{ borderTop: `1px solid ${S.border}`, paddingTop: 10 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                        <span style={{ fontSize: 12, fontWeight: 600, color: S.muted }}>TOTAL</span>
                        <span style={{ fontSize: 22, fontWeight: 900, color: S.accent }}>${selTotal.toLocaleString()}</span>
                      </div>
                      <div style={{ display: "flex", gap: 6 }}>
                        {selPeds.some(p => p.estado === "listo") && (
                          <button onClick={() => { selPeds.filter(p => p.estado === "listo").forEach(p => marcarEntregado(p.id)); }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: S.success, color: "#000", fontSize: 12, fontWeight: 800, cursor: "pointer" }}>
                            ✅ Entregado
                          </button>
                        )}
                        {selPeds.some(p => !p.cobrado && ["listo", "entregado"].includes(p.estado)) && (
                          <button onClick={() => {
                            const allItems = selPeds.flatMap(p => p.items.map(i => ({ ...i, pedNum: p.numero })));
                            const merged = { ...selPeds[0], total: selTotal, items: allItems, numero: selPeds.map(p => p.numero).join("+") };
                            setCobrandoPedido(merged);
                          }} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: "none", background: S.accent, color: "#fff", fontSize: 12, fontWeight: 800, cursor: "pointer" }}>
                            💰 Cobrar mesa
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 8, color: S.muted }}>
                    <span style={{ fontSize: 32, opacity: 0.3 }}>🪑</span>
                    <span style={{ fontSize: 13, fontWeight: 600 }}>Mesa {sel} — Libre</span>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: PEDIDOS */}
      {/* ========================================= */}
      {tab === "pedidos" && (() => {
        const estadoLabel = { pendiente: "COCINA", en_preparacion: "PREPARANDO", listo: "LISTO ✓", entregado: "ENTREGADO", cancelado: "CANCELADO" };
        const estadoColor = e => e === "pendiente" ? S.danger : e === "en_preparacion" ? S.warning : e === "listo" ? S.success : e === "cancelado" ? S.danger : S.muted;

        if (theme === 'modern') {
          // Group pedidos by urgency for modern view
          const grupos = [
            { id: "listo", label: "✅ LISTOS PARA COBRAR", color: S.success, items: pedidos.filter(p => p.estado === "listo" && !p.cobrado) },
            { id: "activos", label: "🔥 EN COCINA", color: S.warning, items: pedidos.filter(p => ["pendiente", "en_preparacion"].includes(p.estado)) },
            { id: "entregado", label: "📦 ENTREGADOS — POR COBRAR", color: S.info, items: pedidos.filter(p => p.estado === "entregado" && !p.cobrado) },
            { id: "cobrados", label: "💰 COBRADOS", color: S.muted, items: pedidos.filter(p => p.cobrado) },
            { id: "cancelados", label: "❌ CANCELADOS", color: S.danger + "80", items: pedidos.filter(p => p.estado === "cancelado") },
          ].filter(g => g.items.length > 0);

          return (
            <div style={{ flex: 1, overflow: "auto", padding: "0" }}>
              {pedidos.length === 0 ? (
                <div style={{ textAlign: "center", padding: "80px 0", color: S.muted }}>
                  <div style={{ fontSize: 56 }}>📋</div>
                  <div style={{ fontSize: 18, fontWeight: 700, marginTop: 16 }}>Sin pedidos todavía</div>
                  <div style={{ fontSize: 13, marginTop: 8, opacity: 0.6 }}>Los pedidos aparecerán aquí</div>
                </div>
              ) : grupos.map(grupo => (
                <div key={grupo.id}>
                  {/* Group header */}
                  <div style={{ padding: "14px 20px 10px", fontSize: 11, fontWeight: 900, color: grupo.color, letterSpacing: "0.1em", borderBottom: `1px solid ${S.border}`, background: grupo.color + "08", display: "flex", alignItems: "center", gap: 10 }}>
                    {grupo.label}
                    <span style={{ background: grupo.color, color: grupo.color === S.muted ? S.bg : "#000", borderRadius: 20, padding: "1px 8px", fontSize: 11, fontWeight: 900 }}>{grupo.items.length}</span>
                  </div>
                  {/* Order rows */}
                  {grupo.items.map(p => {
                    const ec = estadoColor(p.estado);
                    return (
                      <div key={p.id} className="anim-in"
                        onClick={() => pedidosActualizados.has(p.id) && setPedidosActualizados(prev => { const n = new Set(prev); n.delete(p.id); return n; })}
                        style={{ display: "flex", alignItems: "center", padding: "14px 20px", borderBottom: `1px solid ${S.border}`, background: pedidosActualizados.has(p.id) ? S.info + "08" : "transparent", gap: 14 }}>
                        {/* Status band */}
                        <div style={{ width: 5, alignSelf: "stretch", borderRadius: 3, background: ec, flexShrink: 0 }} />
                        {/* Order number */}
                        <div style={{ minWidth: 52, textAlign: "center", flexShrink: 0 }}>
                          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 22, fontWeight: 900, color: S.text, lineHeight: 1 }}>#{String(p.numero).padStart(3, "0")}</div>
                          <div style={{ fontSize: 10, color: S.muted, fontWeight: 600, marginTop: 2 }}>
                            {p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? "Barra" : "Llevar"}
                          </div>
                        </div>
                        {/* Items + client */}
                        <div style={{ flex: 1, minWidth: 0 }}>
                          {p.nombre_cliente && <div style={{ fontSize: 12, fontWeight: 700, color: S.info, marginBottom: 4 }}>📢 {p.nombre_cliente}</div>}
                          <div style={{ fontSize: 13, color: S.text, lineHeight: 1.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                            {p.items.map((it, idx) => (
                              <span key={idx}><span style={{ fontWeight: 800 }}>{it.cantidad}×</span> {itemNombre(it)}{idx < p.items.length - 1 ? " · " : ""}</span>
                            ))}
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 4, flexWrap: "wrap" }}>
                            <span style={{ fontSize: 10, fontWeight: 800, padding: "3px 9px", borderRadius: 7, background: ec + "25", color: ec, letterSpacing: "0.04em" }}>{estadoLabel[p.estado] || p.estado}</span>
                            {p.cobrado && <span style={{ fontSize: 10, color: S.muted, fontWeight: 600 }}>✅ {p.metodo_pago === "efectivo" ? "Efectivo" : p.metodo_pago === "transferencia" ? "Transfer" : "Fiado"}</span>}
                            {pedidosActualizados.has(p.id) && <span className="pulse-blue" style={{ fontSize: 10, fontWeight: 800, color: S.info }}>● modificado</span>}
                          </div>
                        </div>
                        {/* Total */}
                        <div style={{ textAlign: "right", flexShrink: 0 }}>
                          <div style={{ fontSize: 20, fontWeight: 900, color: p.estado === "cancelado" ? S.danger : S.text, textDecoration: p.estado === "cancelado" ? "line-through" : "none", letterSpacing: "-0.02em" }}>${p.total.toLocaleString()}</div>
                        </div>
                        {/* Actions */}
                        <div style={{ display: "flex", flexDirection: "column", gap: 6, flexShrink: 0, minWidth: 130 }}>
                          {p.estado === "listo" && (
                            <button onClick={() => marcarEntregado(p.id)} style={{ padding: "9px 14px", borderRadius: 10, border: "none", background: S.success, color: "#000", fontSize: 12, fontWeight: 800, cursor: "pointer" }}>✅ Entregado</button>
                          )}
                          {!p.cobrado && ["listo", "entregado"].includes(p.estado) && (
                            <button onClick={() => setCobrandoPedido(p)} style={{ padding: "9px 14px", borderRadius: 10, border: "none", background: S.accent, color: "#fff", fontSize: 13, fontWeight: 900, cursor: "pointer", boxShadow: `0 2px 10px ${S.accent}40` }}>💰 Cobrar</button>
                          )}
                          <div style={{ display: "flex", gap: 6 }}>
                            {!p.cobrado && p.estado !== "cancelado" && (
                              <button onClick={() => setPinModal({ action: "cancelar", pedidoId: p.id, pin: "" })} style={{ flex: 1, padding: "7px 0", borderRadius: 9, border: "none", background: S.danger + "18", color: S.danger, fontSize: 11, fontWeight: 800, cursor: "pointer" }}>✕</button>
                            )}
                            {!p.cobrado && ["pendiente", "en_preparacion", "listo"].includes(p.estado) && (
                              <button onClick={() => setEditarPedido({ id: p.id, numero: p.numero, items: p.items.map(i => ({ ...i })) })} style={{ flex: 1, padding: "7px 0", borderRadius: 9, border: `1px solid ${S.border}`, background: S.surfaceHover, color: S.text, fontSize: 11, fontWeight: 800, cursor: "pointer" }}>✏️</button>
                            )}
                            {p.cobrado && p.estado !== "cancelado" && (
                              <button onClick={() => setTicketVisible(p)} style={{ flex: 1, padding: "7px 0", borderRadius: 9, border: `1px solid ${S.border}`, background: S.surfaceHover, color: S.muted, fontSize: 11, fontWeight: 700, cursor: "pointer" }}>🧾</button>
                            )}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          );
        }

        // CLASSIC layout
        return (
          <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em", marginBottom: 16 }}>
              PEDIDOS DE HOY ({pedidos.length})
            </div>
            {pedidos.length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 0", color: S.muted }}>
                <div style={{ fontSize: 48 }}>📋</div>
                <div style={{ fontSize: 16, fontWeight: 700, marginTop: 12 }}>Sin pedidos todavía</div>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 14 }}>
                {pedidos.map(p => {
                  const ec = estadoColor(p.estado);
                  return (
                    <div key={p.id} className="anim-in"
                      onClick={() => pedidosActualizados.has(p.id) && setPedidosActualizados(prev => { const n = new Set(prev); n.delete(p.id); return n; })}
                      style={{ padding: 16, borderRadius: 14, background: S.surface, border: `2px solid ${pedidosActualizados.has(p.id) ? S.info : S.border}`, transition: "border-color 0.3s", cursor: "default" }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                          <span style={{ fontWeight: 900, fontSize: 16 }}>#{String(p.numero).padStart(3, "0")}</span>
                          {p.nombre_cliente && <span style={{ fontSize: 13, fontWeight: 700, color: S.info }}>📢 {p.nombre_cliente}</span>}
                          {p.solo_despacho && <span style={{ fontSize: 10, fontWeight: 900, padding: "2px 8px", borderRadius: 6, background: S.success + "25", color: S.success }}>Directa</span>}
                          {pedidosActualizados.has(p.id) && <span className="pulse-blue" style={{ fontSize: 10, fontWeight: 900, padding: "2px 8px", borderRadius: 6, background: S.info, color: "#fff" }}>● actualizado</span>}
                        </div>
                        <span style={{ fontSize: 10, fontWeight: 800, padding: "4px 10px", borderRadius: 8, color: "#fff", background: ec }}>{p.estado.replace("_", " ").toUpperCase()}</span>
                      </div>
                      <div style={{ fontSize: 11, color: S.muted, marginBottom: 6 }}>
                        {p.tipo === "mesa" ? `Mesa ${p.mesa_numero}` : p.tipo === "barra" ? "Barra" : "Llevar"}
                        {p.nombre_cliente && ` · 📢 ${p.nombre_cliente}`}
                        {p.cobrado && ` · ✅ Cobrado (${p.metodo_pago === "efectivo" ? "💵" : p.metodo_pago === "transferencia" ? "📱" : "📋"})`}
                      </div>
                      <div style={{ padding: "8px 10px", borderRadius: 8, background: S.bg, marginBottom: 8, fontSize: 12, color: S.text, lineHeight: 1.6 }}>
                        {p.items.map((it, idx) => (
                          <span key={idx}>
                            <span style={{ fontWeight: 800, color: getCat(it.cat_id)?.color || S.text }}>{it.cantidad}x</span>{" "}
                            <span style={{ fontWeight: 600 }}>{itemNombre(it)}</span>
                            {it.observaciones && <span style={{ color: S.danger, fontSize: 10, fontWeight: 700 }}> ({it.observaciones})</span>}
                            {idx < p.items.length - 1 && <span style={{ color: S.border }}> · </span>}
                          </span>
                        ))}
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <span style={{ fontSize: 18, fontWeight: 900, color: p.estado === "cancelado" ? S.danger : S.accent, textDecoration: p.estado === "cancelado" ? "line-through" : "none" }}>${p.total.toLocaleString()}</span>
                        <div style={{ display: "flex", gap: 6 }}>
                          {!p.cobrado && p.estado !== "cancelado" && (
                            <button onClick={() => setPinModal({ action: "cancelar", pedidoId: p.id, pin: "" })} style={{ padding: "6px 10px", borderRadius: 8, border: "none", background: S.danger + "18", color: S.danger, fontSize: 10, fontWeight: 800, cursor: "pointer" }}>❌</button>
                          )}
                          {!p.cobrado && ["pendiente", "en_preparacion", "listo"].includes(p.estado) && (
                            <button onClick={() => setEditarPedido({ id: p.id, numero: p.numero, items: p.items.map(i => ({ ...i })) })} style={{ padding: "6px 10px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontSize: 10, fontWeight: 800, cursor: "pointer" }}>✏️</button>
                          )}
                          {p.estado === "listo" && (
                            <button onClick={() => marcarEntregado(p.id)} style={{ padding: "6px 14px", borderRadius: 8, border: "none", background: S.success, color: "#000", fontSize: 11, fontWeight: 800, cursor: "pointer" }}>✅ Entregado</button>
                          )}
                          {!p.cobrado && ["listo", "entregado"].includes(p.estado) && (
                            <button onClick={() => setCobrandoPedido(p)} style={{ padding: "6px 14px", borderRadius: 8, border: "none", background: S.accent, color: "#fff", fontSize: 11, fontWeight: 800, cursor: "pointer" }}>💰 Cobrar</button>
                          )}
                          {p.cobrado && p.estado !== "cancelado" && (
                            <button onClick={() => setTicketVisible(p)} style={{ padding: "6px 10px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.muted, fontSize: 10, fontWeight: 700, cursor: "pointer" }}>🧾</button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TAB: CLIENTES */}
      {/* ========================================= */}
      {tab === "clientes" && (
        <div style={{ flex: 1, overflow: "auto", padding: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, letterSpacing: "0.08em" }}>
              CLIENTES ({clientes.length}) · Deuda total: <span style={{ color: S.warning }}>${clientes.reduce((s, c) => s + c.saldo, 0).toLocaleString()}</span>
            </div>
            <button onClick={() => setClienteForm({ mode: "nuevo", nombre: "", apellido: "", apodo: "", division: "", whatsapp: "" })} style={{
              padding: "10px 20px", borderRadius: 10, border: "none", background: S.accent, color: "#fff",
              fontSize: 13, fontWeight: 800, cursor: "pointer",
            }}>+ Nuevo Cliente</button>
          </div>

          {/* ---- FORM: Nuevo / Editar cliente ---- */}
          {clienteForm && (
            <div className="anim-in" style={{
              marginBottom: 16, padding: 20, borderRadius: 14, background: S.surface,
              border: `2px solid ${S.accent}`, 
            }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: S.accent, marginBottom: 12 }}>
                {clienteForm.mode === "nuevo" ? "➕ NUEVO CLIENTE" : "✏️ EDITAR CLIENTE"}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {[
                  ["nombre", "Nombre *"],
                  ["apellido", "Apellido"],
                  ["apodo", "Apodo"],
                  ["division", "División / Sector"],
                  ["whatsapp", "WhatsApp"],
                ].map(([key, label]) => (
                  <div key={key} style={{ gridColumn: key === "whatsapp" ? "span 2" : undefined }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>{label}</div>
                    <button onClick={() => key === "whatsapp" ? setTouchNum({ field: "clienteForm_" + key, title: label.toUpperCase(), value: clienteForm[key], prefix: "", maxLen: 13 }) : setTouchKb({ field: "clienteForm_" + key, title: label.toUpperCase(), value: clienteForm[key] })}
                      style={{ width: "100%", padding: "8px 12px", borderRadius: 8, border: `2px solid ${clienteForm[key] ? S.accent : S.border}`, background: S.bg, color: clienteForm[key] ? S.text : S.muted, fontSize: 13, textAlign: "left", cursor: "pointer" }}>
                      {clienteForm[key] || "Tocar para escribir"}
                    </button>
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                <button onClick={async () => {
                  if (!clienteForm.nombre.trim()) return;
                  if (clienteForm.mode === "nuevo") {
                    const result = await apiFetch('/clientes', { method: 'POST', body: { nombre: clienteForm.nombre, apellido: clienteForm.apellido || "", apodo: clienteForm.apodo || "", division: clienteForm.division || "", whatsapp: clienteForm.whatsapp || "" } });
                    if (result) { setClientes(prev => [...prev, result]); setNextClienteId(result.id + 1); showMsg("✅ Cliente agregado"); }
                  } else {
                    const result = await apiFetch(`/clientes/${clienteForm.id}`, { method: 'PUT', body: { nombre: clienteForm.nombre, apellido: clienteForm.apellido || "", apodo: clienteForm.apodo || "", division: clienteForm.division || "", whatsapp: clienteForm.whatsapp || "" } });
                    if (result) { setClientes(prev => prev.map(c => c.id === clienteForm.id ? result : c)); showMsg("✅ Cliente actualizado"); }
                  }
                  setClienteForm(null);
                }} disabled={!clienteForm.nombre.trim()} style={{
                  padding: "10px 24px", borderRadius: 10, border: "none",
                  background: clienteForm.nombre.trim() ? S.success : S.border,
                  color: clienteForm.nombre.trim() ? "#000" : S.muted,
                  fontSize: 13, fontWeight: 800, cursor: clienteForm.nombre.trim() ? "pointer" : "not-allowed",
                }}>💾 Guardar</button>
                <button onClick={() => setClienteForm(null)} style={{
                  padding: "10px 24px", borderRadius: 10, border: `1px solid ${S.border}`,
                  background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
                }}>Cancelar</button>
              </div>
            </div>
          )}

          {/* ---- FORM: Pago ---- */}
          {pagoForm && (() => {
            const cli = clientes.find(c => c.id === pagoForm.cliente_id);
            if (!cli) return null;
            const montoVal = Number(pagoForm.monto);
            const valido = pagoForm.monto !== "" && !isNaN(montoVal) && montoVal > 0 && montoVal <= cli.saldo;
            return (
              <div className="anim-in" style={{
                marginBottom: 16, padding: 20, borderRadius: 14, background: S.surface,
                border: `2px solid ${S.success}`,
              }}>
                <div style={{ fontSize: 12, fontWeight: 800, color: S.success, marginBottom: 4 }}>
                  💵 REGISTRAR PAGO — {cli.nombre} {cli.apellido}
                </div>
                <div style={{ fontSize: 12, color: S.muted, marginBottom: 12 }}>
                  Deuda actual: <span style={{ fontWeight: 800, color: S.warning }}>${cli.saldo.toLocaleString()}</span>
                </div>
                <div style={{ display: "flex", gap: 10, alignItems: "flex-end" }}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, color: S.muted, marginBottom: 4 }}>Monto del pago</div>
                    <button onClick={() => setTouchNum({ field: "pagoMonto", title: "MONTO DEL PAGO", value: pagoForm.monto, prefix: "$", maxLen: 8 })}
                      style={{ width: "100%", padding: "10px 14px", borderRadius: 10, border: `2px solid ${S.border}`, background: S.bg, color: pagoForm.monto ? S.text : S.muted, fontSize: 18, fontWeight: 800, textAlign: "left", cursor: "pointer" }}>
                      {pagoForm.monto ? "$" + Number(pagoForm.monto).toLocaleString() : "$0 — tocar para ingresar"}
                    </button>
                  </div>
                  <button onClick={() => setPagoForm(prev => ({ ...prev, monto: String(cli.saldo) }))} style={{
                    padding: "10px 16px", borderRadius: 10, border: `1px solid ${S.border}`, background: S.bg,
                    color: S.text, fontSize: 12, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap",
                  }}>Pago total (${cli.saldo.toLocaleString()})</button>
                </div>
                {pagoForm.monto && montoVal > cli.saldo && (
                  <div style={{ fontSize: 11, color: S.danger, fontWeight: 700, marginTop: 6 }}>⚠️ El monto supera la deuda</div>
                )}
                {valido && (
                  <div style={{ fontSize: 12, color: S.success, fontWeight: 700, marginTop: 8 }}>
                    Deuda después del pago: <span style={{ fontWeight: 900 }}>${(cli.saldo - montoVal).toLocaleString()}</span>
                    {cli.saldo - montoVal === 0 && " ✅ Saldado"}
                  </div>
                )}
                <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                  <button onClick={() => {
                    if (!valido) return;
                    setPinModal({ action: "pagar", clienteId: cli.id, pagoMonto: montoVal, pin: "" });
                  }} disabled={!valido} style={{
                    padding: "10px 24px", borderRadius: 10, border: "none",
                    background: valido ? S.success : S.border,
                    color: valido ? "#000" : S.muted,
                    fontSize: 13, fontWeight: 800, cursor: valido ? "pointer" : "not-allowed",
                  }}>🔐 Confirmar con PIN</button>
                  <button onClick={() => setPagoForm(null)} style={{
                    padding: "10px 24px", borderRadius: 10, border: `1px solid ${S.border}`,
                    background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer",
                  }}>Cancelar</button>
                </div>
              </div>
            );
          })()}

          {/* ---- CLIENT LIST ---- */}
          {clientes.length === 0 ? (
            <div style={{ textAlign: "center", padding: "60px 0", color: S.muted }}>
              <div style={{ fontSize: 48 }}>👥</div>
              <div style={{ fontSize: 16, fontWeight: 700, marginTop: 12 }}>Sin clientes cargados</div>
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {clientes.map(c => {
                const pagosCliente = clientePagos.filter(p => p.cliente_id === c.id);
                const comprasCliente = pedidos.filter(p => p.cliente_id === c.id && p.cobrado);
                const isExpanded = clienteExpandido === c.id;
                return (
                <div key={c.id} className="anim-in" style={{
                  borderRadius: 14, background: S.surface, border: `2px solid ${c.saldo > 0 ? S.warning + "40" : S.border}`,
                  overflow: "hidden",
                }}>
                  {/* Client row */}
                  <div style={{ display: "flex", alignItems: "center", padding: "14px 16px", gap: 14, cursor: "pointer" }}
                    onClick={() => setClienteExpandido(isExpanded ? null : c.id)}>
                    <div style={{ width: 40, height: 40, borderRadius: 10, background: S.accent + "20", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18, fontWeight: 900, color: S.accent, flexShrink: 0 }}>
                      {c.nombre[0]}{c.apellido ? c.apellido[0] : ""}
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontWeight: 700, fontSize: 14 }}>
                        {c.nombre} {c.apellido}
                        {c.apodo && <span style={{ fontSize: 12, color: S.info, marginLeft: 8 }}>"{c.apodo}"</span>}
                      </div>
                      <div style={{ fontSize: 11, color: S.muted, display: "flex", gap: 12, marginTop: 2 }}>
                        {c.division && <span>📍 {c.division}</span>}
                        {c.whatsapp && <span>📱 {c.whatsapp}</span>}
                      </div>
                    </div>
                    <div style={{ textAlign: "right", marginRight: 8 }}>
                      <div style={{ fontSize: 10, fontWeight: 800, color: S.muted }}>SALDO</div>
                      <div style={{ fontWeight: 900, fontSize: 18, color: c.saldo > 0 ? S.warning : S.success }}>
                        ${c.saldo.toLocaleString()}
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 6, flexShrink: 0 }} onClick={e => e.stopPropagation()}>
                      {c.saldo > 0 && (
                        <button onClick={() => setPagoForm({ cliente_id: c.id, monto: "" })} style={{
                          padding: "8px 14px", borderRadius: 8, border: "none", background: S.success,
                          color: "#000", fontSize: 12, fontWeight: 800, cursor: "pointer",
                        }}>💵 Pagar</button>
                      )}
                      <button onClick={() => setClienteForm({ mode: "editar", id: c.id, nombre: c.nombre, apellido: c.apellido, apodo: c.apodo, division: c.division, whatsapp: c.whatsapp })} style={{
                        padding: "8px 10px", borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg,
                        color: S.muted, fontSize: 11, fontWeight: 700, cursor: "pointer",
                      }}>✏️</button>
                      <button onClick={() => {
                        if (c.saldo > 0) { showMsg("⚠️ No se puede eliminar con deuda"); return; }
                        setPinModal({ action: "eliminar", clienteId: c.id, pin: "" });
                      }} style={{
                        padding: "8px 10px", borderRadius: 8, border: "none", background: S.danger + "18",
                        color: S.danger, fontSize: 11, fontWeight: 700, cursor: "pointer",
                      }}>🗑</button>
                    </div>
                    <span style={{ fontSize: 14, color: S.muted, transition: "transform 0.2s", transform: isExpanded ? "rotate(180deg)" : "rotate(0)" }}>▼</span>
                  </div>

                  {/* Expanded: purchase history + payments */}
                  {isExpanded && (
                    <div className="anim-in" style={{ borderTop: `2px solid ${S.border}` }}>
                      {/* Compras (purchases) */}
                      <div style={{ padding: "12px 16px" }}>
                        <div style={{ fontSize: 10, fontWeight: 800, color: S.accent, letterSpacing: "0.06em", marginBottom: 8 }}>
                          🛒 COMPRAS ({comprasCliente.length})
                        </div>
                        {comprasCliente.length === 0 ? (
                          <div style={{ fontSize: 12, color: S.muted, padding: "8px 0" }}>Sin compras registradas</div>
                        ) : (
                          comprasCliente.slice(-10).reverse().map(p => (
                            <div key={p.id} style={{ padding: "8px 0", borderBottom: `1px solid ${S.border}20` }}>
                              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                                  <span style={{ fontWeight: 800, fontSize: 12, fontFamily: "'JetBrains Mono', monospace" }}>#{String(p.numero).padStart(3, "0")}</span>
                                  <span style={{ fontSize: 10, fontWeight: 700, padding: "2px 6px", borderRadius: 4, color: "#fff",
                                    background: p.metodo_pago === "efectivo" ? S.success : p.metodo_pago === "transferencia" ? S.info : S.warning }}>
                                    {p.metodo_pago === "efectivo" ? "💵 Efectivo" : p.metodo_pago === "transferencia" ? "📱 Transfer." : "📋 Fiado"}
                                  </span>
                                </div>
                                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                  <span style={{ fontWeight: 800, fontSize: 14, color: S.accent }}>${p.total.toLocaleString()}</span>
                                  <span style={{ fontSize: 10, color: S.muted, fontFamily: "'JetBrains Mono', monospace" }}>
                                    {new Date(p.createdAt).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit" })} {new Date(p.createdAt).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" })}
                                  </span>
                                </div>
                              </div>
                              <div style={{ fontSize: 11, color: S.muted, lineHeight: 1.5, paddingLeft: 4 }}>
                                {p.items.map((it, idx) => (
                                  <span key={idx}>
                                    <span style={{ fontWeight: 700 }}>{it.cantidad}x</span> {itemNombre(it)} <span style={{ color: S.accent, fontWeight: 700 }}>${(it.precio * it.cantidad).toLocaleString()}</span>
                                    {idx < p.items.length - 1 ? " · " : ""}
                                  </span>
                                ))}
                              </div>
                            </div>
                          ))
                        )}
                      </div>

                      {/* Pagos */}
                      {pagosCliente.length > 0 && (
                        <div style={{ padding: "0 16px 12px", borderTop: `1px solid ${S.border}` }}>
                          <div style={{ fontSize: 10, fontWeight: 800, color: S.success, letterSpacing: "0.06em", padding: "10px 0 6px" }}>
                            💵 PAGOS REALIZADOS ({pagosCliente.length})
                          </div>
