                      background: S.success, color: "#000", fontSize: 12, fontWeight: 800, cursor: "pointer",
                    }}>✅ Aceptar y enviar a cocina</button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}


{/* ========================================= */}
      {/* BACKUP MODAL */}
      {/* ========================================= */}
      {backupModal && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.7)" }}>
          <div style={{ width: 380, padding: 28, borderRadius: 18, background: S.surface, border: `2px solid ${backupModal.status === "error" ? S.danger : backupModal.status === "ok" ? S.success : S.info}`, textAlign: "center" }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>{backupModal.status === "loading" ? "⏳" : backupModal.status === "ok" ? "✅" : "❌"}</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: S.text, lineHeight: 1.5, marginBottom: 16 }}>{backupModal.message}</div>
            {backupModal.status !== "loading" && (
              <button onClick={() => setBackupModal(null)} style={{ padding: "12px 32px", borderRadius: 10, border: "none", background: backupModal.status === "ok" ? S.success : S.danger, color: "#fff", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>OK</button>
            )}
          </div>
        </div>
      )}

      {resetProdModal && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.7)" }}>
          <div style={{ width: 400, padding: 28, borderRadius: 18, background: S.surface, border: `2px solid ${resetProdModal.status === "error" ? S.danger : resetProdModal.status === "ok" ? S.success : S.info}`, textAlign: "center" }}>
            <div style={{ fontSize: 48, marginBottom: 12 }}>{resetProdModal.status === "loading" ? "⏳" : resetProdModal.status === "ok" ? "✅" : "❌"}</div>
            <div style={{ fontSize: 15, fontWeight: 700, color: S.text, lineHeight: 1.6, marginBottom: 16, whiteSpace: "pre-line" }}>{resetProdModal.message}</div>
            {resetProdModal.status !== "loading" && (
              <button onClick={() => setResetProdModal(null)} style={{ padding: "12px 32px", borderRadius: 10, border: "none", background: resetProdModal.status === "ok" ? S.success : S.danger, color: "#fff", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>OK</button>
            )}
          </div>
        </div>
      )}

      {sysActionModal && (() => {
        const isShutdown = sysActionModal.type === 'shutdown';
        const accentColor = isShutdown ? S.danger : S.warning;
        const ejecutar = async () => {
          setSysActionModal({ type: sysActionModal.type, status: 'loading', message: isShutdown ? "Apagando el servidor..." : "Reiniciando el servidor..." });
          try {
            await apiFetch(isShutdown ? '/system/shutdown' : '/system/restart', { method: 'POST' });
            setSysActionModal({ type: sysActionModal.type, status: 'done', message: isShutdown ? "El servidor se está apagando." : "El servidor se está reiniciando. La conexión se restablecerá en unos segundos." });
          } catch(e) {
            setSysActionModal({ type: sysActionModal.type, status: 'error', message: "Error: " + (e?.message || "desconocido") });
          }
        };
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}>
            <div style={{ width: 420, padding: 32, borderRadius: 18, background: S.surface, border: `2px solid ${accentColor}`, textAlign: "center" }}>
              <div style={{ fontSize: 52, marginBottom: 12 }}>
                {sysActionModal.status === 'loading' ? "⏳" : sysActionModal.status === 'done' ? (isShutdown ? "⏻" : "✅") : sysActionModal.status === 'error' ? "❌" : (isShutdown ? "⏻" : "🔄")}
              </div>
              <div style={{ fontSize: 20, fontWeight: 900, color: accentColor, marginBottom: 10 }}>
                {isShutdown ? "Apagar servidor" : "Reiniciar servidor"}
              </div>
              {sysActionModal.status === 'confirm' && (
                <div style={{ fontSize: 15, color: S.muted, marginBottom: 24, lineHeight: 1.5 }}>
                  {isShutdown
                    ? "¿Estás seguro? El servidor se apagará y no estará disponible hasta encenderlo manualmente."
                    : "¿Estás seguro? El servidor se reiniciará y la conexión se interrumpirá por unos segundos."}
                </div>
              )}
              {sysActionModal.status !== 'confirm' && (
                <div style={{ fontSize: 15, fontWeight: 700, color: S.text, lineHeight: 1.5, marginBottom: 20 }}>{sysActionModal.message}</div>
              )}
              {sysActionModal.status === 'confirm' && (
                <div style={{ display: "flex", gap: 12, justifyContent: "center" }}>
                  <button onClick={() => setSysActionModal(null)} style={{ padding: "12px 28px", borderRadius: 10, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 15, fontWeight: 800, cursor: "pointer" }}>Cancelar</button>
                  <button onClick={ejecutar} style={{ padding: "12px 28px", borderRadius: 10, border: "none", background: accentColor, color: "#fff", fontSize: 15, fontWeight: 800, cursor: "pointer" }}>
                    {isShutdown ? "Sí, apagar" : "Sí, reiniciar"}
                  </button>
                </div>
              )}
              {(sysActionModal.status === 'done' || sysActionModal.status === 'error') && (
                <button onClick={() => setSysActionModal(null)} style={{ padding: "12px 32px", borderRadius: 10, border: "none", background: sysActionModal.status === 'error' ? S.danger : accentColor, color: "#fff", fontSize: 14, fontWeight: 800, cursor: "pointer" }}>OK</button>
              )}
            </div>
          </div>
        );
      })()}

      {/* ========================================= */}
      {/* TOUCH KEYBOARD MODAL */}
      {/* ========================================= */}
      {touchKb && (
        <TouchKeyboard
          title={touchKb.title}
          value={touchKb.value}
          onChange={v => setTouchKb(prev => ({ ...prev, value: v }))}
          onDone={v => {
            if (touchKb.field === "nombreBarra") setNombreBarra(v);
            else if (touchKb.field === "nombreLlevar") setNombreLlevar(v);
            else if (touchKb.field.startsWith("mesaNota_")) setMesaNotas(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("clienteForm_")) setClienteForm(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("userForm_")) setUserForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field.startsWith("productoForm_")) setProductoForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field === "categoriaForm_nombre") setCategoriaForm(prev => prev ? ({ ...prev, nombre: v }) : null);
            setTouchKb(null);
          }}
          onCancel={() => {
            const v = touchKb.value;
            if (touchKb.field === "nombreBarra") setNombreBarra(v);
            else if (touchKb.field === "nombreLlevar") setNombreLlevar(v);
            else if (touchKb.field.startsWith("mesaNota_")) setMesaNotas(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("clienteForm_")) setClienteForm(prev => ({ ...prev, [touchKb.field.split("_")[1]]: v }));
            else if (touchKb.field.startsWith("userForm_")) setUserForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field.startsWith("productoForm_")) setProductoForm(prev => prev ? ({ ...prev, [touchKb.field.split("_")[1]]: v }) : null);
            else if (touchKb.field === "categoriaForm_nombre") setCategoriaForm(prev => prev ? ({ ...prev, nombre: v }) : null);
            setTouchKb(null);
          }}
          S={S}
        />
      )}

      {/* TOUCH NUMPAD MODAL */}
      {touchNum && (
        <TouchNumpad
          title={touchNum.title}
          value={touchNum.value}
          onChange={v => setTouchNum(prev => ({ ...prev, value: v }))}
          onDone={v => {
            if (touchNum.field === "pagoMonto") setPagoForm(prev => ({ ...prev, monto: v }));
            else if (touchNum.field === "arqueo") setArqueoEfectivo(v);
            else if (touchNum.field.startsWith("clienteForm_")) setClienteForm(prev => ({ ...prev, [touchNum.field.split("_")[1]]: v }));
            else if (touchNum.field.startsWith("stock_")) {
              const prodId = Number(touchNum.field.split("_")[1]);
              const newStock = Math.max(0, Number(v) || 0);
              setProductos(prev => prev.map(p => p.id === prodId ? { ...p, stock: newStock } : p));
              const prod = productos.find(p => p.id === prodId);
              if (prod) apiFetch(`/productos/${prodId}`, { method: 'PUT', body: { nombre: prod.nombre, precio: prod.precio, stock: newStock, cat_id: prod.cat_id, cocina: prod.cocina } });
            }
            else if (touchNum.field.startsWith("productoForm_")) setProductoForm(prev => prev ? ({ ...prev, [touchNum.field.split("_")[1]]: v }) : null);
            setTouchNum(null);
          }}
          onCancel={() => setTouchNum(null)}
          prefix={touchNum.prefix}
          maxLen={touchNum.maxLen}
          S={S}
        />
      )}

      {/* ========================================= */}
      {/* MODAL: COBRAR */}
      {/* ========================================= */}
      {cobrandoPedido && (
        <CobrarModal
          pedido={cobrandoPedido}
          onCobrar={cobrarPedido}
          onClose={() => setCobrandoPedido(null)}
          clientes={clientes}
          usuarios={usuarios}
          mesasMozos={mesasMozos}
          asignarMozo={asignarMozo}
          S={S}
        />
      )}
    </div>
  );
}

// ========================================
// COBRAR MODAL
// ========================================
function CobrarModal({ pedido, onCobrar, onClose, clientes, usuarios, mesasMozos, asignarMozo, S }) {
  const itemNombre = (i) => i.nombre || (i.producto && i.producto.nombre) || "?";
  const [metodo, setMetodo] = useState("efectivo");
  const [montoRecibido, setMontoRecibido] = useState("");
  const [referencia, setReferencia] = useState("");
  const [clienteBusq, setClienteBusq] = useState("");
  const [clienteSelec, setClienteSelec] = useState(null);
  const [showClienteList, setShowClienteList] = useState(false);
  const [descPct, setDescPct] = useState("");
  const [imprimirTicket, setImprimirTicket] = useState(false);
  const montoInputRef = useRef(null);

  const descMonto = descPct ? Math.round(pedido.total * Number(descPct) / 100) : 0;
  const totalFinal = pedido.total - descMonto;

  const vuelto = metodo === "efectivo" && montoRecibido ? Number(montoRecibido) - totalFinal : null;
  const puedeConfirmar = () => {
    if (metodo === "efectivo") return Number(montoRecibido) >= totalFinal;
    if (metodo === "cuenta_corriente") return clienteSelec !== null;
    return true;
  };

  // Keyboard shortcuts: Escape closes, Enter confirms
  useEffect(() => {
    const confirmar = async () => {
      if (!puedeConfirmar()) return;
      try { await onCobrar(pedido.id, metodo, Number(montoRecibido), referencia, clienteSelec?.id || null, descPct || null, imprimirTicket); } catch(e) {}
    };
    const h = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); onClose(); }
      else if (e.key === 'Enter') {
        const activeEl = document.activeElement;
        const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
        if (!isInput) { e.preventDefault(); confirmar(); }
      }
    };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [metodo, montoRecibido, referencia, clienteSelec, totalFinal, onClose, onCobrar, pedido.id]);

  // Auto-focus monto input when method is efectivo
  useEffect(() => {
    if (metodo === 'efectivo') setTimeout(() => montoInputRef.current?.focus(), 50);
  }, [metodo]);

  const clientesFiltrados = clienteBusq.length > 0
    ? clientes.filter(c => {
        const q = clienteBusq.toLowerCase();
        return c.nombre.toLowerCase().includes(q) || c.apellido.toLowerCase().includes(q) || (c.apodo && c.apodo.toLowerCase().includes(q));
      })
    : clientes;

  const montosSugeridos = [
    totalFinal,
    Math.ceil(totalFinal / 1000) * 1000,
    Math.ceil(totalFinal / 5000) * 5000,
    Math.ceil(totalFinal / 10000) * 10000,
  ].filter((v, i, a) => a.indexOf(v) === i && v >= totalFinal).slice(0, 4);

  const destino = pedido.tipo === "mesa"
    ? `Mesa ${pedido.mesa_numero}`
    : pedido.nombre_cliente
      ? `Barra · ${pedido.nombre_cliente}`
      : "Barra";

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(0,0,0,0.75)" }}
      onClick={onClose}>
      <div className="anim-in" style={{ width: "100%", maxWidth: 400, padding: 14, borderRadius: 18, background: S.surface, border: `2px solid ${S.border}`, maxHeight: "92vh", overflowY: "auto" }}
        onClick={e => e.stopPropagation()}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div>
            <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, letterSpacing: "0.06em" }}>COBRAR PEDIDO</div>
            <div style={{ fontSize: 18, fontWeight: 900 }}>#{String(pedido.numero).padStart(3, "0")} <span style={{ color: S.info, fontWeight: 700 }}>· {destino}</span></div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 24, fontWeight: 900, color: descMonto > 0 ? S.muted : S.accent, textDecoration: descMonto > 0 ? "line-through" : "none" }}>${pedido.total.toLocaleString()}</div>
            {descMonto > 0 && (
              <div style={{ fontSize: 20, fontWeight: 900, color: S.success }}>${totalFinal.toLocaleString()}</div>
            )}
          </div>
        </div>

        {/* Items resumen */}
        <div style={{ padding: "7px 10px", borderRadius: 10, background: S.bg, marginBottom: 8, fontSize: 12, color: S.muted, lineHeight: 1.5 }}>
          {pedido.items.map((it, idx) => (
            <span key={idx}>{it.cantidad}x {itemNombre(it)}{idx < pedido.items.length - 1 ? " · " : ""}</span>
          ))}
        </div>

        {/* Mozo pills — solo para pedidos de mesa */}
        {pedido.tipo === "mesa" && usuarios && (
          <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap", marginBottom: 10 }}>
            <span style={{ fontSize: 10, fontWeight: 800, color: S.muted }}>👤</span>
            <span onClick={() => asignarMozo(pedido.mesa_numero, null)}
              style={{ padding: "4px 8px", borderRadius: 8, border: `1px solid ${!mesasMozos[pedido.mesa_numero] ? S.accent : S.border}`, background: !mesasMozos[pedido.mesa_numero] ? S.accent : "transparent", color: !mesasMozos[pedido.mesa_numero] ? "#fff" : S.muted, fontSize: 10, fontWeight: 800, cursor: "pointer" }}>—</span>
            {usuarios.filter(u => (u.rol === 'mozo' || u.rol === 'cajero') && u.nombre !== 'Mozo C').map(u => {
              const isAssigned = mesasMozos[pedido.mesa_numero] === u.id;
              return (
                <span key={u.id} onClick={() => asignarMozo(pedido.mesa_numero, u.id)}
                  style={{ padding: "4px 9px", borderRadius: 8, border: `1px solid ${isAssigned ? S.accent : S.border}`, background: isAssigned ? S.accent : S.bg, color: isAssigned ? "#fff" : S.text, fontSize: 10, fontWeight: 800, cursor: "pointer", whiteSpace: "nowrap" }}>
                  {u.nombre}
                </span>
              );
            })}
          </div>
        )}

        {/* Discount */}
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 10 }}>
          <span style={{ fontSize: 10, fontWeight: 800, color: S.muted, whiteSpace: "nowrap" }}>🏷️ DESC.</span>
          {[0, 5, 10, 15, 20].map(pct => (
            <button key={pct} onClick={() => setDescPct(pct === 0 ? "" : String(pct))} style={{
              padding: "4px 9px", borderRadius: 7, border: `1px solid ${S.border}`,
              background: (pct === 0 && !descPct) || descPct === String(pct) ? S.accent : S.bg,
              color: (pct === 0 && !descPct) || descPct === String(pct) ? "#fff" : S.text,
              fontSize: 11, fontWeight: 700, cursor: "pointer",
            }}>{pct === 0 ? "Sin" : `${pct}%`}</button>
          ))}
          {descMonto > 0 && (
            <span style={{ fontSize: 11, fontWeight: 800, color: S.success, marginLeft: 2 }}>-${descMonto.toLocaleString()}</span>
          )}
        </div>

        {/* Client search */}
        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, marginBottom: 6, letterSpacing: "0.04em" }}>
            CLIENTE {metodo === "cuenta_corriente" ? "(obligatorio)" : "(opcional)"}
          </div>
          {clienteSelec ? (
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", borderRadius: 10, background: S.bg, border: `2px solid ${S.info}40` }}>
              <div>
                <span style={{ fontWeight: 700, fontSize: 14 }}>{clienteSelec.nombre} {clienteSelec.apellido}</span>
                {clienteSelec.apodo && <span style={{ fontSize: 12, color: S.info, marginLeft: 8 }}>"{clienteSelec.apodo}"</span>}
                {clienteSelec.division && <span style={{ fontSize: 11, color: S.muted, marginLeft: 8 }}>· {clienteSelec.division}</span>}
              </div>
              <button onClick={() => { setClienteSelec(null); setClienteBusq(""); }} style={{
                padding: "4px 10px", borderRadius: 6, border: "none", background: S.danger + "18", color: S.danger,
                fontSize: 11, fontWeight: 700, cursor: "pointer",
              }}>✕</button>
            </div>
          ) : (
            <div>
              {/* Search input */}
              <div style={{ position: "relative" }}>
                <input type="text" value={clienteBusq} onChange={e => { setClienteBusq(e.target.value); setShowClienteList(true); }}
                  onFocus={() => setShowClienteList(true)}
                  onKeyDown={e => {
                    if (e.key === 'Enter' && clientesFiltrados.length > 0) { setClienteSelec(clientesFiltrados[0]); setShowClienteList(false); setClienteBusq(""); }
                    if (e.key === 'Escape') { setShowClienteList(false); setClienteBusq(""); }
                  }}
                  placeholder="🔍 Buscá por nombre, apodo o división..."
                  style={{ width: "100%", padding: "10px 14px", borderRadius: 10, border: `2px solid ${clienteBusq ? S.accent : S.border}`, background: S.bg, color: S.text, fontSize: 13, fontWeight: 600, outline: "none" }} />
                {clienteBusq && (
                  <button onClick={() => { setClienteBusq(""); setShowClienteList(false); }} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", border: "none", background: "transparent", color: S.muted, fontSize: 14, cursor: "pointer" }}>✕</button>
                )}
              </div>
              {showClienteList && (
                <div style={{ marginTop: 4, maxHeight: 200, overflowY: "auto", borderRadius: 10, border: `2px solid ${S.border}`, background: S.bg, boxShadow: "0 8px 24px rgba(0,0,0,0.4)" }}>
                  {clientesFiltrados.length === 0 ? (
                    <div style={{ padding: "14px 16px", textAlign: "center", fontSize: 12, color: S.muted }}>Sin resultados</div>
                  ) : (
                    clientesFiltrados.slice(0, 10).map(c => (
                      <button key={c.id} onClick={() => { setClienteSelec(c); setShowClienteList(false); setClienteBusq(""); }}
                        style={{
                          width: "100%", padding: "10px 14px", border: "none", borderBottom: `1px solid ${S.border}`,
                          background: "transparent", color: S.text, textAlign: "left", cursor: "pointer",
                          display: "flex", alignItems: "center", justifyContent: "space-between",
                        }}>
                        <div>
                          <span style={{ fontWeight: 700, fontSize: 13 }}>{c.nombre} {c.apellido}</span>
                          {c.apodo && <span style={{ fontSize: 11, color: S.info, marginLeft: 6 }}>"{c.apodo}"</span>}
                          {c.division && <span style={{ fontSize: 10, color: S.muted, marginLeft: 6 }}>· {c.division}</span>}
                        </div>
                        {c.saldo > 0 && (
                          <span style={{ fontSize: 11, fontWeight: 800, color: S.warning }}>${c.saldo.toLocaleString()}</span>
                        )}
                      </button>
                    ))
                  )}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Method */}
        <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
          {[["efectivo", "💵", "Efectivo"], ["transferencia", "📱", "Transfer."], ["cuenta_corriente", "📋", "Fiado"]].map(([v, icon, label]) => (
            <button key={v} onClick={() => setMetodo(v)} style={{
              flex: 1, padding: "8px 0", borderRadius: 12, border: `2px solid ${metodo === v ? S.accent : S.border}`,
              background: metodo === v ? S.accent : S.bg, color: metodo === v ? "#fff" : S.text,
              fontSize: 12, fontWeight: 800, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3,
            }}>
              <span style={{ fontSize: 18 }}>{icon}</span>{label}
            </button>
          ))}
        </div>

        {metodo === "efectivo" && (
          <div style={{ marginBottom: 8 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "flex-end" }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 10, fontWeight: 800, color: S.muted, marginBottom: 4 }}>RECIBIDO</div>
                <input
                  ref={montoInputRef}
                  type="text"
                  inputMode="numeric"
                  pattern="[0-9]*"
                  value={montoRecibido}
                  onChange={e => setMontoRecibido(e.target.value.replace(/\D/g, ''))}
                  onKeyDown={e => {
                    if (e.key === 'Enter') { e.preventDefault(); if (puedeConfirmar()) onCobrar(pedido.id, metodo, Number(montoRecibido), referencia, clienteSelec?.id || null, descPct || null, imprimirTicket).catch(()=>{}); }
                  }}
                  placeholder="0"
                  style={{ width: "100%", padding: "8px 10px", borderRadius: 10, border: `2px solid ${montoRecibido ? S.accent : S.border}`, background: S.bg, fontSize: 28, fontWeight: 900, textAlign: "center", color: montoRecibido ? S.text : S.muted, outline: "none", fontFamily: "'JetBrains Mono', monospace" }}
                />
              </div>
              {vuelto !== null && vuelto >= 0 && (
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 10, fontWeight: 800, color: S.success, marginBottom: 4 }}>VUELTO</div>
                  <div style={{ padding: "8px 10px", borderRadius: 10, border: `2px solid ${S.success}40`, background: S.success + "10", textAlign: "center" }}>
                    <span style={{ fontSize: 24, fontWeight: 900, color: S.success }}>${vuelto.toLocaleString()}</span>
                  </div>
                </div>
              )}
            </div>
            {/* Inline numpad (touch) */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 5, marginBottom: 6 }}>
              {["1","2","3","C","4","5","6","0","7","8","9","00"].map(k => (
                <button key={k} onClick={() => {
                  if (k === "C") setMontoRecibido("");
                  else setMontoRecibido(prev => prev + k);
                  montoInputRef.current?.focus();
                }} style={{ height: 40, borderRadius: 8, border: `1px solid ${S.border}`, background: k === "C" ? S.border : S.bg, color: S.text, fontSize: k === "C" ? 13 : 16, fontWeight: 800, cursor: "pointer" }}>{k === "C" ? "✕" : k}</button>
              ))}
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              {montosSugeridos.map(m => (
                <button key={m} onClick={() => setMontoRecibido(String(m))} style={{
                  flex: 1, padding: "6px 0", borderRadius: 7, border: `1px solid ${S.border}`,
                  background: Number(montoRecibido) === m ? S.accent : S.bg, color: Number(montoRecibido) === m ? "#fff" : S.text,
                  fontSize: 11, fontWeight: 700, cursor: "pointer",
                }}>${m.toLocaleString()}</button>
              ))}
            </div>
          </div>
        )}

        {metodo === "transferencia" && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ padding: 10, borderRadius: 12, background: S.bg, border: `1px solid ${S.border}`, textAlign: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 10, fontWeight: 800, color: S.muted }}>ALIAS PARA TRANSFERENCIA</div>
              <div style={{ fontSize: 22, fontWeight: 900, color: S.info, marginTop: 6, fontFamily: "'JetBrains Mono', monospace" }}>cantina.alias</div>
              <div style={{ fontSize: 11, color: S.muted, marginTop: 4 }}>Indicale este alias al cliente</div>
            </div>
            <div style={{ fontSize: 11, fontWeight: 800, color: S.muted, marginBottom: 6 }}>Últimos 4 dígitos (opcional)</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <input
                type="text"
                inputMode="numeric"
                maxLength={4}
                value={referencia}
                onChange={e => setReferencia(e.target.value.replace(/\D/g, '').slice(0, 4))}
                onKeyDown={e => { if (e.key === 'Enter') { e.preventDefault(); if (puedeConfirmar()) onCobrar(pedido.id, metodo, Number(montoRecibido), referencia, clienteSelec?.id || null, descPct || null, imprimirTicket).catch(()=>{}); } }}
                placeholder="_ _ _ _"
                style={{ flex: 1, padding: "10px 14px", borderRadius: 10, border: `2px solid ${referencia ? S.accent : S.border}`, background: S.bg, fontSize: 22, fontWeight: 800, color: S.text, textAlign: "center", fontFamily: "'JetBrains Mono', monospace", letterSpacing: "0.2em", outline: "none" }}
              />
              {referencia && <button onClick={() => setReferencia("")} style={{ padding: "8px 12px", borderRadius: 8, border: "none", background: S.border, color: S.text, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>✕</button>}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 5 }}>
              {["1","2","3","4","5","6","7","8","9","0"].map(d => (
                <button key={d} onClick={() => referencia.length < 4 && setReferencia(prev => prev + d)} style={{ height: 40, borderRadius: 8, border: `1px solid ${S.border}`, background: S.bg, color: S.text, fontSize: 16, fontWeight: 800, cursor: "pointer" }}>{d}</button>
              ))}
            </div>
          </div>
        )}

        {metodo === "cuenta_corriente" && (
          <div style={{ marginBottom: 10, padding: 10, borderRadius: 12, background: S.bg, border: `1px solid ${clienteSelec ? S.warning : S.danger}40`, textAlign: "center" }}>
            {clienteSelec ? (
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: S.warning }}>
                  ⚠️ Se carga ${totalFinal.toLocaleString()} a la cuenta de {clienteSelec.nombre} {clienteSelec.apellido}
                </div>
                {clienteSelec.saldo > 0 && (
                  <div style={{ fontSize: 12, color: S.danger, marginTop: 6, fontWeight: 700 }}>
                    Deuda actual: ${clienteSelec.saldo.toLocaleString()} → Nueva deuda: ${(clienteSelec.saldo + totalFinal).toLocaleString()}
                  </div>
                )}
              </div>
            ) : (
              <div style={{ fontSize: 13, fontWeight: 700, color: S.danger }}>
                ⚠️ Seleccioná un cliente arriba para cargar a cuenta corriente
              </div>
            )}
          </div>
        )}

        {pedido.tipo !== "mesa" && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 12px", borderRadius: 10, background: S.bg, border: `1px solid ${imprimirTicket ? S.accent : S.border}`, marginBottom: 12, cursor: "pointer" }}
            onClick={() => setImprimirTicket(v => !v)}>
            <span style={{ fontSize: 13, fontWeight: 700, color: imprimirTicket ? S.text : S.muted }}>🖨️ Imprimir ticket</span>
            <div style={{ width: 36, height: 20, borderRadius: 10, background: imprimirTicket ? S.accent : S.border, position: "relative", transition: "background 0.2s" }}>
              <div style={{ position: "absolute", top: 2, left: imprimirTicket ? 18 : 2, width: 16, height: 16, borderRadius: "50%", background: "#fff", transition: "left 0.2s" }} />
            </div>
          </div>
        )}
        <div style={{ display: "flex", gap: 12 }}>
          <button onClick={onClose} style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: `1px solid ${S.border}`, background: "transparent", color: S.muted, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Cancelar</button>
          <button onClick={async () => { if (puedeConfirmar()) { try { await onCobrar(pedido.id, metodo, Number(montoRecibido), referencia, clienteSelec?.id || null, descPct || null, imprimirTicket); } catch(e) { console.error('Cobro error:', e); } } }} disabled={!puedeConfirmar()}
            style={{ flex: 1, padding: "12px 0", borderRadius: 12, border: "none", background: puedeConfirmar() ? S.success : S.border, color: puedeConfirmar() ? "#000" : S.muted, fontSize: 13, fontWeight: 800, cursor: puedeConfirmar() ? "pointer" : "not-allowed" }}>
            ✅ Confirmar Cobro
          </button>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.__App));
</script>
<style>#fs-btn{position:fixed;bottom:18px;right:18px;z-index:9999;padding:9px 15px;background:rgba(20,24,36,0.9);color:#fff;border:1px solid rgba(255,255,255,0.18);border-radius:8px;font-size:10px;font-weight:800;letter-spacing:.04em;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.5)}#fs-btn.fs-hidden{display:none}</style>
<button id="fs-btn">⛶ PANTALLA COMPLETA</button>
<script>(function(){var b=document.getElementById('fs-btn');b.onclick=function(){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};document.addEventListener('fullscreenchange',function(){b.classList.toggle('fs-hidden',!!document.fullscreenElement);});})();</script>
</body>
</html>
