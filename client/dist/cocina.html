<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cantina POS — Cocina</title>
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{margin:0;background:#070A12;color:#EAF0FF;overflow:hidden;height:100vh;overscroll-behavior-y:contain}#root{height:100vh;color:#EAF0FF}input:focus,select:focus{outline:none}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1A2140;border-radius:4px}</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script>
const {useState, useEffect, useCallback, useRef} = React;

const API = window.location.origin + '/api';
const apiFetch = async (path, opts = {}) => {
  try {
    const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (!res.ok) throw new Error(res.statusText);
    return await res.json();
  } catch (e) { console.error('API:', e); return null; }
};

const itemNombre = (i) => i.nombre || (i.producto && i.producto.nombre) || "?";

const S = { bg: "#070A12", surface: "#0D1120", surfaceHover: "#131829", border: "#1A2140", text: "#EAF0FF", muted: "#4A5578", accent: "#6366F1", danger: "#EF4444", warning: "#F59E0B", success: "#10B981", info: "#3B82F6" };

function Timer({ desde }) {
  const [elapsed, setElapsed] = useState(0);
  useEffect(() => {
    const start = new Date(desde).getTime();
    const tick = () => setElapsed(Math.floor((Date.now() - start) / 1000));
    tick();
    const iv = setInterval(tick, 1000);
    return () => clearInterval(iv);
  }, [desde]);
  const m = Math.floor(elapsed / 60), s = elapsed % 60;
  const color = m >= 12 ? S.danger : m >= 6 ? S.warning : S.success;
  return React.createElement("span", {
    style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 42, fontWeight: 900, color: color, textShadow: `0 0 15px ${color}40`, animation: m >= 12 ? "blink 1s infinite" : "none" }
  }, `${m}:${String(s).padStart(2, "0")}`);
}

window.__App = function CocinaDisplay() {
  const [pedidos, setPedidos] = useState([]);
  const [now, setNow] = useState(new Date());
  const [conectado, setConectado] = useState(true);
  const [pedidosModificados, setPedidosModificados] = useState({});
  const [usuarios, setUsuarios] = useState([]);
  const [mesasMozos, setMesasMozos] = useState({});
  const prevPedidosRef = useRef([]);
  const [nuevoPedidoSignal, setNuevoPedidoSignal] = useState(0);

  const hashItems = (items) =>
    (items || [])
      .map(i => `${i.producto_id || i.id}:${i.cantidad}`)
      .sort()
      .join('|');

  const loadPedidos = useCallback(async () => {
    const peds = await apiFetch('/pedidos');
    setConectado(!!peds);
    if (peds) {
      const activos = peds.filter(p => ["pendiente", "en_preparacion", "listo"].includes(p.estado));
      const prev = prevPedidosRef.current;
      if (prev.length > 0) {
        const nuevosModificados = {};
        activos.forEach(newP => {
          const oldP = prev.find(p => p.id === newP.id);
          if (oldP && (
            oldP.total !== newP.total ||
            (oldP.items?.length ?? 0) !== (newP.items?.length ?? 0) ||
            hashItems(oldP.items) !== hashItems(newP.items)
          )) nuevosModificados[newP.id] = true;
        });
        if (Object.keys(nuevosModificados).length > 0)
          setPedidosModificados(prev => ({ ...prev, ...nuevosModificados }));
        // Detectar pedidos nuevos y disparar alarma
        const hayNuevos = activos.some(newP => !prev.find(p => p.id === newP.id));
        if (hayNuevos) setNuevoPedidoSignal(s => s + 1);
      }
      prevPedidosRef.current = activos;
      setPedidos(activos);
    }
  }, []);

  useEffect(() => {
    loadPedidos();
    const iv = setInterval(loadPedidos, 5000);
    const clock = setInterval(() => setNow(new Date()), 1000);
    Promise.all([apiFetch('/usuarios'), apiFetch('/mesas/mozos')]).then(([users, mozos]) => {
      if (users) setUsuarios(users);
      if (mozos) setMesasMozos(mozos);
    });
    const ivMozos = setInterval(() => apiFetch('/mesas/mozos').then(m => { if (m) setMesasMozos(m); }), 30000);
    return () => { clearInterval(iv); clearInterval(clock); clearInterval(ivMozos); };
  }, [loadPedidos]);

  const playAlarm = useCallback(() => {
    try {
      const c = new AudioContext();
      const p = (f, t, d) => { const o = c.createOscillator(); const g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.35, c.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t + d); o.start(c.currentTime + t); o.stop(c.currentTime + t + d); };
      p(880, 0, .9); p(1108, .3, .9);
      p(880, 1.1, .9); p(1108, 1.4, .9);
      setTimeout(() => c.close(), 3000);
    } catch (e) {}
  }, []);

  useEffect(() => {
    if (nuevoPedidoSignal > 0) playAlarm();
  }, [nuevoPedidoSignal, playAlarm]);

  const playBell = useCallback(() => {
    try {
      const c = new AudioContext();
      const p = (f, t, d) => { const o = c.createOscillator(); const g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.6, c.currentTime + t); g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + t + d); o.start(c.currentTime + t); o.stop(c.currentTime + t + d); };
      p(1318, 0, .5); p(1046, .35, .5); p(1318, .7, .5); p(1568, 1.05, .8);
      setTimeout(() => c.close(), 2500);
    } catch (e) {}
  }, []);

  const cambiarEstado = useCallback(async (id, nuevoEstado) => {
    const result = await apiFetch(`/pedidos/${id}`, { method: 'PUT', body: { estado: nuevoEstado } });
    if (!result) return;
    if (nuevoEstado === "listo") {
      playBell();
      setPedidos(prev => prev.map(p => p.id === id ? { ...p, estado: "listo" } : p));
      setTimeout(() => setPedidos(prev => prev.filter(p => p.id !== id)), 5000);
    } else if (nuevoEstado === "entregado") {
      setPedidos(prev => prev.filter(p => p.id !== id));
    } else {
      setPedidos(prev => prev.map(p => p.id === id ? { ...p, estado: nuevoEstado } : p));
    }
  }, [playBell]);

  const sorted = [...pedidos].sort((a, b) => {
    const o = { pendiente: 0, en_preparacion: 1, listo: 2 };
    return (o[a.estado] ?? 3) - (o[b.estado] ?? 3) || new Date(a.createdAt).getTime() - new Date(b.createdAt).getTime();
  });

  const pendCount = pedidos.filter(p => p.estado === "pendiente").length;
  const pedidoPrefix = (p) => {
    if (p.tipo !== "mesa" || !mesasMozos[p.mesa_numero]) return "#";
    const u = usuarios.find(u => u.id === mesasMozos[p.mesa_numero]);
    return u ? u.nombre[0].toUpperCase() : "#";
  };

  return React.createElement("div", {
    style: { height: "100vh", background: S.bg, fontFamily: "'DM Sans', -apple-system, sans-serif", color: S.text, display: "flex", flexDirection: "column" }
  },
    React.createElement("style", null, `
      @import url('/fonts/dm-jb.css');
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; overflow: hidden; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
      @keyframes pulseCard { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: 0 0 40px rgba(239,68,68,0.35); } }
      @keyframes pulseBlue { 0%, 100% { background: #6366F1; } 50% { background: #4F52D8; } }
      @keyframes modernIn { from { opacity: 0; transform: scale(0.97) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
      .mod-banner { animation: pulseBlue 1.2s ease-in-out infinite; }
      button { transition: transform 0.1s ease, opacity 0.1s ease; }
      button:active { transform: scale(0.96) !important; }
    `),
    React.createElement("div", {
      style: { display: "flex", justifyContent: "space-between", alignItems: "center", padding: "14px 28px", background: `linear-gradient(180deg, ${S.surface} 0%, ${S.bg} 100%)`, borderBottom: `1px solid ${S.border}`, boxShadow: `0 1px 0 ${S.border}, 0 4px 20px rgba(0,0,0,0.5)`, flexShrink: 0 }
    },
      React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 14 } },
        React.createElement("div", {
          style: { width: 46, height: 46, borderRadius: 13, background: `linear-gradient(135deg, ${S.accent}, ${S.accent}88)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, boxShadow: `0 4px 16px ${S.accent}50` }
        }, "👨‍🍳"),
        React.createElement("span", { style: { fontSize: 26, fontWeight: 900, letterSpacing: "0.08em", color: S.text } }, "COCINA"),
        React.createElement("div", {
          style: { display: "flex", alignItems: "center", gap: 5, padding: "3px 10px", borderRadius: 20, background: (conectado ? S.success : S.danger) + "18", border: `1px solid ${conectado ? S.success : S.danger}35` }
        },
          React.createElement("div", {
            style: { width: 6, height: 6, borderRadius: "50%", background: conectado ? S.success : S.danger, boxShadow: `0 0 6px ${conectado ? S.success : S.danger}` }
          }),
          React.createElement("span", {
            style: { fontSize: 9, fontWeight: 800, color: conectado ? S.success : S.danger, letterSpacing: "0.05em" }
          }, conectado ? "EN LÍNEA" : "SIN CONEXIÓN")
        )
      ),
      React.createElement("div", { style: { display: "flex", gap: 16, alignItems: "center" } },
        pendCount > 0 && React.createElement("div", {
          style: { display: "flex", alignItems: "center", gap: 8, padding: "8px 16px", borderRadius: 12, background: S.danger + "18", border: `1px solid ${S.danger}40` }
        },
          React.createElement("div", {
            style: { width: 8, height: 8, borderRadius: "50%", background: S.danger, boxShadow: `0 0 8px ${S.danger}` }
          }),
          React.createElement("span", {
            style: { fontSize: 18, fontWeight: 900, color: S.danger, letterSpacing: "0.04em" }
          }, `${pendCount} NUEVO${pendCount > 1 ? "S" : ""}`)
        ),
        React.createElement("div", {
          style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 28, fontWeight: 800, color: S.muted, letterSpacing: "0.04em" }
        }, now.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }))
      )
    ),
    React.createElement("div", { style: { flex: 1, overflow: "auto", padding: 18 } },
      sorted.length === 0
        ? React.createElement("div", {
            style: { height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", color: S.muted }
          },
            React.createElement("span", { style: { fontSize: 80 } }, "👨‍🍳"),
            React.createElement("span", { style: { fontSize: 28, fontWeight: 800, marginTop: 12 } }, "Sin pedidos activos")
          )
        : React.createElement("div", {
            style: { display: "grid", gridTemplateColumns: sorted.length <= 2 ? "repeat(2, 1fr)" : "repeat(3, 1fr)", gap: 18, alignItems: "start" }
          },
            sorted.map(p => {
              const isPend = p.estado === "pendiente", isPrep = p.estado === "en_preparacion", isListo = p.estado === "listo";
              const brd = isPend ? S.danger : isPrep ? S.warning : S.success;
              const itemsC = (p.items || []).filter(i => !(i.despacho_directo));
              const itemsD = (p.items || []).filter(i => i.despacho_directo);

              return React.createElement("div", {
                key: p.id,
                style: { borderRadius: 20, overflow: "hidden", background: S.surface, border: `3px solid ${brd}`, boxShadow: isPend ? `0 0 40px ${brd}35, 0 8px 32px rgba(0,0,0,0.5)` : `0 8px 32px rgba(0,0,0,0.4)`, animation: isPend ? "pulseCard 2s infinite" : "none", transition: "all 0.3s ease" }
              },
                React.createElement("div", {
                  style: { padding: "16px 22px", display: "flex", justifyContent: "space-between", alignItems: "center", background: `linear-gradient(180deg, ${brd}25 0%, ${brd}10 100%)`, borderBottom: `2px solid ${brd}40` }
                },
                  React.createElement("div", { style: { display: "flex", alignItems: "baseline", gap: 12 } },
                    React.createElement("span", {
                      style: { fontFamily: "'JetBrains Mono', monospace", fontSize: 52, fontWeight: 900, lineHeight: 1, color: brd, textShadow: `0 0 20px ${brd}50` }
                    }, `${pedidoPrefix(p)}${String(p.numero).padStart(2, "0")}`),
                    React.createElement("div", null,
                      React.createElement("div", {
                        style: { fontSize: 18, fontWeight: 900, color: brd, letterSpacing: "0.06em" }
                      }, p.tipo === "mesa" ? "MESA " + p.mesa_numero : p.tipo === "barra" ? "BARRA" : "🛍️ LLEVAR"),
                      p.nombre_cliente && React.createElement("div", {
                        style: { fontSize: 13, fontWeight: 700, color: S.info, marginTop: 2 }
                      }, "📢 " + p.nombre_cliente)
                    )
                  ),
                  React.createElement(Timer, { desde: p.createdAt })
                ),
                pedidosModificados[p.id] && React.createElement("div", {
                  className: "mod-banner",
                  style: { display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 18px" }
                },
                  React.createElement("span", {
                    style: { fontSize: 20, fontWeight: 900, color: "#fff", letterSpacing: "0.04em" }
                  }, "✏️ PEDIDO MODIFICADO"),
                  React.createElement("button", {
                    onClick: (e) => { e.stopPropagation(); setPedidosModificados(prev => { const n = {...prev}; delete n[p.id]; return n; }); },
                    style: { padding: "10px 20px", borderRadius: 10, border: "2px solid rgba(255,255,255,0.6)", background: "rgba(255,255,255,0.12)", color: "#fff", fontSize: 16, fontWeight: 900, cursor: "pointer" }
                  }, "✓ VISTO")
                ),
                React.createElement("div", { style: { padding: "12px 18px" } },
                  itemsC.map((it, idx) =>
                    React.createElement("div", {
                      key: idx,
                      style: { padding: "10px 0", borderBottom: idx < itemsC.length - 1 ? `1px solid ${S.border}` : "none", display: "flex", alignItems: "flex-start", gap: 14 }
                    },
                      React.createElement("div", {
                        style: { minWidth: 46, height: 46, borderRadius: 12, background: brd, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "'JetBrains Mono', monospace", fontSize: 26, fontWeight: 900, color: "#000", flexShrink: 0 }
                      }, it.cantidad),
                      React.createElement("div", { style: { flex: 1 } },
                        React.createElement("div", {
                          style: { fontSize: 22, fontWeight: 800, lineHeight: 1.25, color: S.text }
                        }, itemNombre(it)),
                        it.observaciones && React.createElement("div", {
                          style: { marginTop: 5, fontSize: 16, fontWeight: 700, color: S.danger, padding: "3px 8px", borderRadius: 6, background: S.danger + "15", display: "inline-block" }
                        }, "⚠️ " + it.observaciones)
                      )
                    )
                  ),
                  itemsD.length > 0 && React.createElement("div", {
                    style: { marginTop: 8, padding: "7px 12px", borderRadius: 10, background: S.success + "12", border: `1px solid ${S.success}30`, fontSize: 13, fontWeight: 700, color: S.success }
                  }, `🍺 +${itemsD.reduce((s, i) => s + i.cantidad, 0)} bebida(s) en mostrador`)
                ),
                React.createElement("div", { style: { padding: "10px 18px 16px" } },
                  isPend && React.createElement("button", {
                    onClick: () => cambiarEstado(p.id, "en_preparacion"),
                    style: { width: "100%", padding: "17px 0", borderRadius: 13, border: "none", background: `linear-gradient(135deg, ${S.warning}, #E08900)`, color: "#000", fontSize: 21, fontWeight: 900, cursor: "pointer", boxShadow: `0 4px 20px ${S.warning}40` }
                  }, "🔥 EMPEZAR A PREPARAR"),
                  isPrep && React.createElement("button", {
                    onClick: () => cambiarEstado(p.id, "listo"),
                    style: { width: "100%", padding: "17px 0", borderRadius: 13, border: "none", background: `linear-gradient(135deg, ${S.success}, #0CA070)`, color: "#000", fontSize: 21, fontWeight: 900, cursor: "pointer", boxShadow: `0 4px 20px ${S.success}40` }
                  }, "✅ LISTO PARA ENTREGAR"),
                  isListo && React.createElement("div", { style: { display: "flex", gap: 8 } },
                    React.createElement("div", {
                      style: { flex: 1, padding: "17px 0", borderRadius: 13, background: S.success + "20", color: S.success, fontSize: 17, fontWeight: 900, textAlign: "center", border: `1px solid ${S.success}30` }
                    }, "✅ ESPERANDO RETIRO"),
                    React.createElement("button", {
                      onClick: () => cambiarEstado(p.id, "entregado"),
                      style: { padding: "17px 18px", borderRadius: 13, border: "none", background: S.info, color: "#fff", fontSize: 15, fontWeight: 900, cursor: "pointer", boxShadow: `0 4px 16px ${S.info}40` }
                    }, "📦 ENTREGADO")
                  )
                )
              );
            })
          )
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.__App));
</script>
<style>#fs-btn{position:fixed;bottom:18px;right:18px;z-index:9999;padding:14px 22px;background:rgba(20,24,36,0.9);color:#fff;border:1px solid rgba(255,255,255,0.18);border-radius:12px;font-size:15px;font-weight:800;letter-spacing:.04em;cursor:pointer;touch-action:manipulation;backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.5)}#fs-btn.fs-hidden{display:none}</style>
<button id="fs-btn">⛶ PANTALLA COMPLETA</button>
<script>(function(){var b=document.getElementById('fs-btn');b.onclick=function(){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();};document.addEventListener('fullscreenchange',function(){b.classList.toggle('fs-hidden',!!document.fullscreenElement);});})();</script>
</body>
</html>
