<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Cantina</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 2rem;
  }
  .card {
    background: #16213e;
    border: 1px solid #6c9bcf44;
    border-radius: 16px;
    padding: 3rem 2.5rem;
    max-width: 480px;
    width: 100%;
  }
  .icon { font-size: 4rem; margin-bottom: 1rem; }
  h1 { font-size: 1.5rem; color: #6c9bcf; margin-bottom: 0.75rem; }
  p  { font-size: 1rem; color: #aaa; line-height: 1.6; margin-bottom: 1.5rem; }
  .code { font-size: 0.8rem; color: #555; margin-top: 2rem; }
  a {
    display: inline-block;
    background: #6c9bcf;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    padding: 0.9rem 2rem;
    font-size: 1rem;
    touch-action: manipulation;
  }
  a:active { opacity: 0.8; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🍽️</div>
  <h1>Página no encontrada</h1>
  <p>Esta dirección no existe en el sistema.<br>Usá el link correcto para acceder a la cantina.</p>
  <a href="/">Ir al sistema</a>
  <p class="code">Error 404</p>
</div>
</body>
</html>
