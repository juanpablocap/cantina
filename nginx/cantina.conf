server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/cantina.access.log;
    error_log  /var/log/nginx/cantina.error.log;

    # Páginas de error estáticas (servidas por nginx directamente)
    root /var/www/cantina-errors;
    error_page 404             /404.html;
    error_page 500 503         /50x.html;
    error_page 502             /502.html;
    location ~ ^/(404|502|50x)\.html$ {
        internal;
    }

    # ── Netdata monitoring dashboard ─────────────────────
    location /monitor/ {
        proxy_pass         http://127.0.0.1:19999/;
        proxy_http_version 1.1;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 30s;

        # Netdata necesita poder embeberse en iframes propios
        proxy_hide_header  X-Frame-Options;
        add_header X-Frame-Options         "" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    }

    # ── Socket.io (WebSocket) ─────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;

        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
    }

    # ── Assets estáticos (vendor JS, fuentes, íconos) ─────
    # Se sirven desde /vendor/, /fonts/, /images/ via Node.js
    location ~* ^/(vendor|fonts|images)/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_hide_header  Cache-Control;

        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control           "public, max-age=86400, immutable" always;
    }

    # ── API (sin cache) ───────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control           "no-store" always;
    }

    # ── Frontend (HTML + todo lo demás) ──────────────────
    location / {
        proxy_pass             http://127.0.0.1:3001;
        proxy_http_version     1.1;
        proxy_set_header       Host            $host;
        proxy_set_header       X-Real-IP       $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
        proxy_intercept_errors on;

        add_header X-Frame-Options         "SAMEORIGIN" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "no-referrer" always;
        add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control           "no-cache" always;
    }
}
